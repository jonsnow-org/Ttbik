[project]
name = "qalam"
version = "0.1.0"
description = "Qalam: a from-scratch native model (MoE + recurrent depth + native T-LDM)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

name: Sham Merge + Repair + Eval (free CPU runner)

# الدمج والإصلاح والتقييم على CPU بدل أن يأكل ساعات GPU في Kaggle. يستعمل مرحلة الإصلاح والدمج المحروس نفسها،
# وينشر في مجموعة بيانات خاصة sham-merged-checkpoint (لا يكتب فوق أي سلالة أخرى)؛ مرحلة المحادثة تكتشفها
# تلقائياً (قاعدة sham*) وتدمجها عبر ميزانها هي.

on:
  schedule:
    - cron: "40 */8 * * *"
  workflow_dispatch: {}

concurrency:
  group: sham-merge-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    # مفتاح إيقاف طارئ: متغير مستودع SHAM_PAUSE_ALL أو SHAM_PAUSE_MERGE_EVAL = 1 يتخطّى المهمة
    if: ${{ vars.SHAM_PAUSE_ALL != '1' && vars.SHAM_PAUSE_MERGE_EVAL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sham-main   # كود شام من فرعه الخاص؛ الفرع الرئيسي للمستودع (جلسة أثر) لا يُدمج فيه كود النموذج

      - name: Free disk (checkpoints are GBs)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /kaggle/working && sudo chown -R "$USER" /kaggle/working
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU only)
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install tokenizers pillow numpy requests beautifulsoup4 kaggle datasets soundfile imageio-ffmpeg av

      - name: Repair, merge through the gate, evaluate, publish
        working-directory: ai-system/colab/sham_small
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sham_ci_merge.py

name: "Donor bake-off: three isolated ModelScope Studios"
on:
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
    paths:
      - "experiments/donor-bakeoff/**"
      - ".github/workflows/donor-bakeoff-modelscope.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: donor-bakeoff-modelscope-v2
  cancel-in-progress: true
jobs:
  deploy-candidate:
    name: ${{ matrix.candidate.label }} — isolated Studio
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        candidate:
          - id: qwen35-9b
            label: Qwen3.5-9B low-refusal
            studio: sham-donor-qwen35-9b-test
            config: qwen35-9b.json
          - id: gemma4-e4b
            label: Gemma 4 E4B low-refusal
            studio: sham-donor-gemma4-e4b-test
            config: gemma4-e4b.json
          - id: minicpm-o45
            label: MiniCPM-o 4.5
            studio: sham-donor-minicpmo45-test
            config: minicpm-o45.json
    env:
      MS: https://www.modelscope.cn
      OWNER: novaai2026
      REPO: ${{ matrix.candidate.studio }}
      CANDIDATE_ID: ${{ matrix.candidate.id }}
      CANDIDATE_CONFIG: ${{ matrix.candidate.config }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated donor app and candidate manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/donor-bakeoff/app.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = {
              "qwen35-9b.json": "mmproj_filename",
              "gemma4-e4b.json": "mmproj_filename",
              "minicpm-o45.json": "mmproj_filename",
          }
          for filename, field in required.items():
              path = Path("experiments/donor-bakeoff/candidates") / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              if not data.get(field) or not data.get("filename") or not data.get("repo_id"):
                  raise SystemExit(f"Invalid candidate manifest: {filename}")
              print(f"{filename}: main GGUF and projector configured")
          PY
      - name: Verify credentials and inspect free CPU hardware
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          curl -fsS --connect-timeout 8 --max-time 20 -H "Authorization: Bearer $T" "$MS/openapi/v1/users/me" > account.json
          curl -fsS --connect-timeout 8 --max-time 20 -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/hardware?sdk_type=gradio" > hardware.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,re,sys
          raw=json.load(open("hardware.json",encoding="utf-8"))
          items=raw.get("data") or raw.get("Data") or raw.get("items") or []
          if isinstance(items,dict):
              items=items.get("items") or items.get("hardware") or items.get("resources") or []
          def mem_gb(item):
              name=str(item.get("name") or item.get("hardware") or "").lower()
              nums=re.findall(r"(\d+)\s*g(?:b)?(?:-|$)",name)
              return max(map(int,nums),default=0)
          def cpu_count(item):
              m=re.search(r"(\d+)v-cpu",str(item.get("name") or "").lower())
              return int(m.group(1)) if m else 0
          free=[]
          for item in items if isinstance(items,list) else []:
              if not isinstance(item,dict): continue
              name=str(item.get("name") or item.get("hardware") or "")
              kind=str(item.get("resource_type") or item.get("type") or "").lower()
              if not name or "cpu" not in name.lower() or kind=="paid" or name.lower().startswith("paid/") or item.get("is_paid") is True:
                  continue
              if item.get("available") is False or item.get("is_available") is False:
                  continue
              free.append((mem_gb(item),cpu_count(item),name))
          if not free: raise SystemExit("No free CPU Studio hardware; refusing paid hardware.")
          best=max(free,key=lambda x:(x[0],x[1]))
          print("HW="+best[2])
          print("HW_MEM_GB="+str(best[0]))
          print("Available free CPU Studio hardware: "+json.dumps([{"name":n,"memory_gb":m,"vcpus":c} for m,c,n in free]),file=sys.stderr)
          PY
          echo "ModelScope account authenticated; token and account identifiers were not printed."
      - name: Create or safely upgrade only this private candidate Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 8 --max-time 20 -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "Experiment Studio lookup HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Existing private candidate Studio found."
            # Retry only the two failed candidates on a larger free CPU flavor, when
            # ModelScope explicitly reports that flavor as available to this Studio.
            if [ "$CANDIDATE_ID" != "qwen35-9b" ]; then
              hw_code=$(curl -sS --connect-timeout 8 --max-time 20 -o studio-hardware.json -w '%{http_code}' \
                --get --data-urlencode "sdk_type=gradio" --data-urlencode "studio=$OWNER/$REPO" \
                -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/hardware")
              echo "Per-Studio hardware availability HTTP $hw_code"
              if [ "$hw_code" = "200" ]; then
                python3 - <<'PY' > upgrade-hardware.json
          import json,re,sys
          raw=json.load(open("studio-hardware.json",encoding="utf-8"))
          items=raw.get("data") or raw.get("Data") or raw.get("items") or []
          if isinstance(items,dict):
              items=items.get("items") or items.get("hardware") or items.get("resources") or []
          def mem_gb(item):
              name=str(item.get("name") or item.get("hardware") or "").lower()
              nums=re.findall(r"(\d+)\s*g(?:b)?(?:-|$)",name)
              return max(map(int,nums),default=0)
          def cpu_count(item):
              m=re.search(r"(\d+)v-cpu",str(item.get("name") or "").lower())
              return int(m.group(1)) if m else 0
          free=[]
          for item in items if isinstance(items,list) else []:
              if not isinstance(item,dict): continue
              name=str(item.get("name") or item.get("hardware") or "")
              kind=str(item.get("resource_type") or item.get("type") or "").lower()
              if not name or "cpu" not in name.lower() or kind=="paid" or name.lower().startswith("paid/") or item.get("is_paid") is True:
                  continue
              if item.get("available") is False or item.get("is_available") is False:
                  continue
              free.append((mem_gb(item),cpu_count(item),name))
          candidates=[x for x in free if x[0]>=16]
          print("Available per-Studio FREE CPU choices: "+json.dumps([{"name":n,"memory_gb":m,"vcpus":c} for m,c,n in free]),file=sys.stderr)
          if candidates:
              best=max(candidates,key=lambda x:(x[0],x[1]))
              print(json.dumps({"hardware":best[2],"memory_gb":best[0],"vcpus":best[1]}))
          else:
              print("{}")
          PY
                upgrade_hw=$(python3 -c "import json;print(json.load(open('upgrade-hardware.json')).get('hardware',''))")
                if [ -n "$upgrade_hw" ]; then
                  echo "Upgrading $CANDIDATE_ID to a free $upgrade_hw flavor."
                  python3 - "$upgrade_hw" <<'PY' > settings.json
          import json,sys
          print(json.dumps({"hardware":sys.argv[1]}))
          PY
                  patch_code=$(curl -sS --connect-timeout 8 --max-time 30 -o settings-response.json -w '%{http_code}' \
                    -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                    --data-binary @settings.json "$MS/openapi/v1/studios/$OWNER/$REPO/settings")
                  echo "Free hardware settings HTTP $patch_code"
                  if [ "$patch_code" -lt 200 ] || [ "$patch_code" -ge 300 ]; then cat settings-response.json; exit 1; fi
                  python3 - <<'PY'
          import json
          d=json.load(open("settings-response.json",encoding="utf-8"))
          if d.get("success") is False: raise SystemExit("ModelScope rejected the free hardware upgrade.")
          print("ModelScope accepted the candidate's free hardware upgrade.")
          PY
                else
                  echo "::warning::No free 16GB-or-larger CPU flavor is available for $CANDIDATE_ID; no paid resource was selected."
                fi
              else
                echo "::warning::Could not query candidate-specific free hardware; keeping the current Studio flavor."
              fi
            fi
          elif [ "$code" = "404" ]; then
            export OWNER REPO HW
            python3 - <<'PY' > create.json
          import json,os
          print(json.dumps({"owner":os.environ["OWNER"],"repo_name":os.environ["REPO"],"sdk_type":"gradio","visibility":"private","hardware":os.environ["HW"],"display_name":os.environ["REPO"]}))
          PY
            code=$(curl -sS --connect-timeout 8 --max-time 30 -o create-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @create.json "$MS/openapi/v1/studios")
            echo "Experiment Studio create HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then cat create-response.json; echo "::error::ModelScope rejected isolated Studio creation."; exit 1; fi
          else
            cat studio.json
            echo "::error::Unexpected lookup status; refusing to alter an unknown Studio."
            exit 1
          fi
      - name: Push isolated benchmark app
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "donor bake-off CI"
          git config --global user.email "donor-bakeoff@users.noreply.github.com"
          git clone "https://oauth2:$T@www.modelscope.cn/studios/$OWNER/$REPO.git" experiment-studio 2>&1 | sed "s/$T/***/g"
          cp experiments/donor-bakeoff/app.py experiment-studio/app.py
          cp experiments/donor-bakeoff/requirements.txt experiment-studio/requirements.txt
          cp "experiments/donor-bakeoff/candidates/$CANDIDATE_CONFIG" experiment-studio/candidate.json
          mkdir -p experiment-studio/vendor
          cp experiments/donor-bakeoff/vendor/llama_cpp_server.py experiment-studio/vendor/llama_cpp_server.py
          cp experiments/donor-bakeoff/vendor/LICENSE.md experiment-studio/vendor/LICENSE.md
          printf '%s\n' "# Isolated donor experiment: $REPO" "Private test only; does not load or modify Sham v1, Nova, or current Sham v2." "Only two public read-only tools execute: public GitHub repository-root listing and HTTP reachability of ttbik.vercel.app; no connector credentials or write actions are available. The Vercel check is not deployment-control-plane status." > experiment-studio/README.md
          cd experiment-studio
          git add app.py requirements.txt candidate.json README.md vendor/llama_cpp_server.py vendor/LICENSE.md
          git diff --cached --quiet || git commit -m "Add isolated donor evaluation app for $CANDIDATE_ID"
          git push origin HEAD:master 2>&1 | sed "s/$T/***/g"
      - name: Deploy isolated Studio and wait for the model
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
          EXPECTED_APP_REVISION="donor-bakeoff-2026-10-30-r5"
          mkdir -p "donor-bakeoff-output/$CANDIDATE_ID"
          show_logs() { for kind in build run; do body=$(curl -sS --connect-timeout 5 --max-time 15 -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/$kind" || true); echo "Studio $kind logs:"; printf '%s\\n' "$body" | tail -c 5000 || true; done; }
          get_model_phase() {
            local result_code
            result_code=$(curl -sS --connect-timeout 5 --max-time 30 -o status-result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"data":[]}' \
              "$API/gradio_api/run/status" || true)
            [ "$result_code" = "200" ] || { echo "status direct HTTP $result_code"; cat status-result.json 2>/dev/null || true; return 1; }
            python3 - status-result.json <<'PY'
          import json,sys
          raw=json.load(open(sys.argv[1],encoding="utf-8"))
          values=raw.get("data") if isinstance(raw,dict) else None
          if not isinstance(values,list): values=[raw]
          for value in values:
              if isinstance(value,str):
                  try: value=json.loads(value)
                  except Exception: continue
              if isinstance(value,dict) and value.get("phase"):
                  if value.get("error"):
                      print("Candidate diagnostic: " + str(value.get("error"))[:6500], file=sys.stderr)
                  print("Candidate status detail: " + json.dumps({k:value.get(k) for k in ("phase","candidate","load_seconds","context_tokens","threads","media_capabilities")},ensure_ascii=False), file=sys.stderr)
                  open("status-app-revision.txt","w",encoding="utf-8").write(str(value.get("app_revision") or ""))
                  print(str(value["phase"]).lower())
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          }
          # Reuse an already-ready private Studio; do not redeploy/re-download a model
          # merely because a GitHub Actions job was retried.
          READY=0
          studio_code=$(curl -sS --connect-timeout 5 --max-time 15 -o studio-status.json -w '%{http_code}' \\
            -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
          state=""
          if [ "$studio_code" = "200" ]; then
            state=$(python3 -c "import json;d=json.load(open('studio-status.json'));d=d.get('data') or d.get('Data') or d;print((d.get('runtime') or {}).get('status') or d.get('status') or '')" 2>/dev/null || true)
          fi
          echo "Existing Studio: HTTP $studio_code; runtime=$state"
          case "$state" in
            Running|running|Ready|ready)
              phase=$(get_model_phase || true)
              revision=$(cat status-app-revision.txt 2>/dev/null || true)
              echo "Existing model phase=$phase; app_revision=$revision"
              if [ "$phase" = "ready" ] && [ "$revision" = "$EXPECTED_APP_REVISION" ]; then READY=1; fi
              ;;
          esac
          if [ "$READY" -ne 1 ]; then
            deploy_code=$(curl -sS --connect-timeout 8 --max-time 30 -o deploy-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" || true)
            echo "Experiment deploy HTTP $deploy_code"
            if [[ "$deploy_code" =~ ^[0-9]{3}$ ]] && [ "$deploy_code" -ge 400 ]; then cat deploy-response.json; exit 1; fi
            SECONDS=0
            while [ "$SECONDS" -lt 5100 ]; do
              studio_code=$(curl -sS --connect-timeout 5 --max-time 15 -o studio-status.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
              state=""
              if [ "$studio_code" = "200" ]; then state=$(python3 -c "import json;d=json.load(open('studio-status.json'));d=d.get('data') or d.get('Data') or d;print((d.get('runtime') or {}).get('status') or d.get('status') or '')" 2>/dev/null || true); fi
              echo "$(date -u +%H:%M:%S) $REPO: HTTP $studio_code; runtime=$state; elapsed=$SECONDS s"
              case "$state" in
                *ail*|*rror*|*topped*) echo "::error::Experiment Studio terminal state: $state"; show_logs; exit 1 ;;
                Running|running|Ready|ready)
                  phase=$(get_model_phase || true)
                  revision=$(cat status-app-revision.txt 2>/dev/null || true)
                  echo "Candidate model phase=$phase; app_revision=$revision"
                  if [ "$phase" = "ready" ] && [ "$revision" = "$EXPECTED_APP_REVISION" ]; then READY=1; break; fi
                  if [ "$phase" = "error" ]; then echo "::error::Candidate failed to load."; show_logs; exit 1; fi
                  ;;
              esac
              sleep 20
            done
          fi
          if [ "$READY" -ne 1 ]; then echo "::error::Candidate not ready within 85 minutes."; show_logs; exit 1; fi
          echo "Candidate model ready on app revision $EXPECTED_APP_REVISION; continuing to the smoke suite."
      - name: Run one short text, code, tool or supported-media test per Gradio event
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        shell: bash
        timeout-minutes: 35
        run: |
          set -uo pipefail
          API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
          DIR="donor-bakeoff-output/$CANDIDATE_ID"
          mkdir -p "$DIR"
          : > "$DIR/smoke-results.jsonl"
          TRANSPORT_ERRORS=0
          for TEST_ID in arabic reasoning_visibility code benign_no_overrefusal github_tool vercel_tool multi_step_tools image_smoke audio_smoke video_smoke; do
            echo "===== $CANDIDATE_ID / $TEST_ID ====="
            python3 - "$TEST_ID" > request.json <<'PY'
          import json,sys
          print(json.dumps({"data":[sys.argv[1]]}))
          PY
            submit_code=$(curl -sS --connect-timeout 8 --max-time 30 -o smoke-event.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              --data-binary @request.json "$API/gradio_api/call/smoke_test" || true)
            echo "submit HTTP $submit_code"
            if [ "$submit_code" != "200" ]; then
              echo "{\"test\":\"$TEST_ID\",\"transport_error\":\"submit HTTP $submit_code\"}" >> "$DIR/smoke-results.jsonl"
              TRANSPORT_ERRORS=1
              continue
            fi
            event_id=$(python3 -c "import json;print(json.load(open('smoke-event.json')).get('event_id',''))" 2>/dev/null || true)
            if [ -z "$event_id" ]; then
              echo "{\"test\":\"$TEST_ID\",\"transport_error\":\"missing Gradio event id\"}" >> "$DIR/smoke-results.jsonl"
              TRANSPORT_ERRORS=1
              continue
            fi
            complete=0
            for attempt in 1 2; do
              poll_file="$DIR/$TEST_ID-attempt-$attempt.sse"
              poll_code=$(curl -sS --connect-timeout 8 --max-time 280 -o "$poll_file" -w '%{http_code}' \
                -H "Authorization: Bearer $T" "$API/gradio_api/call/smoke_test/$event_id" || true)
              echo "poll $attempt HTTP $poll_code"
              if grep -q '^event: complete' "$poll_file" 2>/dev/null; then
                complete=1
                break
              fi
              if grep -q '^event: error' "$poll_file" 2>/dev/null; then
                cat "$poll_file"
                break
              fi
              sleep 2
            done
            if [ "$complete" -eq 1 ]; then
              python3 - "$DIR/$TEST_ID-attempt-$attempt.sse" "$DIR/smoke-results.jsonl" "$TEST_ID" <<'PY'
          import json,sys
          source,target,test_id=sys.argv[1:]
          raw=open(source,encoding="utf-8",errors="replace").read()
          saved=False
          for line in raw.splitlines():
              if not line.startswith("data:"): continue
              try: payload=json.loads(line[5:].strip())
              except Exception: continue
              values=payload if isinstance(payload,list) else [payload]
              for value in values:
                  if isinstance(value,str):
                      try: value=json.loads(value)
                      except Exception: continue
                  if isinstance(value,dict):
                      value.setdefault("test_id",test_id)
                      with open(target,"a",encoding="utf-8") as f:
                          f.write(json.dumps(value,ensure_ascii=False)+"\n")
                      saved=True
          if not saved:
              with open(target,"a",encoding="utf-8") as f:
                  f.write(json.dumps({"test_id":test_id,"transport_error":"empty complete event"})+"\n")
          PY
            else
              echo "{\"test_id\":\"$TEST_ID\",\"transport_error\":\"no terminal complete event\"}" >> "$DIR/smoke-results.jsonl"
              TRANSPORT_ERRORS=1
              echo "::warning::No terminal result for $TEST_ID; continuing so remaining tests are collected."
            fi
          done
          python3 - "$DIR/smoke-results.jsonl" "$DIR/report.json" "$CANDIDATE_ID" <<'PY'
          import json,sys
          source,target,candidate=sys.argv[1:]
          rows=[]
          for line in open(source,encoding="utf-8"):
              try: rows.append(json.loads(line))
              except Exception: pass
          results=[x.get("result") for x in rows if isinstance(x.get("result"),dict)]
          report={
              "candidate_id":candidate,
              "tests":rows,
              "completed_tests":len(results),
              "passed_tests":sum(1 for x in results if x.get("passed") is True),
              "failed_tests":sum(1 for x in results if x.get("passed") is False),
              "unsupported_tests":sum(1 for x in results if x.get("status")=="unsupported" or x.get("passed") is None),
              "transport_errors":sum(1 for x in rows if "transport_error" in x),
          }
          with open(target,"w",encoding="utf-8") as f: json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          if [ "$TRANSPORT_ERRORS" -ne 0 ]; then
            echo "::error::One or more Gradio test events failed at the transport layer."
            exit 1
          fi
          failed_tests=$(python3 -c "import json;d=json.load(open('$DIR/report.json'));print(d['failed_tests'])")
          if [ "$failed_tests" -ne 0 ]; then
            echo "::error::$failed_tests model smoke test(s) did not pass; see the candidate artifact."
            exit 1
          fi
      - name: Upload candidate report, including failed model loads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-bakeoff-${{ matrix.candidate.id }}
          path: donor-bakeoff-output/${{ matrix.candidate.id }}/
          if-no-files-found: warn
          retention-days: 14

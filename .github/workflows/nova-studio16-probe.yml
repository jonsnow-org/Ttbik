name: Nova Studio 16 probe (read-only)
# Asks the international Nova Studio (coder-inference-server-16, the ONE Nova: Qwen3.6-35B-A3B IQ3_XXS) for its status and prints which model file it serves, its phase, context size and
# memory. Never prints the token. Reads only; changes nothing. Manual only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: status of the Nova Studio
        env:
          T: ${{ secrets.MODELSCOPE_AI_TOKEN }}
        run: |
          B="https://studio-jonjithup-coder-inference-server-16.api-inference.modelscope.ai"
          code=$(curl -sS -m 40 -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'content-type: application/json' -d '{}' "$B/gradio_api/call/v2/status")
          echo "status call: HTTP $code"
          if [ "$code" = "200" ]; then
            ev=$(python3 -c "import json;print(json.load(open('r.json')).get('event_id',''))")
            sleep 3
            curl -sS -m 40 -H "Authorization: Bearer $T" "$B/gradio_api/call/status/$ev" > s.txt || true
            python3 - <<'PY'
          import json, re
          raw = open("s.txt", encoding="utf-8", errors="replace").read()
          m = re.search(r"^data: (.*)$", raw, re.M)
          try:
              d = json.loads(json.loads(m.group(1))[0]) if m else {}
          except Exception:
              d = {}
          keys = ("phase", "model", "model_repo", "model_file", "gguf", "alias", "ctx", "ctx_tokens", "n_ctx", "engine", "llama_build", "mem_free_gb", "tldm", "nova_tldm")
          print(json.dumps({k: d[k] for k in keys if k in d} or {"raw": raw[:1200]}, ensure_ascii=False, indent=1))
          PY
          else
            head -c 300 r.json; echo
          fi

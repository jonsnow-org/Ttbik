name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:

  sham2-export-and-donor-preflight:
    name: Sham 2 JSONL export + donor compatibility preflight (no training)
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/sham2-unified-real-donor-data' && contains(github.event.head_commit.message, '[sham2-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sham2-unified-real-donor-data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run the committed deterministic JSONL exporter
        run: |
          python ai-system/tldm/data/export_sham2_jsonl.py --out ai-system/tldm/data/sham2_export
      - name: Validate exported JSONL and manifest without training
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("ai-system/tldm/data/sham2_export")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = ["identity.jsonl", "terminal_tasks.jsonl", "terminal_heldout.jsonl",
                      "heldout2.jsonl", "train.jsonl", "heldout.jsonl",
                      "identity_heldout_prompts.jsonl"]
          for name in expected:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing/empty export: {name}")
              with path.open(encoding="utf-8") as stream:
                  for line_no, line in enumerate(stream, 1):
                      row = json.loads(line)
                      if not isinstance(row, dict):
                          raise SystemExit(f"{name}:{line_no}: JSONL row is not an object")
                      if name != "identity_heldout_prompts.jsonl" and (
                          not isinstance(row.get("prompt"), str) or not row["prompt"].strip()
                          or not isinstance(row.get("target"), str) or not row["target"].strip()
                      ):
                          raise SystemExit(f"{name}:{line_no}: missing prompt/target")
          if manifest.get("stages", {}).get("tools", {}).get("status") != "missing":
              raise SystemExit("tools must remain marked missing")
          if manifest.get("stages", {}).get("arabic", {}).get("status") != "missing":
              raise SystemExit("arabic must remain marked missing")
          if manifest.get("training", {}).get("status") != "partial, not full":
              raise SystemExit("manifest must label the available scope partial, not full")
          print(json.dumps({
              "export_validated": True,
              "row_counts": {k: v.get("rows") for k, v in manifest["files"].items()},
              "tools": "missing",
              "arabic": "missing",
              "training": "partial, not full",
          }, ensure_ascii=False, indent=2))
          PY
      - name: Install CPU PyTorch, NumPy and ModelScope SDK for read-only checkpoint inspection
        run: |
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install modelscope
      - name: Compile the two Sham 2 scripts (static validation only)
        run: |
          python -m py_compile ai-system/tldm/data/export_sham2_jsonl.py ai-system/tldm/sham_tldm/sham2_unified.py
      - name: Run --check-donor (no tokenizer, training, serve, smoke, or gate)
        run: |
          mkdir -p ai-system/tldm/data
          set +e
          python ai-system/tldm/sham_tldm/sham2_unified.py --check-donor > ai-system/tldm/data/sham2_donor_check_report.json 2> ai-system/tldm/data/sham2_donor_check_stderr.log
          status=$?
          set -e
          if python -m json.tool ai-system/tldm/data/sham2_donor_check_report.json > /tmp/sham2_donor_report.json; then
            mv /tmp/sham2_donor_report.json ai-system/tldm/data/sham2_donor_check_report.json
          else
            python - <<'PY'
          import json
          from pathlib import Path
          err = Path("ai-system/tldm/data/sham2_donor_check_stderr.log").read_text(encoding="utf-8", errors="replace")
          Path("ai-system/tldm/data/sham2_donor_check_report.json").write_text(
              json.dumps({
                  "model_id": "novaai2026/sham-v2",
                  "filename": "final_merged.pt",
                  "status": "not_checked",
                  "compatible": None,
                  "reasons": ["--check-donor emitted invalid JSON; stderr: " + err[-3000:]],
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            status=3
          fi
          echo "--check-donor exit code: $status"
          cat ai-system/tldm/data/sham2_donor_check_report.json
          if [ -s ai-system/tldm/data/sham2_donor_check_stderr.log ]; then
            echo "Non-fatal stderr captured separately in sham2_donor_check_stderr.log"
          fi
          echo "$status" > ai-system/tldm/data/sham2_donor_check_exit_code.txt
      - name: Commit review artifacts to this PR branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ai-system/tldm/data/sham2_export
          for artifact in ai-system/tldm/data/sham2_donor_check_report.json ai-system/tldm/data/sham2_donor_check_exit_code.txt ai-system/tldm/data/sham2_donor_check_stderr.log; do
            if [ -f "$artifact" ]; then git add -f "$artifact"; fi
          done
          if git diff --cached --quiet; then
            echo "No review artifacts were produced."
          else
            git commit -m "Add Sham 2 exported data and donor preflight artifacts [skip ci]"
            git push origin HEAD:refs/heads/fix/sham2-unified-real-donor-data
          fi
  sham-media-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test local media readiness without GPU or network weights
        env:
          PYTHONPATH: ai-system/colab/sham_small
        run: |
          python -m pip install numpy pillow       # the media quality gate (media_quality.py) inspects pixels / samples
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch       # the Sham v1 tests (stream QAT, video, tools data) import torch: the same CPU build sham-ci.yml uses
          python -m pip install tokenizers imageio imageio-ffmpeg requests beautifulsoup4
          python -m unittest discover -s ai-system/supervision -p 'test_sham_v2_media_smoke.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_sham_v2_chat_smoke.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_computer_hub_workflow.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_browser_computer.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_computer_box.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_desktop_computer.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_media_video_jobs.py' -v
          python -m unittest discover -s ai-system/colab/sham_small -p 'test_sham_*.py' -v
          python -m unittest discover -s ai-system/distill -p 'test_distill_gen.py' -v
          python -m unittest discover -s ai-system/distill -p 'test_import_chat_export.py' -v
          python -m unittest discover -s ai-system/distill -p 'test_publish_pool.py' -v
          python -m unittest discover -s ai-system/distill -p 'test_exec_verify.py' -v
          python -m unittest discover -s ai-system/tldm/memory -p 'test_memory.py' -v       # T-LDM hidden terminal: file memory (recall, lessons, one memory per model); no model, no network
          python -m unittest discover -s ai-system/tldm/evolution -p 'test_evolution.py' -v       # T-LDM self-evolution: experience admission (PII, consensus, poisoning), lessons, web-learning filters (offline), LoRA adapters/gate/rollback
          python ai-system/terminal/test_tasks.py && python ai-system/terminal/test_app_port.py && python ai-system/terminal/test_approvals.py       # T-LDM agent system: coordinator (phase 1), the app port (phase 3) and the owner's terminal policy of 2026-11-18 (model_computer + approvals)
          python ai-system/terminal/test_mesh.py && python ai-system/terminal/test_mesh_net.py && python -m unittest discover -s ai-system/modelscope-sham -p 'test_sham_mesh_node.py' -v       # terminal mesh: in-process logic, networked client over the in-process hub (signatures, race, poisoned lessons, forged jobs, adapters, offline), Sham 2 node; the multi-process run over the real Worker is terminal-mesh.yml
          PYTHONPATH=ai-agent python -m unittest discover -s ai-agent -p 'test_agent_loop.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_media_backend_selection.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_sham_tldm_serve.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_bank_search.py' -v       # the Studio's bank_search over the central knowledge bank
          python -m py_compile ai-system/modelscope-media/desktop_computer.py ai-system/supervision/test_desktop_computer.py scripts/ops/modelscope_computer_smoke.py scripts/transplant/stage_sham_v2_studio.py ai-system/supervision/sham_v2_chat_smoke.py ai-system/supervision/test_sham_v2_chat_smoke.py
          python -m py_compile ai-system/supervision/sham_v2_media_smoke.py ai-system/supervision/sham_v2_chat_smoke.py ai-system/supervision/test_sham_v2_chat_smoke.py ai-system/modelscope-sham/app.py ai-system/modelscope-sham/sync_to_modelscope.py ai-system/colab/sham_small/sham_toolcall.py
          python -m unittest discover -s scripts/transplant -p 'test_*.py' -v
          python -m unittest discover -s ai-agent -p 'test_*.py' -v       # the free i agent: tools, guard rails and the loop (no network)
          python ai-system/colab/sham_small/sham_intent.py
          python ai-system/modelscope-trainer/app.py --selftest       # the Studio trainer app (jobs, cycles, no network)
          python ai-system/tldm/sham_tldm/sham2_unified.py --selftest-modelscope-api  # old/new SDK signature adapter; no network or training
          python ai-system/tldm/sham_tldm/sham2_unified.py --selftest-lora-layout  # ShamSmall attention/MLP LoRA map; no network or training
          python ai-system/modelscope-trainer/safe_evolve.py --selftest  # replay + no-regress gate; anonymized session records
          python ai-system/modelscope-trainer/studio_guard.py --selftest  # the cross-watch that wakes / restarts the trainer Studios (no network)
          python ai-system/modelscope-runner/app.py --selftest          # sham-runner-1 (runner + guard thread)
          node cloudflare/studio-guard-worker.test.mjs                  # the Cloudflare cron layer of the Studio guard
          python scripts/ops/sham_trainer_status.py --selftest      # trainer status URLs for cn and ai (no network)
          python ai-system/lightning/motion_job.py --selftest         # the motion-tokenizer job

  nova-media-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test Nova media Studio client without network calls
        env:
          PYTHONPATH: ai-system
        run: |
          python -m pip install requests numpy pillow
          python -m unittest discover -s ai-system/app -p 'test_nova_media_*.py' -v
          python -m unittest discover -s ai-system/modelscope-media -p 'test_media_app_startup.py' -v
          python -m unittest discover -s ai-system/modelscope-media -p 'test_desktop_panel.py' -v
          python -m unittest ai-system/modelscope-coder/tests/test_priority_queue.py -v
          python -m unittest ai-system/modelscope-coder/tests/test_slot_restore.py -v
          python -m unittest ai-system/modelscope-coder/tests/test_view_type.py -v
          python -m unittest ai-system/modelscope-coder/tests/test_load_mode.py -v
          python ai-system/modelscope-coder/tests/test_think_cap.py
          python -m py_compile ai-system/app/main.py ai-system/app/council.py ai-system/app/nova_media_studio.py ai-system/app/nova_media_routing.py ai-system/app/test_nova_media_studio.py ai-system/app/test_nova_media_routing.py ai-system/modelscope-media/app.py ai-system/modelscope-studio/app.py ai-system/colab/sham_small/sham_studio_chat.py

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2                        # content-shrink-check compares HEAD with HEAD~1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/znbt-frozen-check.mjs   # what must never change after ZNBt's launch
      - name: Guard content modules against placeholder / shell-artifact clobbering
        run: node scripts/content-shrink-check.mjs HEAD~1
      - run: npm ci
      - name: Run project source regression tests
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/*.test.mjs
      - run: npm run build
      - name: Test Cloudflare gate failover with simulated origin outages
        run: node cloudflare/site-gate/selftest.mjs

  lint:
    # runs in parallel with build; errors fail it, warnings (React-Compiler rules, <a>/<img> advice) do not: see eslint.config.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  sham-v2-runtime-code-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify signed code changes never alter Sham v2 weights or media
        run: python scripts/transplant/push_sham_v2_runtime_code.py --self-test

  sham-v2-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            athar/package-lock.json
      - name: Install application dependencies used by the tests
        run: npm ci
      - name: Install the repository's existing Jest test toolchain
        run: npm ci --prefix athar
      - name: Run every src/lib regression test (Sham v2 routing, Nova/Sham boundary, mini apps, bots, tools)
        # all suites, not a hand-picked list: 116 of 147 suites (incl. the Nova<->Sham boundary guard) never ran in CI before
        run: cd athar && npx jest --config ../jest.media.config.js --rootDir .. --runInBand
  oracle-runner-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Oracle sandbox resource caps, isolation and zero-cost refusal rules
        run: node --test coder-sandbox/runner.test.mjs

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sham-media-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test local media readiness without GPU or network weights
        env:
          PYTHONPATH: ai-system/colab/sham_small
        run: |
          python -m pip install numpy pillow       # the media quality gate (media_quality.py) inspects pixels / samples
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch       # the Sham v1 tests (stream QAT, video, tools data) import torch: the same CPU build sham-ci.yml uses
          python -m pip install tokenizers imageio imageio-ffmpeg requests beautifulsoup4
          python -m unittest discover -s ai-system/supervision -p 'test_sham_v2_media_smoke.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_sham_v2_chat_smoke.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_computer_hub_workflow.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_browser_computer.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_computer_box.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_desktop_computer.py' -v
          python -m unittest discover -s ai-system/supervision -p 'test_media_video_jobs.py' -v
          python -m unittest discover -s ai-system/colab/sham_small -p 'test_sham_*.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_media_backend_selection.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_bank_search.py' -v       # the Studio's bank_search over the central knowledge bank
          python -m py_compile ai-system/modelscope-media/desktop_computer.py ai-system/supervision/test_desktop_computer.py scripts/ops/modelscope_computer_smoke.py scripts/transplant/stage_sham_v2_studio.py ai-system/supervision/sham_v2_chat_smoke.py ai-system/supervision/test_sham_v2_chat_smoke.py
          python -m py_compile ai-system/supervision/sham_v2_media_smoke.py ai-system/supervision/sham_v2_chat_smoke.py ai-system/supervision/test_sham_v2_chat_smoke.py ai-system/modelscope-sham/app.py ai-system/modelscope-sham/sync_to_modelscope.py ai-system/colab/sham_small/sham_toolcall.py
          python -m unittest discover -s scripts/transplant -p 'test_*.py' -v
          python -m unittest discover -s ai-agent -p 'test_*.py' -v       # the free i agent: tools, guard rails and the loop (no network)
          python ai-system/colab/sham_small/sham_intent.py
          python ai-system/modelscope-trainer/app.py --selftest       # the Studio trainer app (jobs, cycles, no network)
          python ai-system/lightning/motion_job.py --selftest         # the motion-tokenizer job

  nova-media-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Nova media Studio client without network calls
        env:
          PYTHONPATH: ai-system
        run: |
          python -m pip install requests numpy pillow
          python -m unittest discover -s ai-system/app -p 'test_nova_media_*.py' -v
          python -m unittest discover -s ai-system/modelscope-media -p 'test_media_app_startup.py' -v
          python -m unittest discover -s ai-system/modelscope-media -p 'test_desktop_panel.py' -v
          python -m unittest ai-system/modelscope-coder/tests/test_priority_queue.py -v
          python -m py_compile ai-system/app/main.py ai-system/app/council.py ai-system/app/nova_media_studio.py ai-system/app/nova_media_routing.py ai-system/app/test_nova_media_studio.py ai-system/app/test_nova_media_routing.py ai-system/modelscope-media/app.py ai-system/modelscope-studio/app.py ai-system/colab/sham_small/sham_studio_chat.py

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2                        # content-shrink-check compares HEAD with HEAD~1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/znbt-frozen-check.mjs   # what must never change after ZNBt's launch
      - name: Guard content modules against placeholder / shell-artifact clobbering
        run: node scripts/content-shrink-check.mjs HEAD~1
      - run: npm ci
      - name: Run project source regression tests
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/*.test.mjs
      - run: npm run build
      - name: Test Cloudflare gate failover with simulated origin outages
        run: node cloudflare/site-gate/selftest.mjs

  lint:
    # runs in parallel with build; errors fail it, warnings (React-Compiler rules, <a>/<img> advice) do not: see eslint.config.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  sham-v2-runtime-code-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify signed code changes never alter Sham v2 weights or media
        run: python scripts/transplant/push_sham_v2_runtime_code.py --self-test

  sham-v2-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            athar/package-lock.json
      - name: Install application dependencies used by the tests
        run: npm ci
      - name: Install the repository's existing Jest test toolchain
        run: npm ci --prefix athar
      - name: Run every src/lib regression test (Sham v2 routing, Nova/Sham boundary, mini apps, bots, tools)
        # all suites, not a hand-picked list: 116 of 147 suites (incl. the Nova<->Sham boundary guard) never ran in CI before
        run: cd athar && npx jest --config ../jest.media.config.js --rootDir .. --runInBand
  oracle-runner-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Oracle sandbox resource caps, isolation and zero-cost refusal rules
        run: node --test coder-sandbox/runner.test.mjs

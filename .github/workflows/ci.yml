name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/znbt-frozen-check.mjs   # what must never change after ZNBt's launch
      - name: Nova Python delivery tests
        run: |
          PYTHONPATH=ai-system python -m unittest discover -s ai-system/tests -v
          python -m py_compile ai-system/app/main.py ai-system/app/telegram_delivery.py
      - run: npm ci
      - run: npm run build

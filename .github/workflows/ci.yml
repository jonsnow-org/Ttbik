name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sham-media-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test local media readiness without GPU or network weights
        env:
          PYTHONPATH: ai-system/colab/sham_small
        run: |
          python -m pip install numpy pillow       # the media quality gate (media_quality.py) inspects pixels / samples
          python -m unittest discover -s ai-system/colab/sham_small -p 'test_sham_*.py' -v
          python -m unittest discover -s ai-system/modelscope-sham -p 'test_media_backend_selection.py' -v
          python -m py_compile ai-system/modelscope-sham/app.py ai-system/modelscope-sham/sync_to_modelscope.py ai-system/colab/sham_small/sham_media_ready.py ai-system/colab/sham_small/sham_toolcall.py
          python ai-system/colab/sham_small/sham_media_ready.py
          python ai-system/colab/sham_small/sham_intent.py

  nova-media-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test Nova media Studio client without network calls
        env:
          PYTHONPATH: ai-system
        run: |
          python -m pip install requests numpy pillow
          python -m unittest discover -s ai-system/app -p 'test_nova_media_*.py' -v
          python -m unittest ai-system/modelscope-coder/tests/test_priority_queue.py -v
          python -m py_compile ai-system/app/main.py ai-system/app/council.py ai-system/app/nova_media_studio.py ai-system/app/nova_media_routing.py ai-system/app/test_nova_media_studio.py ai-system/app/test_nova_media_routing.py ai-system/modelscope-media/app.py ai-system/modelscope-studio/app.py ai-system/colab/sham_small/sham_studio_chat.py ai-system/colab/sham_small/sham_media_ready.py

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/znbt-frozen-check.mjs   # what must never change after ZNBt's launch
      - run: npm ci
      - run: npm run build

  lint:
    # runs in parallel with build; errors fail it, warnings (React-Compiler rules, <a>/<img> advice) do not: see eslint.config.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  sham-v2-runtime-code-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify signed code changes never alter Sham v2 weights or media
        run: python scripts/transplant/push_sham_v2_runtime_code.py --self-test

  sham-v2-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            athar/package-lock.json
      - name: Install application dependencies used by the tests
        run: npm ci
      - name: Install the repository's existing Jest test toolchain
        run: npm ci --prefix athar
      - name: Run Sham v2 routing and model-access regression tests
        run: cd athar && npx jest --config ../jest.media.config.js --rootDir .. --runInBand --runTestsByPath ../src/lib/__tests__/shamAgent.test.ts ../src/lib/__tests__/coderModels.test.ts ../src/lib/__tests__/shamContinuation.test.ts


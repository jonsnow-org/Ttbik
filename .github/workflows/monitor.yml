name: monitor
# THE monitoring bot (owner's order 2026-11-14: one comprehensive bot, no GitHub message for every small event). It replaces section-supervisors,
# promo-supervisor, error-triage, oracle-freshness and stale-issues. Every hour it checks every section (site pages, bots' webhooks, scheduled workflows,
# frozen coin facts) and rewrites ONE issue "Monitoring: all systems" in place (an edit sends no mail). A comment (= an e-mail) is added only for an outage
# of 6+ hours and once more for its recovery (scripts/supervisors/run.mjs, notifyDecision). The only automatic repair is one rerun of the idempotent workflows
# (decideRerun). Site errors become a GitHub issue ("auto-error", fixed by the scheduled Claude session) ONLY when the same error repeated 10+ times; one-off
# errors stay in the site's error log and cost no mail.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: frozen coin facts
        id: frozen
        continue-on-error: true
        run: node scripts/znbt-frozen-check.mjs
      - name: one report
        run: node scripts/supervisors/run.mjs all
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FROZEN_CHECK: ${{ steps.frozen.outcome == 'success' && 'ok' || 'fail' }}
      - name: issues only for errors that repeat (10+ times)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE_BASE=$(jq -r '[.engineUrl, .vercelUrl] | map(select(length>0)) | .[0]' deploy/hosting/site.json)
          gh label create auto-error --color B60205 --description "found by the site's error log, to be fixed automatically" 2>/dev/null || true
          code=$(curl -sS -o open.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" -G "$SITE_BASE/api/ops/errors" --data-urlencode "status=open")
          echo "errors endpoint: HTTP $code"
          if [ "$code" = "200" ]; then
            jq -c '.errors[] | select(.count >= 10)' open.json | while read -r row; do
              fp=$(echo "$row" | jq -r .fp)
              n=$(gh issue list --label auto-error --state all --search "$fp in:title" --json number --jq 'length')
              if [ "$n" = "0" ]; then
                title="[auto-error] $(echo "$row" | jq -r '.source + " · " + (.message | split("\n")[0] | .[0:90])') · $fp"
                body=$(echo "$row" | jq -r '"**Source:** \(.source)\n**Seen:** \(.count) times, first \(.first_seen), last \(.last_seen)\n\n**Message**\n```\n\(.message)\n```\n\n**Stack**\n```\n\(.stack // "none")\n```\n\n**Context:** \(.ctx // "none")\n\nFingerprint `\(.fp)`. Fix the root cause in the repository (see CLAUDE.md: hands-off paths stay untouched), open a pull request, then close this issue; closing marks the error fixed."')
                gh issue create --label auto-error --title "$title" --body "$body" || true
              fi
            done
          fi
          # issues closed by the fixing session mark their error as fixed
          gh issue list --label auto-error --state closed --limit 50 --json title --jq '.[].title' | while read -r t; do
            fp=$(echo "$t" | grep -o '[0-9a-f]\{16\}$' || true)
            [ -n "$fp" ] && curl -sS -o /dev/null -X POST "$SITE_BASE/api/ops/errors" -H "Authorization: Bearer ${CRON_SECRET}" -H 'content-type: application/json' -d "{\"fp\":\"$fp\",\"status\":\"fixed\",\"note\":\"issue closed\"}" || true
          done

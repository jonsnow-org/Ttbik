name: zenobia-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: zenobia-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/hosting/site.json
            scripts/hosting/select-site-base.sh
      - name: select public origin (Gate first, Oracle fallback)
        run: bash scripts/hosting/select-site-base.sh deploy/hosting/site.json >> "$GITHUB_ENV"
      - name: tell the owner when ZNB's holders or supply change
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          code=$(curl -sS -m 90 -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_BASE}/api/cron/zenobia-watch")
          echo "HTTP ${code}"; cat body.json; echo
          [[ "${code}" =~ ^2[0-9][0-9]$ ]]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

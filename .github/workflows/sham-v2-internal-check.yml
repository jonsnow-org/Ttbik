name: Sham v2 internal token generator check (read-only)

# Owner question: would Sham v2's OWN token media generator ("شام الداخلي", not the donor ready weights) work? Downloads the checkpoint of novaai2026/sham-v2 (no media bundle), loads it like the Studio,
# runs make_media for an image and a speech prompt on CPU, applies media_quality.check_*. Publishes nothing, changes no default, touches no Studio.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "ModelScope model repo"
        required: false
        default: "novaai2026/sham-v2"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0 tokenizers==0.23.2 numpy pillow soundfile imageio-ffmpeg fastapi uvicorn python-multipart ddgs beautifulsoup4 modelscope
      - name: Internal generator, image + audio (+ video notice)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODEL: ${{ inputs.model }}
          OUT: ${{ runner.temp }}/internal
        run: python scripts/sham-internal-check/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sham-v2-internal
          path: ${{ runner.temp }}/internal
          if-no-files-found: ignore

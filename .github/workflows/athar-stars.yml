name: athar-stars
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: athar-stars
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/hosting/site.json
      - name: the site's public address (deploy/hosting/site.json)
        run: echo "SITE_BASE=$(jq -r '[.engineUrl, .vercelUrl] | map(select(length>0)) | .[0]' deploy/hosting/site.json)" >> "$GITHUB_ENV"
      - name: expire, close and refund Athar Stars orders
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          # The gateway sometimes answers 530 (origin unreachable) for a minute: retry, then try the Vercel standby. The sweep is idempotent.
          VERCEL_BASE=$(jq -r '.vercelUrl // empty' deploy/hosting/site.json)
          code=000
          for base in "${SITE_BASE}" "${SITE_BASE}" "${VERCEL_BASE}"; do
            [ -n "${base}" ] || continue
            code=$(curl -sS -m 60 -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${base}/api/cron/athar-stars" || echo 000)
            echo "HTTP ${code} (${base})"
            [ "${code}" -lt 500 ] && [ "${code}" != "000" ] && break
            sleep 20
          done
          cat body.json 2>/dev/null | head -c 400; echo
          [ "${code}" -lt 500 ] && [ "${code}" != "000" ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

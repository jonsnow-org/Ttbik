name: athar-stars
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: athar-stars
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: expire, close and refund Athar Stars orders
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          code=$(curl -sS -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_BASE}/api/cron/athar-stars")
          echo "HTTP ${code}"; cat body.json; echo
          [ "${code}" -lt 500 ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_BASE: ${{ vars.SITE_BASE || 'https://ttbik.vercel.app' }}   # repo variable SITE_BASE = the gate's address after the move

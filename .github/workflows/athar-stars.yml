name: athar-stars
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: athar-stars
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/hosting/site.json
            scripts/hosting/select-site-base.sh
      - name: select public origin (Gate first, Oracle fallback)
        run: bash scripts/hosting/select-site-base.sh deploy/hosting/site.json >> "$GITHUB_ENV"
      - name: expire, close and refund Athar Stars orders
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          code=$(curl -sS --connect-timeout 8 --max-time 60 -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_BASE}/api/cron/athar-stars" || true)
          echo "HTTP ${code} (${SITE_BASE_SOURCE})"
          cat body.json 2>/dev/null | head -c 400; echo
          [[ "${code}" =~ ^2[0-9][0-9]$ ]]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

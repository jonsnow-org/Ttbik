name: Nova shared-start state probe (free, read-only)
# Can the SHARED start of every Nova prompt (system text + the fixed tool list) be saved ONCE to disk and restored by a NEW server process, so that a DIFFERENT conversation that begins
# with the same start reads only its own new tokens (seconds) instead of the whole start (minutes)? Same llama.cpp build, model and flags as the coder Studio, pinned to 2 cores.
# Prints per case: tokens read now, tokens taken from cache, seconds; and the size of the saved file. Nothing on any Studio is touched. Manual only.
on:
  workflow_dispatch:
    inputs:
      start_repeat:
        description: "how many times the filler sentence is repeated in the shared start (60 = about 2.5k tokens)"
        required: false
        default: "100"
permissions:
  contents: read
env:
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o model.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
      - name: shared start saved once, restored in a new process, used by a different conversation
        env:
          REPEAT: ${{ inputs.start_repeat }}
        run: |
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          mkdir -p slots
          python3 - <<'PY'
          import json, os
          n = int(os.environ.get("REPEAT") or 100)
          start = ("You are Nova, a coding agent. Tool list: computer_run runs a command, computer_read reads a file, computer_search searches text, computer_edit changes a file, computer_publish sends the change to GitHub. " * n)
          def body(user): return {"messages": [{"role": "system", "content": start}, {"role": "user", "content": user}], "max_tokens": 4, "stream": False, "chat_template_kwargs": {"enable_thinking": False}}
          json.dump(body("Find the bug in the streak bot."), open("a.json", "w"))           # conversation A: warms the start
          json.dump(body("Write a poem about the sea."), open("b.json", "w"))                # conversation B: a different request, same start
          json.dump(body("Find the bug in the streak bot, then fix it and open a pull request."), open("a2.json", "w"))   # conversation A continues
          PY
          start() { taskset -c 0,1 "$BIN/llama-server" -m model.gguf -c 32768 -t 2 -np 1 -n -1 --jinja --cache-ram 1024 --ctx-checkpoints 8 --slot-save-path "$PWD/slots" --host 127.0.0.1 --port 8080 > server.log 2>&1 &
                  PID=$!; for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && return; kill -0 $PID 2>/dev/null || { echo "server exited"; tail -5 server.log; exit 0; }; sleep 3; done; }
          post() { curl -s -m 1500 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @"$1"; }
          show() { python3 -c "import json,sys;t=json.load(sys.stdin).get('timings',{});print('$1: read now=',t.get('prompt_n'),'from cache=',t.get('cache_n'),'seconds=',round(t.get('prompt_ms',0)/1000,1))"; }
          { start
            post a.json | show "1. conversation A, cold start"
            s0=$(date +%s.%N); curl -s -X POST "http://127.0.0.1:8080/slots/0?action=save" -H 'content-type: application/json' -d '{"filename":"start.bin"}' > /dev/null; s1=$(date +%s.%N)
            echo "2. saved once: $(python3 -c "print(round($s1-$s0,2))") s"; ls -l slots | tail -2
            post b.json | show "3. conversation B, same process (cache already warm)"
            kill $PID; wait $PID 2>/dev/null; sleep 2
            start
            post b.json | show "4. conversation B, NEW process, nothing restored (the cold case we have today)"
            kill $PID; wait $PID 2>/dev/null; sleep 2
            start
            r0=$(date +%s.%N); curl -s -X POST "http://127.0.0.1:8080/slots/0?action=restore" -H 'content-type: application/json' -d '{"filename":"start.bin"}' > /dev/null; r1=$(date +%s.%N)
            echo "5. restore the saved start into a NEW process: $(python3 -c "print(round($r1-$r0,2))") s"
            post b.json | show "6. conversation B (different request) after the restore  <== the point"
            post a2.json | show "7. conversation A continued after the restore"
            kill $PID; wait $PID 2>/dev/null
          } | tee result.txt
          { echo "### Shared start state (2 cores)"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

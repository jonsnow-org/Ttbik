name: Modes bench (Nova vs Sham v2 latency, quality; SDXS image settings)
# Measures the SAME prompts (the bot's real system text, tool list and tool conversation) on one coder Studio (Nova) and on the Sham v2 Studio, and times SDXS image settings on a CPU
# runner. Never prints the token. Manual, or a push that touches this file / scripts/modes-bench.
on:
  workflow_dispatch:
    inputs:
      studio:
        description: "Nova Studio number 1-5"
        default: "2"
      part:
        description: "nova | sham | image | all"
        default: "all"
  push:
    paths: ["scripts/modes-bench/**", ".github/workflows/modes-bench.yml"]
permissions:
  contents: read
jobs:
  nova:
    if: ${{ (github.event.inputs.part || 'all') == 'all' || github.event.inputs.part == 'nova' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - working-directory: scripts/modes-bench
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python3 nova_bench.py "${{ github.event.inputs.studio || '4' }}"
      - uses: actions/upload-artifact@v4
        with: { name: nova-bench, path: scripts/modes-bench/nova_*.json }
  sham:
    if: ${{ (github.event.inputs.part || 'all') == 'all' || github.event.inputs.part == 'sham' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - working-directory: scripts/modes-bench
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python3 sham_bench.py
      - uses: actions/upload-artifact@v4
        with: { name: sham-bench, path: scripts/modes-bench/sham_v2.json }
  image:
    if: ${{ (github.event.inputs.part || 'all') == 'all' || github.event.inputs.part == 'image' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate huggingface_hub pillow safetensors
      - run: python scripts/modes-bench/image_bench.py img_out
      - uses: actions/upload-artifact@v4
        with: { name: image-bench, path: img_out }

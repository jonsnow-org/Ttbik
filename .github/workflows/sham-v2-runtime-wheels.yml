name: Sham v2 runtime wheels (mirror llama-cpp-python into Sham's own model repo)

# Owner-approved 2026-11-25 (decision 4: q4_k_m decoding). The Sham v2 Studio (cn) installs llama-cpp-python at run time, but the CPU wheel index
# points at GitHub release assets, and the cn Studio times out on them (live log 2026-11-25: ReadTimeoutError on release-assets.githubusercontent.com),
# so decoding stayed in PyTorch. This copies the ONE pinned wheel (sha256 checked) into novaai2026/sham-v2 under runtime_wheels/; sham_gguf.hub_wheel()
# installs it from there. No other file of the model repo is touched. The Sham v2 Studio deploy follows this workflow (workflow_run).
on:
  workflow_dispatch: {}

concurrency:
  group: sham-v2-runtime-wheels
  cancel-in-progress: false

permissions:
  contents: read

env:
  WHEEL: llama_cpp_python-0.3.19-cp311-cp311-linux_x86_64.whl
  WHEEL_URL: https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp311-cp311-linux_x86_64.whl
  WHEEL_SHA256: bf993a7c49fa2c71d851aadc6ad7d26149109dbb87f4466326d8fa60c49148c7

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch the pinned wheel (checksum verified)
        run: |
          curl -sSfL --retry 5 -o "$WHEEL" "$WHEEL_URL"
          echo "$WHEEL_SHA256  $WHEEL" | sha256sum -c -
      - name: Upload into novaai2026/sham-v2 (runtime_wheels/ only)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          python -m pip install -q "modelscope>=1.26.0"
          python - <<'PY'
          import os
          from modelscope.hub.api import HubApi
          api = HubApi()
          api.login(os.environ["MODELSCOPE_TOKEN"])
          name = os.environ["WHEEL"]
          api.upload_file(path_or_fileobj=name, path_in_repo="runtime_wheels/" + name, repo_id="novaai2026/sham-v2", repo_type="model",
                          commit_message="Sham Pro: llama-cpp-python CPU wheel for q4_k_m decoding (mirror, sha256 " + os.environ["WHEEL_SHA256"][:12] + ")")
          print("uploaded runtime_wheels/" + name, flush=True)
          PY

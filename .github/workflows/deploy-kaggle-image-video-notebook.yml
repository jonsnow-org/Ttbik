name: Deploy Kaggle Image/Video Model Notebook

# لماذا هذا الـworkflow موجود: نفس سبب deploy-kaggle-notebook.yml —
# رفع دفتر ai-system/colab/generate_image_model.ipynb كان يدوياً بالكامل
# عبر واجهة Kaggle. owner request 2026-09-09 ("لنقم بربطه ونشغله"):
# ربط هذا الدفتر تحديداً بنفس آلية kaggle kernels push الموثوقة أصلاً.
#
# فرق جوهري عن deploy-kaggle-notebook.yml: ذاك يفترض أن الدفتر
# (merge-and-finetune) موجود مسبقاً على Kaggle بالتأكيد، فيسحب
# إعداداته بـ"kaggle kernels pull ... -m" أولاً بلا بديل. هنا لا يوجد
# يقين إن كان هذا الدفتر (generate-image-model) قد اسُتورد فعلاً إلى
# Kaggle من قبل (owner confirmed: "لا اعلم ان كان مستورد من قبل") —
# فالخطوة أدناه تحاول السحب أولاً (تحفظ GPU/الإنترنت/الخصوصية الحقيقية
# إن كان موجوداً)، وإن فشل ذلك (الكيرنل غير موجود بعد) تُنشئ
# kernel-metadata.json جديداً بنفسها مع تفعيل GPU والإنترنت صراحة —
# لا حاجة لتخمين، ولا حاجة لتدخل يدوي أولاً.
#
# ملاحظة معروفة ومقبولة من المالك (نفس ملاحظة الدفتر الآخر): "kaggle
# kernels push" يُشغّل الدفتر فعلياً على خوادم Kaggle فور الرفع
# (يستهلك من حصة GPU المجانية).
#
# دليل حقيقي، 2026-09-09 (owner screenshot, Kaggle's own Version
# History — 5 نسخ متتالية فشلت كلها خلال ~20 ثانية بالضبط، دائماً عند
# خلية تسجيل الدخول إلى Hugging Face، بHTTPError من واجهة Kaggle
# الداخلية لجلب الأسرار): دفع الدفتر عبر الـAPI (kernel-metadata.json
# لا يحمل حقل أسرار إطلاقاً) يبدو أنه يُعطّل ربط الأسرار المرفقة
# (Add-ons → Secrets) لهذا الكيرنل بالضبط كما يُعيد ضبط نوع المعالج —
# حتى إن ظهرت الأسرار "مفعّلة" على واجهة Kaggle، فقد تحتاج إعادة
# تفعيل يدوية (فك التفعيل ثم إعادته، أو التحقق والحفظ) بعد كل دفع
# تلقائي، تماماً كإعادة اختيار T4 بعد كل دفع. لا حل برمجي معروف لهذا
# حتى الآن (لا حقل أسرار في kernel-metadata.json عبر الـAPI) — يبقى
# فحصاً يدوياً بعد كل دفع حتى نجد بديلاً.
#
# لا جدولة أسبوعية هنا عمداً (بخلاف الدفتر الآخر) — هذا الدفتر دفتر
# اقتناء نموذج جاهز يُشغَّل مرة واحدة، لا تدريب متكرر (راجع تعليق
# الخلية الأولى في الدفتر نفسه: "لا حاجة لتشغيل هذا الدفتر أسبوعياً").
on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      - "ai-system/colab/generate_image_model.ipynb"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ttbik
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Try to pull an existing kernel first (preserves its real GPU/internet/privacy settings if it exists)
        id: pull
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ./kaggle-kernel
          if kaggle kernels pull jonsnowjonsnow/generate-image-model -p ./kaggle-kernel -m; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fresh kernel metadata if it didn't exist yet (GPU + internet explicitly on, private)
        if: steps.pull.outputs.existed == 'false'
        run: |
          cat > ./kaggle-kernel/kernel-metadata.json <<'EOF'
          {
            "id": "jonsnowjonsnow/generate-image-model",
            "title": "generate-image-model",
            "code_file": "generate_image_model.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Overwrite the notebook content with this repo's version
        run: |
          CODE_FILE=$(jq -r '.code_file' ./kaggle-kernel/kernel-metadata.json)
          cp ai-system/colab/generate_image_model.ipynb "./kaggle-kernel/$CODE_FILE"

      - name: Push notebook to Kaggle (also triggers a real run there)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p ./kaggle-kernel

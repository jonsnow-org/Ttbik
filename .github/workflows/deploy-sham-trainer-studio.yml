name: Deploy the Sham live-trainer Studio (free ModelScope CPU, GPU if the Studio has one)

# Owner's order 2026-11-11: run the important training on ModelScope in both domains, automatically, GPU when it exists and CPU when it does not, like on Kaggle.
# A Studio (private, free hardware) whose app trains Sham with sham_live (the same job as the GitHub / Oracle CPU trainers) and publishes its own lineage sham-crawl-<name>;
# the merge job discovers it by the sham-crawl-* rule. Studio network (read from its worker status 2026-11-11): kaggle.com, github.com, hf-mirror.com, pypi.org reachable; huggingface.co blocked.
# Secrets used: MODELSCOPE_TOKEN (cn account) or MODELSCOPE_AI_TOKEN (site=ai), KAGGLE_API_TOKEN (copied into the PRIVATE Studio's own secrets so it can fetch and publish the datasets).
on:
  workflow_dispatch:
    inputs:
      site:
        description: "cn = modelscope.cn (account novaai2026) | ai = modelscope.ai (the owner's international account, secret MODELSCOPE_AI_TOKEN)"
        required: false
        default: "cn"
      repo:
        description: "Studio name under novaai2026 (created when missing, private, free hardware only)"
        required: false
        default: "sham-trainer-1"
      name:
        description: "Lineage name: publishes sham-crawl-<name> (one name per Studio)"
        required: false
        default: "ms1"
      hours:
        description: "Hours per training cycle (0.5 - 10)"
        required: false
        default: "5"
      job:
        description: "What this Studio trains: live (general) | images | audio | chat | tools | text | codec (HD image tokenizer)"
        required: false
        default: "live"

permissions:
  contents: read

concurrency:
  group: deploy-sham-trainer-${{ inputs.site || 'cn' }}-${{ inputs.repo || 'sham-trainer-1' }}
  cancel-in-progress: false

env:
  MS: ${{ inputs.site == 'ai' && 'https://www.modelscope.ai' || 'https://www.modelscope.cn' }}
  MSHOST: ${{ inputs.site == 'ai' && 'www.modelscope.ai' || 'www.modelscope.cn' }}
  OWNER: ${{ inputs.site == 'ai' && 'Jonjithup' || 'novaai2026' }}
  SITE: ${{ inputs.site || 'cn' }}
  REPO: ${{ inputs.repo || 'sham-trainer-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/free-services-marketplace-h6rwk2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Self-test of the trainer app
        run: python3 ai-system/modelscope-trainer/app.py --selftest

      - name: Create the Studio when missing (free hardware only)
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          if [ "$code" = "200" ] && python3 -c "import json,sys;d=json.load(open('studio.json'));sys.exit(0 if (d.get('data') or d.get('Data')) else 1)" 2>/dev/null; then echo "Studio $REPO exists"; exit 0; fi
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/hardware?sdk_type=gradio" > hw.json
          HW=$(python3 - <<'PY'
          import json
          items=((json.load(open("hw.json")).get("data") or {}).get("hardware")) or []
          free=[i for i in items if str(i.get("resource_type","")).lower()=="free" and not str(i.get("name","")).startswith("paid/")]
          print((free or [{"name":"platform/2v-cpu-16g-mem"}])[-1]["name"])
          PY
          )
          case "$HW" in paid/*) echo "::error::Refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':os.environ['REPO']}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "create HTTP $code (hardware $HW)"; head -c 800 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Studio creation refused"; exit 1; }
          sleep 10

      - name: Stage the trainer app and the sham_small code, push to the Studio
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://oauth2:${T}@${MSHOST}/studios/${OWNER}/${REPO}.git" /tmp/studio 2>&1 | sed "s/${T}/***/g"
          cd /tmp/studio
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/app.py" app.py
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/requirements.txt" requirements.txt
          mkdir sham_small
          # the training code only: notebooks, fixtures and caches stay out (the Studio repo has a size limit)
          rsync -a --exclude kaggle_notebooks --exclude colab_notebooks --exclude __pycache__ --exclude '*.ipynb' --exclude '*.pt' --exclude '*.zip' "$GITHUB_WORKSPACE/ai-system/colab/sham_small/" sham_small/
          # the supervision helpers that sham_live may import (kept next to the code)
          mkdir lightning
          rsync -a --exclude __pycache__ "$GITHUB_WORKSPACE/ai-system/lightning/" lightning/     # the codec job (tokenizer_job.py) lives here
          du -sh sham_small | cut -f1
          git config user.name "Sham CI"; git config user.email "ci@sham.local"
          date -u +"sync: %Y-%m-%dT%H:%MZ" > .last_deploy_trigger
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy."; else git commit -q -m "Sham trainer (from CI ${GITHUB_SHA})" && git push -q; echo pushed; fi

      - name: Set the Studio's secrets
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
          KT: ${{ secrets.KAGGLE_API_TOKEN }}
          NAME: ${{ inputs.name || 'ms1' }}
          HOURS: ${{ inputs.hours || '5' }}
          JOB: ${{ inputs.job || 'live' }}
          STUDIO_ID: ${{ env.OWNER }}/${{ env.REPO }}
        run: |
          set -eu
          set_secret() {
            printf '%s' "$2" | python3 -c 'import json,sys;print(json.dumps({"key":sys.argv[1],"value":sys.stdin.read()}))' "$1" > secret.json
            code=$(curl -sS -o secret-response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              code=$(curl -sS -o secret-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            fi
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Secret update failed for $1 (HTTP $code)"; exit 1; }
            echo "updated secret key: $1"
          }
          set_secret KAGGLE_USERNAME jonsnowjonsnow
          set_secret KAGGLE_API_TOKEN "$KT"
          set_secret SHAM_TRAINER_NAME "$NAME"
          set_secret SHAM_TRAINER_HOURS "$HOURS"
          set_secret SHAM_TRAINER_JOB "$JOB"
          set_secret HF_ENDPOINT https://hf-mirror.com
          rm -f secret.json secret-response.json

      - name: Deploy and wait until the app answers
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          set -uo pipefail
          API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"     # cn only: the international site's app address is read from the Studio's own status instead
          curl -fsS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 600; echo
          for i in $(seq 1 170); do
            sleep 30
            st=$(curl -fsS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status'))" 2>/dev/null || echo unknown)
            echo "$(date -u +%H:%M:%S) Studio: $st"
            case "$st" in
              *ail*|*rror*|*topped*)
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/build" | tail -c 2500
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 2500
                echo "::error::Studio ended in $st"; exit 1;;
            esac
            if echo "$st" | grep -qi running && [ "$SITE" = "ai" ]; then echo "international Studio is Running"; exit 0; fi
            if echo "$st" | grep -qi running; then
              ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"data": []}' "$API/gradio_api/call/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
              [ -n "$ev" ] && { out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev" || true); echo "$out" | head -c 800; echo; echo "$out" | grep -q 'phase' && exit 0; }
            fi
          done
          echo "::error::Studio did not answer in time"; exit 1

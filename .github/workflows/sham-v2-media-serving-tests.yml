name: Sham v2 media serving tests

on:
  pull_request:
    paths:
      - "ai-system/colab/sham_small/sham_media_ready.py"
      - "ai-system/colab/sham_small/serve.py"
      - "ai-system/colab/sham_small/requirements.txt"
      - "ai-system/colab/sham_small/web/studio_client.py"
      - "ai-system/colab/sham_small/test_sham_media_ready.py"
      - "ai-system/modelscope-sham/app.py"
      - "ai-system/modelscope-sham/requirements.txt"
      - "ai-system/colab/sham_small/web/telegram_bot.py"
      - ".github/workflows/sham-v2-media-serving-tests.yml"
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
      - fix/sham-v2-real-media-serving
    paths:
      - "ai-system/colab/sham_small/sham_media_ready.py"
      - "ai-system/colab/sham_small/web/studio_client.py"
      - "ai-system/colab/sham_small/requirements.txt"
      - "ai-system/colab/sham_small/serve.py"
      - "ai-system/colab/sham_small/test_sham_media_ready.py"
      - "ai-system/modelscope-sham/app.py"
      - "ai-system/modelscope-sham/requirements.txt"
      - "ai-system/colab/sham_small/web/telegram_bot.py"
      - ".github/workflows/sham-v2-media-serving-tests.yml"

jobs:
  media-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile serving modules
        run: |
          python -m py_compile ai-system/colab/sham_small/sham_media_ready.py
          python -m py_compile ai-system/colab/sham_small/serve.py
          python -m py_compile ai-system/modelscope-sham/app.py
          python -m py_compile ai-system/colab/sham_small/web/studio_client.py
          python -m py_compile ai-system/colab/sham_small/web/telegram_bot.py
      - name: Install FFmpeg wrapper for video validation tests
        run: pip install imageio-ffmpeg
      - name: Run offline media contract tests
        working-directory: ai-system/colab/sham_small
        run: python -m unittest -v test_sham_media_ready.py
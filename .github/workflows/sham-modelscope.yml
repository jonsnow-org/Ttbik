name: Sham ModelScope Studio (host + worker)

# يجسّر بين Kaggle (حيث نقاط حفظ شام) واستوديو ModelScope المجاني (16 جيجا، يعمل دائماً، ولا يصل github.com):
#  1) ينزّل sham-merged-checkpoint من Kaggle ويرفعه إلى مستودع نموذج خاص في ModelScope — فقط حين يتغيّر (بصمة sha256)
#  2) ينسخ تطبيق شام (ai-system/modelscope-sham + كود sham_small) إلى مستودع git الخاص بالاستوديو ويدفعه.
# هذا المسار ينشر شام القديم إلى sham-v1-server فقط؛ خادم نوفا nova-inference-server يُنشر مستقلاً عبر deploy-modelscope-studio.yml.
# الاستوديو يقرأ المستودع الخاص بمفتاح يضعه المالك مرة واحدة في إعدادات الاستوديو (MODELSCOPE_API_TOKEN) — لا يُكتب في أي كود.
# الكود الذي يسحبه الاستوديو بنفسه (studio_code/) موقَّع بـ HMAC (codesign.py) ولا يُنفَّذ بدون توقيع صحيح.
# الأسرار: KAGGLE_API_TOKEN، MODELSCOPE_TOKEN (موجودان)، SHAM_CODE_SIGNING_KEY (اختياري، يقوّي التوقيع).

on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      - ".github/workflows/sham-modelscope.yml"
  schedule:
    - cron: "20 2 */2 * *"     # 2026-10-17 (owner): every other day (about 48 h), not after every merge — each sync that changes the Studio's code means a manual redeploy for her
  workflow_dispatch: {}

concurrency:
  group: sham-modelscope
  cancel-in-progress: false

permissions:
  contents: read

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026
  REPO: sham-v1-server

jobs:
  sync:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' && vars.SHAM_PAUSE_MODELSCOPE != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sham-main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          pip install kaggle modelscope
          pip install --index-url https://download.pytorch.org/whl/cpu torch   # reads the image / audio tokenizer files (decoder-refined one is adopted only if its ids are identical)
          pip install numpy pillow tokenizers

      - name: Check ModelScope account and existing Sham v1 Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          api /users/me | python3 -c "import json,sys;d=json.load(sys.stdin);x=d.get('data') or d.get('Data') or d;print('ModelScope account:',x.get('username') or x.get('name') or 'authenticated')" || true
          api "/studios/hardware?sdk_type=gradio" | tee hw.json | head -c 2500; echo
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "Sham v1 Studio HTTP $code"; head -c 800 studio.json; echo
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"

      - name: Create the separate Sham v1 Studio if missing
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          HW=$(python3 - <<'PY'
          import json
          try: d=json.load(open("hw.json"))
          except Exception: d={}
          items=d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items,dict): items=items.get("items") or items.get("hardware") or []
          free=[i for i in items if isinstance(i,dict) and str(i.get("resource_type","")).lower()!="paid" and not str(i.get("name","")).startswith("paid/")]
          cpu=[i for i in free if "cpu" in str(i.get("name","")).lower()]
          print(((cpu or free or [{"name":"platform/2v-cpu-16g-mem"}])[-1]).get("name"))
          PY
          )
          case "$HW" in paid/*) echo "::error::Refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':'Sham v1 Studio'}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "Studio creation HTTP $code"; head -c 1500 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Could not create the separate Sham v1 Studio"; exit 1; }

      - name: Download the merged checkpoint from Kaggle
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p /tmp/ck
          DS=jonsnowjonsnow/sham-merged-checkpoint
          # the whole-dataset archive can answer a bare 404 while every file downloads fine one by one (2026-10-11): fall back to file by file
          if ! kaggle datasets download -d $DS -p /tmp/ck --unzip -q; then
            for f in final_merged.pt sham_small_tokenizer.json image_tokenizer.pt audio_tokenizer.pt merge_progress.json; do
              kaggle datasets download -d $DS -f $f -p /tmp/ck --unzip -q
            done
          fi
          ls -la /tmp/ck

      # 2026-10-17: the decoder-only refined image / audio tokenizer (sham_decoder_refine.py). Best effort: adopted only if it encodes into the same ids.
      - name: Refined media tokenizers (optional)
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p /tmp/refined
          kaggle datasets download -d jonsnowjonsnow/sham-media-refined -p /tmp/refined --unzip -q 2>/dev/null && ls -la /tmp/refined || echo "- no refined tokenizers yet"

      # 2026-10-14 (owner): the chat-stage checkpoint (Kaggle sham-chat-checkpoint/final_chat.pt) and the guarded self-learn one
      # (final_chat_self.pt, when a dataset carries it) go to the Studio too; app.py prefers them by name. OFF unless the repo variable
      # SHAM_STUDIO_CHAT_CKPT is '1': final_chat.pt is the chat stage BEFORE the merge gate and without the multimodal line, so turning it on
      # trades the merged model's picture / sound skills (and its gate) for a chattier text model — the owner decides.
      - name: Chat checkpoints for the Studio (optional)
        if: ${{ vars.SHAM_STUDIO_CHAT_CKPT == '1' }}
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          for spec in sham-chat-checkpoint:final_chat.pt sham-chat-checkpoint:final_chat_self.pt sham-merged-checkpoint:final_chat_self.pt; do
            ds=${spec%%:*}; f=${spec##*:}
            [ -f /tmp/ck/$f ] && continue
            kaggle datasets download -d jonsnowjonsnow/$ds -f $f -p /tmp/ck --unzip -q 2>/dev/null && echo "+ $f from $ds" || echo "- $f not in $ds"
          done
          ls -la /tmp/ck

      # 2026-10-15 (owner, additive): the separate Arabic SFT notebook's checkpoint (Kaggle sham-chat-arabic-sft-checkpoint/final_chat.pt,
      # same file name/format as the chat stage). OFF by default: only when the repo variable SHAM_STUDIO_ARABIC_SFT is '1' does it
      # replace final_chat.pt in what the Studio receives. Unset / anything else = nothing changes.
      - name: Arabic SFT checkpoint for the Studio (optional, default OFF)
        if: ${{ vars.SHAM_STUDIO_ARABIC_SFT == '1' }}
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p /tmp/sft
          if kaggle datasets download -d jonsnowjonsnow/sham-chat-arabic-sft-checkpoint -f final_chat.pt -p /tmp/sft --unzip -q; then
            cp -f /tmp/sft/final_chat.pt /tmp/ck/final_chat.pt && echo "+ final_chat.pt from sham-chat-arabic-sft-checkpoint"
          else
            echo "- sham-chat-arabic-sft-checkpoint not available; Studio keeps its current checkpoint"
          fi
          ls -la /tmp/ck

      - name: Push the model, stage the Studio app
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SHAM_CODE_SIGNING_KEY: ${{ secrets.SHAM_CODE_SIGNING_KEY }}   # اختياري: مفتاح توقيع منفصل (يضاف أيضاً في أسرار الاستوديو)
        run: |
          git clone "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/studios/${OWNER}/${REPO}.git" /tmp/studio
          python ai-system/modelscope-sham/sync_to_modelscope.py /tmp/ck /tmp/studio

      - name: Commit and push the Studio
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        working-directory: /tmp/studio
        run: |
          git config user.name "Sham CI"
          git config user.email "ci@sham.local"
          date -u +"sync: %Y-%m-%dT%H:%MZ" > .last_deploy_trigger
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy."; else git commit -q -m "Sham app (from CI ${GITHUB_SHA})" && git push -q; echo pushed; fi
 
      - name: Set secrets for the isolated Sham v1 Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          SHAM_CODE_SIGNING_KEY: ${{ secrets.SHAM_CODE_SIGNING_KEY }}
          STUDIO_ID: ${{ env.OWNER }}/${{ env.REPO }}
        run: |
          set -eu
          set_secret() {
            key="$1"; value="$2"
            printf '%s' "$value" | python3 -c 'import json,sys;print(json.dumps({"key":sys.argv[1],"value":sys.stdin.read()}))' "$key" > secret.json
            code=$(curl -sS -o secret-response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              code=$(curl -sS -o secret-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            fi
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Secret update failed for $key (HTTP $code)"; head -c 500 secret-response.json; exit 1; }
            echo "updated secret key: $key"
          }
          set_secret MODELSCOPE_API_TOKEN "$T"
          set_secret MODELSCOPE_TOKEN "$T"
          set_secret SHAM_MS_MODEL "novaai2026/sham-merged"
          if [ -n "${SHAM_CODE_SIGNING_KEY:-}" ]; then set_secret SHAM_CODE_SIGNING_KEY "$SHAM_CODE_SIGNING_KEY"; fi
          rm -f secret.json secret-response.json

      - name: Deploy and verify the separate Sham v1 Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 1000; echo
          API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
          for i in $(seq 1 40); do
            sleep 30
            st=$(curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status'))")
            echo "$(date -u +%H:%M:%S) Sham v1 Studio: $st"
            case "$st" in *ail*|*rror*|*topped*) curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 3500; exit 1;; esac
            if echo "$st" | grep -qi running; then
              ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' "$API/gradio_api/call/v2/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
              out=""
              [ -n "$ev" ] && out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev" || true)
              echo "$out" | head -c 1200
              echo "$out" | grep -q 'phase[^,]*ready' && exit 0
              echo "$out" | grep -q 'phase[^,]*error' && { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 3500; exit 1; }
            fi
          done
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 3500
          echo "::error::Sham v1 Studio did not become ready"
          exit 1

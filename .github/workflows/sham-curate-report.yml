name: Sham Curate Report (measure only, CPU)

# يقيس ما في مجموعة الزواحف المنشورة (sham-crawl-*-corpus) ويصنّفه: لغة، نوع (نثر/كود)، مرفوضات بأسبابها، مكرر، وعيّنة اختبار ثابتة 1% لا يُدرَّب عليها.
# قياس فقط: لا ينشر مجموعة ولا يغيّر أي دفتر تدريب. القرار بعد قراءة الأرقام.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "أقصى عدد وثائق للقياس (0 = الكل)"
        required: false
        default: "400000"

permissions:
  contents: read

jobs:
  report:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/free-services-marketplace-h6rwk2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install kaggle six
      - name: Download the crawl corpus and curate it (no publishing)
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p /tmp/raw /tmp/clean
          kaggle datasets download -d jonsnowjonsnow/sham-crawl-gh-collect-corpus -p /tmp/raw --unzip -q
          du -sh /tmp/raw
          python ai-system/colab/sham_small/sham_curate.py --in /tmp/raw --out /tmp/clean --report /tmp/curate-report.json --limit "${{ inputs.limit || '400000' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sham-curate-report
          path: /tmp/curate-report.json

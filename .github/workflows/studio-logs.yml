name: Read an international Studio's status and logs (read-only)
# Shows status + the tail of the build and run logs of one Jonjithup Studio on modelscope.ai (e.g. sham-runner-1 says whether its GitHub runner registered and what it restored).
# Changes nothing; the token is masked.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Studio name under Jonjithup"
        default: "sham-runner-1"
      page_size:
        description: "log lines to fetch per log (ModelScope page_size)"
        default: "1000"
      tail:
        description: "how many of the fetched lines to print"
        default: "200"
      skip:
        description: "regex of lines to hide (default hides the model-download progress spam; empty = show everything)"
        default: "Downloading \\["
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Status and logs
        env:
          T: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          REPO: ${{ inputs.repo }}
          PAGE_SIZE: ${{ inputs.page_size }}
          TAIL: ${{ inputs.tail }}
          SKIP: ${{ inputs.skip }}
        run: |
          echo "::add-mask::$T"
          MS=https://www.modelscope.ai; O=Jonjithup
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$O/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print('status:',(d.get('runtime') or {}).get('status') or d.get('status'),'hardware:',d.get('hardware') or (d.get('runtime') or {}).get('hardware'))"
          for k in build run; do
            echo "== $k log"
            curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$O/$REPO/logs/$k?page_size=${PAGE_SIZE:-200}" | python3 -c "
          import json,os,sys,re
          d=json.load(sys.stdin); x=d.get('data') or {}
          lines=x if isinstance(x,list) else next((v for v in x.values() if isinstance(v,list)),[str(x)[:2000]])
          keep=[]
          skip=os.environ.get('SKIP') or ''
          for l in (lines if isinstance(lines,list) else [str(lines)]):
              s=l if isinstance(l,str) else json.dumps(l,ensure_ascii=False)
              if re.search(r'token|secret|password|bearer',s,re.I): continue
              if skip and re.search(skip,s): continue
              keep.append(s.rstrip()[:300])
          for s in keep[-int(os.environ.get('TAIL') or 200):]: print(s)
          "
          done

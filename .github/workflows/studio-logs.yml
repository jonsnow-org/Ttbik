name: Read an international Studio's status and logs (read-only)
# Shows status + the tail of the build and run logs of one Jonjithup Studio on modelscope.ai (e.g. sham-runner-1 says whether its GitHub runner registered and what it restored).
# Changes nothing; the token is masked.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Studio name under Jonjithup"
        default: "sham-runner-1"
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Status and logs
        env:
          T: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: |
          echo "::add-mask::$T"
          MS=https://www.modelscope.ai; O=Jonjithup
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$O/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print('status:',(d.get('runtime') or {}).get('status') or d.get('status'),'hardware:',d.get('hardware') or (d.get('runtime') or {}).get('hardware'))"
          for k in build run; do
            echo "== $k log"
            curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$O/$REPO/logs/$k?page_size=200" | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin); x=d.get('data') or {}
          lines=x if isinstance(x,list) else next((v for v in x.values() if isinstance(v,list)),[str(x)[:2000]])
          for l in (lines if isinstance(lines,list) else [str(lines)])[-80:]:
              s=l if isinstance(l,str) else json.dumps(l,ensure_ascii=False)
              if not re.search(r'token|secret|password|bearer',s,re.I): print(s.rstrip()[:300])
          "
          done

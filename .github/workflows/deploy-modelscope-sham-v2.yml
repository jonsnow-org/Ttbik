name: "Deploy the Sham v2 Studio (Sham on the body of a trained donor, own chat, own media tokens; a NEW Studio, the current Sham Studio is not touched)"

# A Studio of its own (sham-v2-server), free CPU hardware only, private. It serves the private model repo novaai2026/sham-v2 (built by transplant-build.yml with publish=true).
# The app is the existing Sham Studio app (ai-system/modelscope-sham) behind a small wrapper that sets the text vocabulary and the model repo. Uses MODELSCOPE_TOKEN; nothing secret is printed; never deletes anything.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      # app.py and requirements are deployed directly. Runtime modules from sham_small/
      # must first update the signed studio_code/ in the private model repo, then deploy
      # through the workflow_run below.
      - ai-system/modelscope-sham/app.py
      - ai-system/modelscope-sham/requirements.txt
      - ai-system/supervision/sham_v2_chat_smoke.py
      - scripts/transplant/stage_sham_v2_studio.py
      - .github/workflows/deploy-modelscope-sham-v2.yml
  # Also redeploy after the ready media bundle is copied into novaai2026/sham-v2.
  workflow_run:
    workflows:
      - "Sham v2 media weights (ready picture model + Arabic voice into Sham's own model repo)"
      - "Sham v2 signed runtime code sync"
      - "Sham v2 trained checkpoint publisher"
    types: [completed]
    branches:
      - claude/free-services-marketplace-h6rwk2

concurrency:
  group: deploy-modelscope-sham-v2
  # A stalled deploy must not block the next repair/redeploy attempt.
  cancel-in-progress: true

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026
  REPO: sham-v2-server

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Account, free hardware and existing Studio (read-only)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          echo "user:";      api /users/me | python3 -c "import json,sys;d=json.load(sys.stdin);x=d.get('data') or d.get('Data') or d;print({k:x.get(k) for k in ('username','name','level') if isinstance(x,dict)})" || true
          echo "hardware:";  api "/studios/hardware?sdk_type=gradio" | tee hw.json | head -c 3000; echo
          echo "sdk:";       api "/studios/sdk-versions?sdk_type=gradio" | tee sdk.json | head -c 1500; echo
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "studio http $code"; head -c 1500 studio.json; echo
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"

      - name: Create the Studio if missing (private, free CPU)
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          HW=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open("hw.json"))
          except Exception:
              d = {}
          items = d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items, dict):
              items = items.get("items") or items.get("hardware") or []
          free = [i for i in items if isinstance(i, dict) and str(i.get("resource_type", "")).lower() != "paid" and not str(i.get("name", "")).startswith("paid/")]
          cpu = [i for i in free if "cpu" in str(i.get("name", "")).lower()]
          pick = (cpu or free or [{"name": "platform/2v-cpu-16g-mem"}])[-1]
          print(pick.get("name"))
          PY
          )
          echo "hardware pick: $HW"
          case "$HW" in paid/*) echo "refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':os.environ['REPO']}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "create http $code"; head -c 2000 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Studio creation refused (see body above: quota / verification / one-Studio limit)"; exit 1; }

      - name: Push the app into the Studio repo
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.name "sham v2 CI"
          git config --global user.email "ci@sham-v2.local"
          git clone "https://oauth2:${T}@www.modelscope.cn/studios/${OWNER}/${REPO}.git" ms-studio 2>&1 | sed "s/${T}/***/g"
          python3 scripts/transplant/stage_sham_v2_studio.py ms-studio
          cd ms-studio
          git add -A
          git diff --cached --quiet && echo "no change" || git commit -m "sham v2: app (${GITHUB_SHA::8})"
          git push origin HEAD:master 2>&1 | sed "s/${T}/***/g"

      - name: Set and verify the Studio model/token secrets (never print values; no external media tokens)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          SHAM_CODE_SIGNING_KEY: ${{ secrets.SHAM_CODE_SIGNING_KEY }}
          STUDIO_ID: ${{ env.OWNER }}/${{ env.REPO }}
        run: |
          set -eu
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN secret is empty"; exit 1; }
          # Use the documented ModelScope OpenAPI directly. The legacy HubApi
          # secret helpers did not result in the running Studio receiving a
          # token that could read the private model repository (runtime 403).
          set_secret() {
            key="$1"; value="$2"
            printf '%s' "$value" | python3 -c 'import json,sys; print(json.dumps({"key":sys.argv[1],"value":sys.stdin.read()}))' "$key" > secret.json
            code=$(curl -sS -o secret-response.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              code=$(curl -sS -o secret-response.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                --data-binary @secret.json "$MS/openapi/v1/studios/$STUDIO_ID/secrets")
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::ModelScope rejected secret update for $key (HTTP $code)"
              head -c 500 secret-response.json; echo
              exit 1
            fi
            echo "updated Studio secret key: $key"
          }
          set_secret MODELSCOPE_API_TOKEN "$T"
          set_secret MODELSCOPE_TOKEN "$T"
          # The runtime code signer and Studio verifier must always share one key.
          # When no separate signing key is configured, both use the ModelScope token.
          set_secret SHAM_CODE_SIGNING_KEY "${SHAM_CODE_SIGNING_KEY:-$T}"
          set_secret SHAM_MS_MODEL "novaai2026/sham-v2"
          rm -f secret.json secret-response.json

      - name: Deploy and show status
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -uo pipefail
          API="https://studio-${OWNER}-${REPO}.api-inference.modelscope.net"

          # Bound the deploy request. A timeout is ambiguous (ModelScope may have accepted
          # the POST), so continue by observing Studio state rather than blindly posting again.
          deploy_code=$(curl -sS --connect-timeout 8 --max-time 25 -o deploy-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" || true)
          if [[ "$deploy_code" =~ ^[0-9]{3}$ ]] && [ "$deploy_code" != "000" ]; then
            echo "deploy request HTTP $deploy_code"
            head -c 1200 deploy-response.json || true
            echo
            if [ "$deploy_code" -ge 400 ]; then
              echo "::error::ModelScope rejected the Studio deploy request (HTTP $deploy_code)"
              exit 1
            fi
          else
            echo "deploy request response was not confirmed (HTTP ${deploy_code:-000}); observing current Studio state"
          fi

          show_logs() {
            for kind in build run; do
              body=$(curl -sS --connect-timeout 5 --max-time 12 \
                -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/$kind" || true)
              echo "Studio $kind logs:"
              echo "$body" | tail -c 4000 || true
              echo
            done
          }

          # At most 40 minutes of readiness polling; every network operation has a deadline.
          SECONDS=0
          while [ "$SECONDS" -lt 2400 ]; do
            studio_code=$(curl -sS --connect-timeout 5 --max-time 12 \
              -o studio-status.json -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
            status=""
            if [ "$studio_code" = "200" ]; then
              status=$(python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status') or '')" < studio-status.json 2>/dev/null || true)
            fi
            echo "$(date -u +%H:%M:%S) studio HTTP $studio_code; status=${status:-unknown}; elapsed=${SECONDS}s"

            case "$status" in
              *ail*|*rror*|*topped*)
                echo "::error::ModelScope Studio reported terminal state: $status"
                show_logs
                exit 1
                ;;
              Running|running|Ready|ready)
                event_code=$(curl -sS --connect-timeout 5 --max-time 12 \
                  -o status-event.json -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' \
                  "$API/gradio_api/call/v2/status" || true)
                event_id=""
                if [ "$event_code" = "200" ]; then
                  event_id=$(python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" < status-event.json 2>/dev/null || true)
                fi
                response=""
                if [ -n "$event_id" ]; then
                  result_code=$(curl -sS --connect-timeout 5 --max-time 20 \
                    -o status-result.txt -w '%{http_code}' \
                    -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$event_id" || true)
                  response=$(cat status-result.txt 2>/dev/null || true)
                  echo "status API HTTP $result_code: $(echo "$response" | head -c 1000)"
                  if echo "$response" | grep -Eiq '"phase"[[:space:]]*:[[:space:]]*"ready"|phase[^,]*ready'; then
                    echo "Sham v2 Studio model server is ready."
                    exit 0
                  fi
                  if echo "$response" | grep -Eiq '"phase"[[:space:]]*:[[:space:]]*"error"|phase[^,]*error'; then
                    echo "::error::Studio is running but its model server is in error phase"
                    show_logs
                    exit 1
                  fi
                else
                  echo "status probe did not return an event id (HTTP $event_code); retrying"
                fi
                ;;
              *)
                # Includes starting/loading/queued and temporary status API failures.
                ;;
            esac
            sleep 20
          done

          echo "::error::Studio/model did not report ready within 40 minutes"
          show_logs
          exit 1

      - name: Install what the content checks need (numpy, pillow; ffmpeg ships on the runner)
        run: python3 -m pip install -q numpy pillow
      - name: Live text and media smoke tests
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SHAM_V2_URL: https://studio-novaai2026-sham-v2-server.api-inference.modelscope.net
        run: |
          python ai-system/supervision/sham_v2_chat_smoke.py
          python ai-system/supervision/sham_v2_media_smoke.py

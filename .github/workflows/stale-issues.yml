name: Stale issues (auto)
# Daily housekeeping: quiet issues get a note after 45 days and close 14 days later. PRs are never touched
# (#505 and #184 must stay open). Anything labelled keep/pinned/security is exempt.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: stale-issues
  cancel-in-progress: false
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 45
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: keep,pinned,security,coordination
          exempt-all-issue-milestones: true
          stale-issue-label: stale
          stale-issue-message: "No activity for 45 days. This closes automatically in 14 days unless there is news (comment or add the `keep` label)."
          close-issue-message: "Closed automatically after being stale. Reopen if still needed."
          operations-per-run: 60

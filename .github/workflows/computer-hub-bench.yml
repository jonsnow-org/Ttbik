name: "Computer hub benchmark (read-mostly: times common operations in a throwaway session)"

# Times the operations models use most on the live 16 GB computer hub (Bash round trip, file write/read, repo clone, search, patch, tools).
# It runs on a pull request that changes the computer (= BEFORE, against the hub that is live now) and after every hub deploy (= AFTER).
# Only a fresh ci-bench session is touched; no model or media weight is read or changed. Nothing secret is printed.
on:
  pull_request:
    paths:
      - ai-system/modelscope-media/computer_box.py
      - scripts/ops/modelscope_computer_smoke.py
      - .github/workflows/computer-hub-bench.yml
  workflow_run:
    workflows:
      - "Deploy the dedicated computer and full developer toolchain to the reserved 16 GB ModelScope Studio"
    branches:
      - claude/free-services-marketplace-h6rwk2
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: computer-hub-bench
  cancel-in-progress: false

jobs:
  bench:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Signed download address of this private repository (as Nova's computer_repo makes it; never printed)
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          loc=$(curl -s -o /dev/null -D - -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/tarball/claude/free-services-marketplace-h6rwk2" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          echo "::add-mask::$loc"
          echo "signed=$loc" >> "$GITHUB_OUTPUT"
          [ -n "$loc" ] && echo "signed address: obtained" || echo "signed address: NOT obtained"
      - name: Time the common operations on the live hub
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          BENCH_SIGNED_URL: ${{ steps.signed.outputs.signed }}
        run: |
          python3 scripts/ops/modelscope_computer_smoke.py --api https://studio-jonjithup-sham-trainer-2.api-inference.modelscope.ai --model-id computer_hub --no-gui --bench

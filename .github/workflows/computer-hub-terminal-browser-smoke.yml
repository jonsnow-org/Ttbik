name: Live terminal and Chromium smoke for computer hub

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy the dedicated computer and full developer toolchain to the reserved 16 GB ModelScope Studio"
    branches:
      - claude/free-services-marketplace-h6rwk2
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: computer-hub-terminal-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test persistent Bash, files, background jobs and a real Chromium page
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SMOKE_LIVE: "1"                                   # live view numbers: poll latency, streamed frame rate, live terminal, pointer accuracy
          SMOKE_FRAMES_DIR: ${{ runner.temp }}/live-frames
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/modelscope_computer_smoke.py
          python3 scripts/ops/modelscope_computer_smoke.py --api https://studio-novaai2026-nova-inference-server.api-inference.modelscope.net --model-id computer_hub --browser
      - name: Live-view frame sequence (CI test desktop only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-frames
          path: ${{ runner.temp }}/live-frames
          if-no-files-found: ignore
          retention-days: 7

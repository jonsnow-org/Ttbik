name: promo-projects
# Professional campaign assets for public projects and Telegram bots.
# Builds live-page screenshots, narrated promo videos, resized cards and platform-ready copy packs.
# Outputs are review artifacts only; this workflow never publishes to public channels.
on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "one project id (athar, zenobia, palmyra-launch, sham-ai, literium), empty = all"
        default: ""
      format:
        description: "vertical (stories, shorts) or wide"
        default: "vertical"
concurrency:
  group: promo-projects
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tools (ffmpeg, Arabic fonts, Chromium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core
          npm install --no-save --no-package-lock playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
          pip install -q edge-tts
      - name: prepare the original music bed
        run: (cd promo/remotion && sh scripts/music.sh)
      - name: make the narrated videos
        run: node scripts/promo/make.mjs --out promo-out --music promo/remotion/public/music.mp3 --format "${{ github.event.inputs.format || 'vertical' }}" ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - name: make the promo images (square, story, link preview; plus English-only versions for the coins channel)
        run: |
          node scripts/promo/cards.mjs --out promo-cards ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
          node scripts/promo/cards.mjs --lang en --out promo-cards ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: promo-images
          path: promo-cards/*.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: promo-videos
          path: promo-out/*.mp4
          retention-days: 30
      - name: generate platform-ready copy packs
        run: node scripts/promo/copy.mjs --out promo-copy ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: promo-copy
          path: promo-copy/*
          retention-days: 30

name: promo-projects
# Professional campaign assets for public projects and Telegram bots.
# Builds live-page screenshots, narrated promo videos, resized cards and platform-ready copy packs.
# Outputs are review artifacts only; this workflow never publishes to public channels.
on:
  pull_request:
    paths:
      - "scripts/promo/**"
      - "promo/projects.json"
      - "promo/catalog.json"
      - "promo/handoff/**"
      - ".github/workflows/promo-projects.yml"
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "one campaign id (zenobia, palmyra-launch, sham-ai, literium or a public bot), empty = all"
        default: ""
      format:
        description: "vertical (stories, shorts) or wide"
        default: "vertical"
concurrency:
  group: promo-projects
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: validate campaigns and generator syntax
        run: |
          node --test scripts/promo/*.test.mjs
          node --check scripts/promo/handoff.mjs
          node --check scripts/promo/make.mjs
          node --check scripts/promo/cards.mjs
          node --check scripts/promo/copy.mjs
          python -m py_compile scripts/promo/tts.py scripts/promo/remotion_publish.py
          python -m unittest discover -s scripts/promo -p 'test_remotion_publish.py' -v
  make:
    if: github.event_name != 'pull_request'
    # Playwright 1.56.1 provides Chromium builds for Ubuntu 24.04; ubuntu-latest moved to 26.04 and fails installation.
    runs-on: ubuntu-24.04
    # 40 minutes cut the job in the middle of "make the narrated videos" (run 45562278365: cancelled at exactly
    # 40:00 in that step, every later step skipped), so the weekly run has produced nothing since 2026-11-09.
    # The videos are made for every campaign in one job; give it room to finish instead of cancelling it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: tools (ffmpeg, Arabic fonts, Chromium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core
          npm install --no-save --no-package-lock playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
          pip install -q edge-tts
      - name: prepare the original music bed
        run: (cd promo/remotion && sh scripts/music.sh)
      - name: make the narrated videos
        run: node scripts/promo/make.mjs --out promo-out --music promo/remotion/public/music.mp3 --format "${{ github.event.inputs.format || 'vertical' }}" ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - name: make the promo images (square, story, link preview; plus English-only versions for the coins channel)
        run: |
          node scripts/promo/cards.mjs --out promo-cards ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
          node scripts/promo/cards.mjs --lang en --out promo-cards ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: promo-images
          path: promo-cards/*.png
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: promo-videos
          path: promo-out/*.mp4
          retention-days: 30
      - name: generate platform-ready copy packs
        run: node scripts/promo/copy.mjs --out promo-copy ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: promo-copy
          path: promo-copy/*
          retention-days: 30
      - name: supervisor handoff sheet (what to post by hand next, from promo/catalog.json + the ledger)
        run: node scripts/promo/handoff.mjs --out promo-copy/HANDOFF.md
      - uses: actions/upload-artifact@v7
        with:
          name: promo-handoff
          path: promo-copy/HANDOFF.md
          retention-days: 30

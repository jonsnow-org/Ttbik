# Free automated promo videos for «شام AI» (Remotion + Playwright + edge-tts on GitHub Actions).
# Each run renders the next episode in promo/remotion/episodes.json that has no release promo-ep-<id> yet.
# State = GitHub Releases (no commits pushed, so no Vercel builds). No secrets beyond the built-in GITHUB_TOKEN.
name: promo-remotion
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "1 = post the video to its Telegram channel, 0 = render only; empty = post when promo/PUBLISH_ON exists (scheduled runs)"
        required: false
      episode:
        description: "Force a specific episode id (optional; re-renders and replaces its release)"
        required: false
  schedule:
    - cron: "0 7 * * 0,2,4" # Sun/Tue/Thu 10:00 Istanbul
permissions:
  contents: write
concurrency:
  group: promo-remotion
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: promo/remotion
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick episode
        id: pick
        run: |
          DONE=$(gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName -q '.[].tagName' | sed -n 's/^promo-ep-\([0-9]*\)$/\1/p' | paste -sd, -)
          FORCE="${{ inputs.episode }}"
          ID=$(python3 scripts/prepare.py "$DONE" "$FORCE")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ID" ]; then echo "All episodes rendered. Add more to episodes.json."; fi
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.id != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: promo/remotion/package-lock.json
      - name: Install deps (free)
        if: steps.pick.outputs.id != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q edge-tts
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record + TTS + render
        if: steps.pick.outputs.id != ''
        run: ./scripts/build-episode.sh
      - name: Publish release
        if: steps.pick.outputs.id != ''
        run: |
          ID=${{ steps.pick.outputs.id }}
          TAG=promo-ep-$ID
          TITLE=$(python3 -c "import json;print(json.load(open('episode.json'))['title'])")
          cp out/promo.mp4 "out/sham-ai-ep-$ID.mp4"; cp out/thumb.jpg "out/sham-ai-ep-$ID.jpg"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          printf 'حلقة %s — %s | شام AI\n\nفيديو ترويجي مولّد آلياً (Remotion). للمراجعة قبل النشر.\n' "$ID" "$TITLE" > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Promo ep $ID: $TITLE" -F notes.md "out/sham-ai-ep-$ID.mp4" "out/sham-ai-ep-$ID.jpg"

      - name: Post the video to its Telegram channel
        if: steps.pick.outputs.id != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # The site fetches the release asset and sends it with the channel's own bot; nothing secret leaves GitHub except the cron secret the other jobs already use.
          if [ "$PUBLISH" = "0" ]; then echo "publish=0: render only"; exit 0; fi
          if [ -z "$PUBLISH" ] && [ ! -f ../PUBLISH_ON ]; then echo "publishing is off (no promo/PUBLISH_ON, no publish input): video stays a pre-release"; exit 0; fi
          ID=${{ steps.pick.outputs.id }}
          SITE_BASE=$(jq -r '[.engineUrl, .vercelUrl] | map(select(length>0)) | .[0]' ../../deploy/hosting/site.json)
          CH=$(python3 -c "import json;print(json.load(open('episode.json')).get('channel','general'))")
          CAP=$(python3 -c "import json;e=json.load(open('episode.json'));print(e.get('caption') or (e['hook']+chr(10)+e['title']+' | شام AI'+chr(10)+e['site']+e['path']))")
          code=$(curl -sS -o resp.json -w "%{http_code}" -G "${SITE_BASE}/api/cron/promo-publish" \
            --data-urlencode "secret=${CRON_SECRET}" --data-urlencode "tag=promo-ep-$ID" --data-urlencode "asset=sham-ai-ep-$ID.mp4" \
            --data-urlencode "to=$CH" --data-urlencode "caption=$CAP")
          echo "HTTP $code"; cat resp.json; echo
          [ "$code" = "200" ] && grep -q '"ok":true' resp.json

      - name: Upload the video to YouTube (Data API v3, through the site)
        if: steps.pick.outputs.id != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # Same switch as Telegram. Not fatal: until the owner finishes the one-time consent (/api/youtube/oauth) the site answers youtube-not-set-up and the video stays on Telegram + the release.
          if [ "$PUBLISH" = "0" ]; then exit 0; fi
          if [ -z "$PUBLISH" ] && [ ! -f ../PUBLISH_ON ]; then exit 0; fi
          ID=${{ steps.pick.outputs.id }}
          SITE_BASE=$(jq -r '[.engineUrl, .vercelUrl] | map(select(length>0)) | .[0]' ../../deploy/hosting/site.json)
          TITLE=$(python3 -c "import json;e=json.load(open('episode.json'));print(e['title']+' | '+e.get('brand','Sham AI'))")
          LANGC=$(python3 -c "import json;print(json.load(open('episode.json')).get('lang','ar'))")
          CAP=$(python3 -c "import json;e=json.load(open('episode.json'));print(e.get('caption') or (e['hook']+chr(10)+e['title']+chr(10)+e['site']+e['path']))")
          code=$(curl -sS -o resp.json -w "%{http_code}" -G "${SITE_BASE}/api/cron/promo-publish" \
            --data-urlencode "secret=${CRON_SECRET}" --data-urlencode "tag=promo-ep-$ID" --data-urlencode "asset=sham-ai-ep-$ID.mp4" \
            --data-urlencode "to=youtube" --data-urlencode "title=$TITLE" --data-urlencode "lang=$LANGC" --data-urlencode "caption=$CAP") || true
          echo "HTTP $code"; cat resp.json; echo

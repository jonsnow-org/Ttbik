name: Nova prefill speed probe (free, read-only)
# Same llama.cpp build and model as the coder Studio, pinned to 2 cores like the Studio. Reads the SAME ~3.4k-token prompt under different llama-server batch /
# thread / memory settings and prints the prompt-reading speed of each (tokens per second): which setting reads a prompt faster. Manual only.
on:
  workflow_dispatch:
    inputs:
      only_ik:
        description: "true = ONLY the engine comparison for the big Qwen3.6-35B-A3B model (mainline b11757 vs ik_llama.cpp, 2 cores, llama-bench pp512 / tg64); false = the old 4B setting probe"
        required: false
        default: "false"
      ik_server:
        description: "true = after the bench, also run ik_llama.cpp's llama-server with the Studio's flags: which flags it accepts, tools/code scores, and saving/restoring a conversation state"
        required: false
        default: "false"
      model_repo:
        description: "HF repo of the model for the engine comparison"
        required: false
        default: "unsloth/Qwen3.6-35B-A3B-GGUF"
      model_file:
        description: "GGUF file in that repo"
        required: false
        default: "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
permissions:
  contents: read
env:
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e
jobs:
  probe:
    if: inputs.only_ik != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o model.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
          lscpu | grep -E "Model name|^CPU\(s\)" | tee cpu.txt
      - name: read the same prompt under each setting
        run: |
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          python3 - <<'PY' > prompt.json
          import json
          words = ("The deployment pipeline builds the image, runs the tests, pushes the artifact and restarts the service while the monitor watches latency and error rates. " * 100)
          print(json.dumps({"messages": [{"role": "system", "content": "You are a coding assistant."}, {"role": "user", "content": words + "\n\nSay OK."}], "max_tokens": 4, "stream": False, "chat_template_kwargs": {"enable_thinking": False}, "cache_prompt": False}))
          PY
          run_one() {   # name, extra args
            name="$1"; shift
            taskset -c 0,1 "$BIN/llama-server" -m model.gguf -c 65536 -t 2 -np 1 -n -1 --jinja "$@" --host 127.0.0.1 --port 8080 > server.log 2>&1 &
            PID=$!
            for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; kill -0 $PID 2>/dev/null || { echo "$name: server exited"; tail -3 server.log; return; }; sleep 3; done
            curl -s -m 900 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @prompt.json > resp.json
            python3 - "$name" <<'PY'
          import json, sys
          r = json.load(open("resp.json")); t = r.get("timings", {})
          print(f"{sys.argv[1]:34s} prompt {t.get('prompt_n')} tokens | prefill {t.get('prompt_per_second', 0):5.1f} tok/s | {t.get('prompt_ms', 0)/1000:5.1f} s")
          PY
            kill $PID; wait $PID 2>/dev/null; sleep 2
          }
          { run_one "default (as the Studio)"
            run_one "ubatch 1024, batch 2048" -ub 1024 -b 2048
            run_one "ubatch 256" -ub 256
            run_one "ubatch 2048, batch 2048" -ub 2048 -b 2048
            run_one "no-mmap" --no-mmap
            run_one "threads-batch 2 explicit" -tb 2
            run_one "default again (noise check)"
          } | tee result.txt
          { echo "### Prefill speed, 2 cores ($(grep 'Model name' cpu.txt | sed 's/.*: *//'))"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ik:
    # 2026-11-16: the 35B-A3B model reads prompts at only 9.3 tok/s on the Studio's 2 cores with mainline b11757 (4B: 31-45). ik_llama.cpp has CPU-specific kernels and run-time repacking
    # (-rtr 1) for IQ/Q quants of MoE models: does it read faster on the same 2 cores? Same model file, same cores, three engines/settings.
    if: inputs.only_ik == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nova-eval
          sparse-checkout-cone-mode: false
      - name: free disk space (the model is 12 GB)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: mainline llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o model.gguf "https://huggingface.co/${{ inputs.model_repo }}/resolve/main/${{ inputs.model_file }}"
          ls -l model.gguf; lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-160
      - name: build ik_llama.cpp
        run: |
          git clone --depth 1 https://github.com/ikawrakow/ik_llama.cpp ik
          cd ik && git log -1 --format='ik_llama.cpp %h %cs %s' | cut -c1-120
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF > /dev/null
          cmake --build build --target llama-bench llama-server -j 4 2>&1 | tail -3
      - name: llama-bench on 2 cores
        run: |
          BIN=$(dirname "$(find llama -name llama-bench | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          find ik/build -name "*.so*" | head -5
          { echo "== mainline b11757 (what the Studio runs)"
            taskset -c 0,1 "$BIN/llama-bench" -m model.gguf -t 2 -p 512 -n 32 -r 2 2>&1 | grep -E "pp512|tg32" | cut -c1-200
            echo "== ik_llama.cpp, default"
            env LD_LIBRARY_PATH="$PWD/ik/build/bin:$PWD/ik/build/src:$PWD/ik/build/ggml/src" taskset -c 0,1 ik/build/bin/llama-bench -m model.gguf -t 2 -p 512 -n 32 -r 2 2>&1 | grep -E "pp512|tg32|error|unknown|failed" | cut -c1-200
            echo "== ik_llama.cpp, run-time repack (-rtr 1)"
            env LD_LIBRARY_PATH="$PWD/ik/build/bin:$PWD/ik/build/src:$PWD/ik/build/ggml/src" taskset -c 0,1 ik/build/bin/llama-bench -m model.gguf -t 2 -p 512 -n 32 -r 2 -rtr 1 2>&1 | grep -E "pp512|tg32|error|unknown|failed" | cut -c1-200
          } | tee result.txt
          { echo "### Engine comparison, ${{ inputs.model_file }}, 2 cores"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: ik_llama.cpp llama-server with the Studio's flags (accepted flags, tools/code, slot save + restore)
        if: inputs.ik_server == 'true'
        run: |
          export LD_LIBRARY_PATH="$PWD/ik/build/bin:$PWD/ik/build/src:$PWD/ik/build/ggml/src"
          SRV=ik/build/bin/llama-server; ls -l $SRV | cut -c1-80
          mkdir -p slots
          python3 - <<'PY' > prompt.json
          import json
          words = ("The deployment pipeline builds the image, runs the tests, pushes the artifact and restarts the service while the monitor watches latency and error rates. " * 100)
          print(json.dumps({"messages": [{"role": "system", "content": "You are a coding assistant."}, {"role": "user", "content": words + "\n\nSay OK."}], "max_tokens": 4, "stream": False, "chat_template_kwargs": {"enable_thinking": False}, "cache_prompt": True}))
          PY
          start() {   # extra flags...
            taskset -c 0,1 $SRV -m model.gguf -c 32768 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8080 "$@" > server.log 2>&1 &
            PID=$!
            for i in $(seq 1 100); do curl -sf http://127.0.0.1:8080/health >/dev/null && return 0; kill -0 $PID 2>/dev/null || return 1; sleep 3; done; return 1
          }
          stop() { kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true; sleep 2; }
          echo "== which Studio flags does ik_llama.cpp's llama-server accept?"
          OK=""
          for f in "--alias nova-ai" "--cache-ram 1024" "--slot-save-path $PWD/slots" "--ctx-checkpoints 8" "--spec-type ngram-mod" "-rtr" "-fa" "--reasoning-budget 0"; do
            if start $f; then echo "  accepted: $f"; OK="$OK $f"; else echo "  REFUSED : $f -> $(grep -iE 'error|unknown|invalid|not (supported|found)' server.log | head -1 | cut -c1-140)"; fi
            stop
          done
          echo "== full set of the accepted flags: tools/code, then slot save + restore"
          case "$OK" in *--slot-save-path*) ;; *) OK="$OK --slot-save-path $PWD/slots";; esac
          start $OK || { tail -20 server.log; echo "::error::server with the accepted set did not start"; exit 1; }
          EVAL_BASE=http://127.0.0.1:8080/v1 python3 scripts/nova-eval/model_eval.py --models "ik-test" | tee eval.txt | tail -6
          curl -s -m 900 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @prompt.json > r1.json
          python3 -c "import json;t=json.load(open('r1.json')).get('timings',{});print('first read: prompt_n',t.get('prompt_n'),'prefill',round(t.get('prompt_per_second',0),1),'tok/s')"
          echo "save: $(curl -s -m 120 -X POST 'http://127.0.0.1:8080/slots/0?action=save' -H 'content-type: application/json' -d '{"filename":"t.bin"}' | cut -c1-200)"
          ls -l slots | tail -2
          stop
          start $OK || { tail -20 server.log; echo "::error::restart failed"; exit 1; }
          echo "restore: $(curl -s -m 120 -X POST 'http://127.0.0.1:8080/slots/0?action=restore' -H 'content-type: application/json' -d '{"filename":"t.bin"}' | cut -c1-200)"
          curl -s -m 900 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @prompt.json > r2.json
          python3 -c "import json;t=json.load(open('r2.json')).get('timings',{});print('after restore: prompt_n',t.get('prompt_n'),'cache_n',t.get('cache_n'),'prefill',round(t.get('prompt_per_second',0),1),'tok/s')"
          stop
          { echo "### ik_llama.cpp llama-server with Studio flags"; echo "accepted:$OK"; tail -8 eval.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: server prefill/decode ablation, mainline vs ik with the Studio's flags added one by one (same prompt, 2 cores)
        if: inputs.ik_server == 'ablation'
        run: |
          MBIN=$(dirname "$(find llama -name llama-server | head -1)")
          IKLIB="$PWD/ik/build/bin:$PWD/ik/build/src:$PWD/ik/build/ggml/src"
          mkdir -p slots
          python3 - <<'PY' > prompt.json
          import json
          words = ("The deployment pipeline builds the image, runs the tests, pushes the artifact and restarts the service while the monitor watches latency and error rates. " * 100)
          print(json.dumps({"messages": [{"role": "system", "content": "You are a coding assistant."}, {"role": "user", "content": words + "\n\nWrite a short Python function that reverses a string, with a docstring."}], "max_tokens": 64, "stream": False, "chat_template_kwargs": {"enable_thinking": False}, "cache_prompt": False}))
          PY
          cfg() {   # label, engine (main|ik), flags...
            label="$1"; eng="$2"; shift 2
            if [ "$eng" = main ]; then export LD_LIBRARY_PATH="$MBIN"; SRV="$MBIN/llama-server"; else export LD_LIBRARY_PATH="$IKLIB"; SRV=ik/build/bin/llama-server; fi
            taskset -c 0,1 $SRV -m model.gguf -c 32768 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8080 "$@" > server.log 2>&1 &
            PID=$!
            for i in $(seq 1 100); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; kill -0 $PID 2>/dev/null || { echo "$label: server exited"; return; }; sleep 3; done
            for k in 1 2; do
              curl -s -m 900 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @prompt.json > r.json
              python3 - "$label" "$k" <<'PY'
          import json, sys
          t = json.load(open("r.json")).get("timings", {})
          print(f"{sys.argv[1]:46s} run{sys.argv[2]} prompt {t.get('prompt_n')} tok | prefill {t.get('prompt_per_second',0):5.1f} tok/s | decode {t.get('predicted_per_second',0):5.1f} tok/s")
          PY
            done
            kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true; sleep 2
          }
          { cfg "mainline bare" main
            cfg "mainline Studio flags (cache-ram, ckpt, ngram-mod)" main --cache-ram 1024 --slot-save-path $PWD/slots --ctx-checkpoints 8 --spec-type ngram-mod
            cfg "ik bare" ik
            cfg "ik -rtr" ik -rtr
            cfg "ik -rtr + cache-ram + slot-save + ckpt" ik -rtr --cache-ram 1024 --slot-save-path $PWD/slots --ctx-checkpoints 8
            cfg "ik -rtr + ngram-mod" ik -rtr --spec-type ngram-mod
            cfg "ik -rtr + -ub 512 -b 2048" ik -rtr -ub 512 -b 2048
          } | tee ablation.txt
          { echo "### Server ablation (${{ inputs.model_file }}, 2 cores)"; echo '```'; cat ablation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

name: ModelScope Studios inventory (read-only)
# Read-only inventory of every Studio on the account, including Studios not declared in this repository.
# It never deploys, restarts, changes secrets, or reads user conversations.
on:
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
    paths:
      - "scripts/ops/studio_inventory.py"
      - "scripts/ops/test_studio_inventory.py"
      - ".github/workflows/modelscope-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: cd scripts/ops && python3 -m unittest test_studio_inventory
      - name: inventory
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python3 scripts/ops/studio_inventory.py

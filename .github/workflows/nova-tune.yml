name: Nova CPU tuning (free)
# What makes the coder model faster on the Studio's 2 CPU cores, measured with llama.cpp's own llama-bench (prompt speed pp = prefill,
# generation speed tg) on a GitHub runner pinned to 2 cores (taskset), same pinned llama.cpp release as the Studio.
# job flags : the current Qwen3.5-4B Q4_K_M under different llama.cpp flags (flash attention, KV-cache type, micro-batch)
# job quants: the same model in other quantisations (speed here; quality is checked with scripts/nova-eval)
# job spec  : speculative decoding with Qwen3.5-0.8B as the draft (may be unsupported by this architecture: then it says so)
# Manual only; nothing secret.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "which job: all | flags | quants | spec | mtp | models"
        required: false
        default: "all"
permissions:
  contents: read
env:
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e
jobs:
  flags:
    if: inputs.job == 'all' || inputs.job == 'flags' || inputs.job == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o m.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
      - name: llama-bench under each flag set (2 cores)
        run: |
          BIN=$(dirname "$(find llama -name llama-bench | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          run() { echo "### $1"; shift; taskset -c 0,1 "$BIN/llama-bench" -m m.gguf -t 2 -p 512,2048 -n 48 -r 2 "$@" 2>&1 | tail -6; }
          run "baseline (as the Studio runs now: flash-attn auto, f16 KV)" -fa 0
          run "flash attention on" -fa 1
          run "flash attention + q8_0 KV cache" -fa 1 -ctk q8_0 -ctv q8_0
          run "micro-batch 128" -fa 0 -ub 128
          run "micro-batch 256" -fa 0 -ub 256
          run "micro-batch 1024" -fa 0 -ub 1024
          run "no mmap" -fa 0 -mmp 0
  quants:
    if: inputs.job == 'all' || inputs.job == 'quants' || inputs.job == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: q3_k_m, file: Qwen3.5-4B-Q3_K_M.gguf }
          - { id: q4_k_m-current, file: Qwen3.5-4B-Q4_K_M.gguf }
          - { id: ud-q4_k_xl, file: Qwen3.5-4B-UD-Q4_K_XL.gguf }
          - { id: q5_k_m, file: Qwen3.5-4B-Q5_K_M.gguf }
          - { id: q4_0, file: Qwen3.5-4B-Q4_0.gguf }
          - { id: iq4_xs, file: Qwen3.5-4B-IQ4_XS.gguf }
          - { id: ud-iq3_xxs, file: Qwen3.5-4B-UD-IQ3_XXS.gguf }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nova-eval
          sparse-checkout-cone-mode: false
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o m.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/${{ matrix.file }}"
          ls -l m.gguf
      - name: speed (llama-bench) and quality (tool calling + code tests), 2 cores
        run: |
          set -o pipefail
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          echo "### ${{ matrix.id }}: speed"
          taskset -c 0,1 "$BIN/llama-bench" -m m.gguf -t 2 -p 512,2048 -n 48 -r 2 2>&1 | tail -5
          taskset -c 0,1 "$BIN/llama-server" -m m.gguf -c 32768 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8080 > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; kill -0 $PID 2>/dev/null || { tail -20 server.log; exit 1; }; sleep 5; done
          echo "### ${{ matrix.id }}: quality"
          EVAL_BASE=http://127.0.0.1:8080/v1 python3 scripts/nova-eval/model_eval.py --models "${{ matrix.id }}"
          RSS=$(awk '/VmHWM/ {printf "%.1f", $2/1048576}' /proc/$PID/status)
          echo "peak memory: ${RSS} GB"
          kill $PID
  spec:
    if: inputs.job == 'all' || inputs.job == 'spec' || inputs.job == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nova-eval
          sparse-checkout-cone-mode: false
      - name: llama.cpp and the models
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o m.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
          curl -sSL --fail -o d.gguf "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf"
      - name: "speculative decoding variants (2 cores) - none, n-gram (no extra model), 0.8B draft model"
        run: |
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          CODE='Write a Python class LRUCache with get and put, then a second function that uses it to memoise fibonacci, with docstrings and a short usage example.'
          PROSE='Explain in simple words why the sky is blue and why sunsets are red, in about two hundred words.'
          go() { # name, extra server flags
            echo "### $1"; shift
            taskset -c 0,1 "$BIN/llama-server" -m m.gguf -c 8192 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8081 "$@" > srv.log 2>&1 &
            PID=$!
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/health >/dev/null && break; kill -0 $PID 2>/dev/null || { echo "server exited:"; tail -8 srv.log; return 0; }; sleep 5; done
            curl -sf http://127.0.0.1:8081/health >/dev/null || { echo "not healthy"; tail -8 srv.log; kill $PID 2>/dev/null; return 0; }
            for kind in code prose; do
              if [ $kind = code ]; then Q="$CODE"; else Q="$PROSE"; fi
              for k in 1 2; do
                python3 - "$Q" "$kind" "$k" <<'PY'
          import sys, json, urllib.request
          q, kind, k = sys.argv[1:4]
          req = urllib.request.Request("http://127.0.0.1:8081/v1/chat/completions", data=json.dumps({"messages": [{"role": "user", "content": q}], "max_tokens": 280, "temperature": 0.2, "chat_template_kwargs": {"enable_thinking": False}}).encode(), headers={"content-type": "application/json"})
          d = json.load(urllib.request.urlopen(req, timeout=900))
          t = d.get("timings", {})
          print("%s run %s: gen %.1f tok/s, n=%s, draft_n=%s accepted=%s" % (kind, k, t.get("predicted_per_second", 0), t.get("predicted_n"), t.get("draft_n"), t.get("draft_n_accepted")))
          PY
              done
            done
            kill $PID 2>/dev/null; wait $PID 2>/dev/null
          }
          go "no speculation"
          go "n-gram (ngram-mod), up to 8" --spec-type ngram-mod --spec-draft-n-max 8
          go "0.8B draft model, up to 4" --spec-type draft-simple -md d.gguf --spec-draft-n-max 4
          go "0.8B draft model, up to 8" --spec-type draft-simple -md d.gguf --spec-draft-n-max 8
  mtp:
    if: inputs.job == 'mtp'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: "llama.cpp and the MTP model (the model own multi-token-prediction head, no draft model)"
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o m.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-MTP-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
          lscpu | grep -E "Model name|Flags" | cut -c1-400
          BIN=$(dirname "$(find llama -name llama-server | head -1)"); export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          "$BIN/llama-server" --help 2>&1 | grep -n -A2 -E -- 'spec-type|spec-draft-n-max' | head -20
      - name: "MTP variants on 2 pinned cores - none vs draft-mtp 2/3/4"
        run: |
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          CODE='Write a Python class LRUCache with get and put, then a second function that uses it to memoise fibonacci, with docstrings and a short usage example.'
          PROSE='Explain in simple words why the sky is blue and why sunsets are red, in about two hundred words.'
          AR='اشرح بجملتين بسيطتين ما هو الحوسبة السحابية ولماذا تستخدمها الشركات.'
          go() { # name, extra server flags
            echo "### $1"; shift
            taskset -c 0,1 "$BIN/llama-server" -m m.gguf -c 8192 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8081 "$@" > srv.log 2>&1 &
            PID=$!
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/health >/dev/null && break; kill -0 $PID 2>/dev/null || { echo "server exited:"; tail -12 srv.log; return 0; }; sleep 5; done
            curl -sf http://127.0.0.1:8081/health >/dev/null || { echo "not healthy"; tail -12 srv.log; kill $PID 2>/dev/null; return 0; }
            for kind in code prose arabic; do
              if [ $kind = code ]; then Q="$CODE"; elif [ $kind = prose ]; then Q="$PROSE"; else Q="$AR"; fi
              for k in 1 2; do
                python3 - "$Q" "$kind" "$k" <<'PY'
          import sys, json, urllib.request
          q, kind, k = sys.argv[1:4]
          req = urllib.request.Request("http://127.0.0.1:8081/v1/chat/completions", data=json.dumps({"messages": [{"role": "user", "content": q}], "max_tokens": 200, "temperature": 0.2, "chat_template_kwargs": {"enable_thinking": False}}).encode(), headers={"content-type": "application/json"})
          d = json.load(urllib.request.urlopen(req, timeout=900))
          t = d.get("timings", {})
          print("%s run %s: gen %.1f tok/s, n=%s, read %.1f tok/s, draft_n=%s accepted=%s | %s" % (kind, k, t.get("predicted_per_second", 0), t.get("predicted_n"), t.get("prompt_per_second", 0), t.get("draft_n"), t.get("draft_n_accepted"), d["choices"][0]["message"]["content"][:60].replace("\n", " ")))
          PY
              done
            done
            kill $PID 2>/dev/null; wait $PID 2>/dev/null
          }
          go "no speculation (MTP model file)"
          go "draft-mtp, up to 2" --spec-type draft-mtp --spec-draft-n-max 2
          go "draft-mtp, up to 3" --spec-type draft-mtp --spec-draft-n-max 3
          go "draft-mtp, up to 4" --spec-type draft-mtp --spec-draft-n-max 4
  models:
    if: inputs.job == 'models'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: granite-4.0-h-tiny-7b-a1b, url: "https://huggingface.co/unsloth/granite-4.0-h-tiny-GGUF/resolve/main/granite-4.0-h-tiny-Q4_K_M.gguf" }
          - { id: lfm2-8b-a1b, url: "https://huggingface.co/LiquidAI/LFM2-8B-A1B-GGUF/resolve/main/LFM2-8B-A1B-Q4_K_M.gguf" }
          - { id: qwen3-4b-instruct-2507, url: "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf" }
          - { id: qwen3.5-2b, url: "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf" }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nova-eval
          sparse-checkout-cone-mode: false
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o m.gguf "${{ matrix.url }}"
          ls -l m.gguf
      - name: speed (llama-bench) and quality (tool calling + code tests), 2 cores
        run: |
          set -o pipefail
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          echo "### ${{ matrix.id }}: speed"
          taskset -c 0,1 "$BIN/llama-bench" -m m.gguf -t 2 -p 512,2048 -n 48 -r 2 2>&1 | tail -5
          taskset -c 0,1 "$BIN/llama-server" -m m.gguf -c 32768 -t 2 -np 1 -n -1 --jinja --host 127.0.0.1 --port 8080 > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; kill -0 $PID 2>/dev/null || { tail -20 server.log; exit 1; }; sleep 5; done
          echo "### ${{ matrix.id }}: quality"
          EVAL_BASE=http://127.0.0.1:8080/v1 python3 scripts/nova-eval/model_eval.py --models "${{ matrix.id }}"
          RSS=$(awk '/VmHWM/ {printf "%.1f", $2/1048576}' /proc/$PID/status)
          echo "peak memory: ${RSS} GB"
          kill $PID

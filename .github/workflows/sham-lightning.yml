name: Sham Lightning Studio (free CPU)

# هل يستطيع GitHub تشغيل استوديو Lightning المجاني (معالج، بلا رصيد ولا بطاقة) وتنفيذ أمر فيه؟ فحص يدوي الآن؛ إن نجح تُبنى فوقه مهمة دورية.
# الأسرار: LIGHTNING_USER_ID، LIGHTNING_API_KEY (تضيفها المالكة).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe أو diag (تحضير الكود بلا أسرار) أو run (تشغيل المهمة)"
        required: false
        default: "probe"

permissions:
  contents: read

jobs:
  probe:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sham-main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install lightning-sdk
      - name: Probe the free Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          # owner's explicit approval (2026-10-10): Kaggle + HF keys go only into a private file inside her own Studio, never printed
          SHAM_STUDIO_SECRETS: "1"
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.mode || 'probe' }}" = "probe" ]; then python ai-system/lightning/studio_probe.py; else python ai-system/lightning/studio_job.py "${{ inputs.mode }}"; fi

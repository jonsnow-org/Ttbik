name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          MS=https://www.modelscope.cn
          echo "===== stop nova-computer-hub (owner: no new Studios)"
          curl -sS --max-time 30 -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/nova-computer-hub/stop" | head -c 400; echo
          sleep 10
          curl -sS --max-time 30 -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/nova-computer-hub" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print('status', (d.get('runtime') or {}).get('status') or d.get('status'))"

name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          STUDIO: sham-v2-server
        run: |
          echo "::add-mask::$T"
          echo "== build log"
          curl -sS -H "Authorization: Bearer $T" "https://www.modelscope.cn/openapi/v1/studios/novaai2026/$STUDIO/logs/build" | sed 's/\\n/\n/g; s/","/\n/g' | grep -v "Layer already exists" | head -150 | cut -c1-300
          GIT_LFS_SKIP_SMUDGE=1 git clone -q "https://oauth2:${T}@www.modelscope.cn/studios/novaai2026/${STUDIO}.git" s 2>&1 | sed "s/${T}/***/g" || true
          cd s
          b=origin/sbuild-371239-1793316753
          echo "== files changed by build commit"; git show --stat --format='%h %P %s' $b | head -20
          for f in $(git show --name-only --format= $b); do echo "--- $f"; git show $b:$f | head -60; done
          echo "== old sham_app has generate_chat failed print: $(git show $b:sham_app.py | grep -c 'generate_chat failed (')"
          git log --format='%h %ad %s' --date=iso -12 origin/master

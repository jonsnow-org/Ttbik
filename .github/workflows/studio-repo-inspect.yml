name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          MS=https://www.modelscope.cn
          R=nova-inference-server
          echo "===== record"; curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/$R" | python3 -c "import json,sys;d=json.load(sys.stdin).get('Data') or json.load(open('/dev/null')) if False else json.load(sys.stdin)" 2>/dev/null; curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/$R" | python3 -c "
          import json,sys;d=json.load(sys.stdin);d=d.get('data') or d.get('Data') or d
          for k in ('status','base_image','sdk_type','sdk_version','hardware','runtime'): print(k, str(d.get(k))[:300])"
          for kind in build run; do echo "===== $kind log tail"; curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/$R/logs/$kind" | sed 's/\\n/\n/g; s/","/\n/g' | grep -v "^\s*$" | tail -25 | cut -c1-260; done

name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle==2.2.5
          kaggle datasets list -m -s sham-crawl- --csv -p 1 | head -5; echo ---
          kaggle datasets list -m --csv -p 1 | head -5; echo ---
          kaggle datasets list --user jonsnowjonsnow -s sham-crawl --csv | head -5; echo ---
          cd ai-system/colab/sham_small && python3 -c "import sham_inputs; print(sham_inputs.crawl_dataset_names())"

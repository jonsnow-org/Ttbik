name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          MS=https://www.modelscope.cn
          for R in sham-v2-server; do
            echo "===== $R git log"
            git clone -q "https://oauth2:${T}@www.modelscope.cn/studios/novaai2026/${R}.git" r 2>&1 | sed "s/${T}/***/g"
            git -C r log --format='%H %ad %s' --date=iso -8; git -C r branch -a
            echo "===== $R build log (commit / fetch lines)"
            curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/novaai2026/$R/logs/build" | sed 's/\\n/\n/g; s/","/\n/g' | grep -iE "commit|fetch|checkout|clone|branch|###" | head -40 | cut -c1-300
          done

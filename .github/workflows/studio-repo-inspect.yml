name: "Inspect one Studio's git repo and API record (read-only)"
on:
  push:
    branches: [grok/studio-repo-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          STUDIO: nova-inference-server
        run: |
          echo "::add-mask::$T"
          curl -sS -H "Authorization: Bearer $T" "https://www.modelscope.cn/openapi/v1/studios/novaai2026/$STUDIO/logs/run" > run.json
          wc -c run.json
          python3 - <<'PY'
          import json
          d = json.load(open("run.json"))
          logs = (d.get("data") or {}).get("logs") or d.get("logs") or []
          text = "\n".join(logs) if isinstance(logs, list) else str(logs)
          lines = text.splitlines()
          print("lines", len(lines))
          for l in lines[-120:]:
              print(l[:260])
          PY
          GIT_LFS_SKIP_SMUDGE=1 git clone -q "https://oauth2:${T}@www.modelscope.cn/studios/novaai2026/${STUDIO}.git" s 2>&1 | sed "s/${T}/***/g" || true
          cd s && ls -la && head -c 1500 README.md; echo; head -40 app.py; cat requirements.txt 2>/dev/null | head; cat packages.txt 2>/dev/null | head

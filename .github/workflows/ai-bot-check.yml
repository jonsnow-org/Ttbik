name: AI bot check (read-only)
# Prints which bot TELEGRAM_BOT_TOKEN is and where its webhook points (host only) plus the last delivery error. Never prints the token.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          t = os.environ.get("T", "")
          if not t:
              print("TELEGRAM_BOT_TOKEN secret is EMPTY or missing"); raise SystemExit
          def call(m):
              try:
                  return json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{t}/{m}", timeout=30))
              except Exception as e:
                  return {"error": str(e).replace(t, "***")[:200]}
          me = call("getMe"); print("bot:", (me.get("result") or {}).get("username"), me.get("error", ""))
          w = (call("getWebhookInfo").get("result") or {})
          u = w.get("url", "")
          print("webhook host:", urllib.parse.urlparse(u).netloc or "(none)")
          print("pending updates:", w.get("pending_update_count"))
          print("last error:", w.get("last_error_message"), w.get("last_error_date"))
          PY

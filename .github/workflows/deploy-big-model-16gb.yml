name: Deploy a big MoE model (Qwen3.6-35B-A3B) to the 16 GB Studio (nova-inference-server)
# Owner order 2026-11-02: Qwen3.6-35B-A3B (35B total, 3B active) joins the speed/quality test on the 16 GB Studio, once the computer hub has moved to an 8 GB Studio.
# Manual only. It reuses the coder app (llama.cpp + GGUF) and injects the model through environment defaults at the top of app.py.
on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: "ModelScope/HF GGUF repo"
        required: false
        default: "unsloth/Qwen3.6-35B-A3B-GGUF"
      model_file:
        description: "GGUF file in that repo"
        required: false
        default: "Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf"
      ctx:
        description: "Context tokens"
        required: false
        default: "16384"

concurrency:
  group: deploy-modelscope-big-coder
  cancel-in-progress: false

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026
  REPO: nova-inference-server
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Studio hardware and disk (read-only)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | head -c 1500; echo

      - name: Fetch the pinned llama.cpp release (checksum verified)
        run: |
          curl -sSL -o "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | sha256sum -c -

      - name: Push the app into the Studio repo
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          MODEL_REPO: ${{ inputs.model_repo }}
          MODEL_FILE: ${{ inputs.model_file }}
          CTX: ${{ inputs.ctx }}
        run: |
          git config --global user.name "big coder CI"
          git config --global user.email "ci@coder.local"
          git clone "https://oauth2:${T}@www.modelscope.cn/studios/${OWNER}/${REPO}.git" ms-studio 2>&1 | sed "s/${T}/***/g"
          cp ai-system/modelscope-coder/app.py ai-system/modelscope-coder/requirements.txt ms-studio/
          echo "${MODEL_REPO} ${MODEL_FILE} ${CTX}" > ms-studio/model.override
          python3 -m py_compile ms-studio/app.py
          split -b 4M -d -a 3 "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" "llama-${LLAMA_BUILD}.part"
          cd ms-studio
          rm -f llama-${LLAMA_BUILD}.part*
          cp ../llama-${LLAMA_BUILD}.part* .
          grep -q 'llama-\*.part' .gitattributes 2>/dev/null || printf 'llama-*.part* -filter -diff -merge -text\n' >> .gitattributes
          git add -A
          git diff --cached --quiet && echo "no change" || git commit -m "big coder: ${MODEL_FILE} ctx ${CTX} (${GITHUB_SHA::8})"
          git push origin HEAD:master 2>&1 | sed "s/${T}/***/g"

      - name: Deploy and wait until the model server is ready
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 1500; echo
          API="https://studio-${OWNER}-${REPO}.api-inference.modelscope.net"
          for i in $(seq 1 60); do
            sleep 30
            st=$(curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status'))")
            echo "$(date -u +%H:%M:%S) studio: $st"
            case "$st" in
              *ail*|*rror*)
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/build" | tail -c 4000; echo
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                exit 1;;
              Running|running)
                ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' "$API/gradio_api/call/v2/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                out=""
                [ -n "$ev" ] && out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev") && echo "status api: $out" | head -c 1500 && echo
                echo "$out" | grep -q 'phase[^,]*ready' && exit 0
                if echo "$out" | grep -q 'phase[^,]*error'; then
                  curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                  exit 1
                fi;;
            esac
          done
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
          exit 1

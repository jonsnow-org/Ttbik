name: Sham v2 live capability smoke test

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Deploy the Sham v2 Studio (Sham on the body of a trained donor, own chat, own media tokens; a NEW Studio, the current Sham Studio is not touched)"
    types: [completed]
    branches:
      - claude/free-services-marketplace-h6rwk2

permissions:
  contents: read

jobs:
  capability:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test a real capability question through Sham v2's dedicated Studio
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SHAM_V2_URL: https://studio-novaai2026-sham-v2-server.api-inference.modelscope.net
        run: python3 ai-system/supervision/sham_v2_chat_smoke.py

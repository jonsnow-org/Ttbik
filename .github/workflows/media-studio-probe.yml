name: Nova Media Studio Smoke Test

# Live test of Nova's own ModelScope media Studio: a real image (pixel std), Arabic speech (audible samples) and a real AnimateDiff-Lightning
# video (decoded, more than one frame, real motion). Nothing here touches Sham and nothing is sent to Telegram.
# It runs AFTER the deploy workflow of the Nova media Studio has finished (workflow_run), never on the same push: a probe that races the deploy hits the
# previous container (the failed runs 40611229256 / 40613962929: "no 'video' API: still OLD code" while the Studio was being rebuilt). It still WAITS until
# the Studio reports phase=ready and the AnimateDiff video engine, then checks the CONTENT of each result.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Deploy the Nova media Studio (image, Arabic speech, real AnimateDiff-Lightning video on a free CPU Studio)"
    types: [completed]
    branches:
      - claude/free-services-marketplace-h6rwk2

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe unit tests (no network)
        run: |
          python -m pip install numpy pillow imageio-ffmpeg
          PYTHONPATH=ai-system/app python -m unittest ai-system/app/test_nova_media_probe.py
      - name: Wait for the new Studio, then probe image, Arabic speech and AnimateDiff video (content checks)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          NOVA_MEDIA_URL: https://studio-novaai2026-nova-media-server.api-inference.modelscope.net
          READY_TIMEOUT: "2400"
          PROBE_OUT: ${{ runner.temp }}
        run: python ai-system/app/nova_media_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-media-probe
          path: |
            ${{ runner.temp }}/probe.png
            ${{ runner.temp }}/probe.wav
            ${{ runner.temp }}/probe.mp4
          if-no-files-found: ignore

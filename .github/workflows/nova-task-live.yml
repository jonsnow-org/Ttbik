name: Nova task timing (real coder Studio, nothing sent to Telegram)

# Sends one TASK message (default: read a repository and explain it) to the production chat handler against the REAL coder Studio and prints a timeline of every event and message with seconds since the request.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "the task message"
        required: false
        default: "اقرأ المستودع jonsnow-org/Ttbik على GitHub واشرح بنيته في فقرة قصيرة"
      model:
        description: "engine model: coder (Nova) or lfm25 (LFM2.5)"
        required: false
        default: "coder"
      studio_url:
        description: "empty = Nova's production Studio 1. An address (e.g. the international 16 GB Studio https://studio-jonjithup-coder-inference-server-16.api-inference.modelscope.ai) = run this task against THAT Studio only (uses the international token for it); Nova's pool is untouched."
        required: false
        default: ""
      drop_continue:
        description: "1 = lose the first hand-off (simulated disconnect) and check that the orphan sweep resumes the task"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts && (cd athar && npm ci --no-audit --no-fund)
      - name: Generate the Prisma client (types only, no database)
        run: npx prisma generate
      - name: Run the live fast-lane check
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          # NOVA_MEDIA_STUDIO_URL is deliberately NOT set: the code's built-in default Studio must work on a runtime without the variable (the 2026-10-28 15:33 failure)
          # GitHub for the throw-away owner chat: the owner's own token if the repository secret CODER_GITHUB_TOKEN exists (so private repositories are reachable), else this workflow's read-only token
          PROBE_GH_TOKEN: ${{ secrets.CODER_GITHUB_TOKEN || github.token }}
          PROBE_TEXT: ${{ inputs.text }}
          PROBE_MODEL: ${{ inputs.model }}
          PROBE_DROP_CONTINUE: ${{ inputs.drop_continue }}
          OPEN_CODER_STUDIO_URL: ${{ inputs.studio_url || 'https://studio-novaai2026-coder-inference-server.api-inference.modelscope.net' }}
          OPEN_CODER_STUDIO_TOKEN: ${{ inputs.studio_url != '' && secrets.MODELSCOPE_AI_TOKEN || '' }}
          PROBE_OUT: ${{ runner.temp }}
        run: |
          cd athar
          set -o pipefail
          npx jest --config ../jest.media.config.js --rootDir .. --testMatch '<rootDir>/src/lib/__tests__/live/novaTask.live.ts' 2>&1 | grep -v "^\s*at " | cut -c1-500 | head -400

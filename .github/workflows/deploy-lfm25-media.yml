name: "LFM2.5 media Studio: its OWN image + speech + video Studio on its OWN copy of the media weights"

# LFM2.5-8B-A1B (src/lib/coderModels.ts "lfm25") makes pictures, speech and video ONLY on lfm25-media-server, reading ONLY its own private
# repo novaai2026/lfm25-media-models (a one-time copy of the validated Nova media package; after that nothing is shared at run time).
# Free 8 GB CPU hardware only. Nothing secret is printed; nothing is deleted. The app code is the same media app the other models run.

on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      - ai-system/modelscope-media/app.py
      - ai-system/colab/sham_small/cpu_video.py
      - ai-system/colab/sham_small/media_quality.py
      - ai-system/app/nova_media_probe.py
      - ai-system/modelscope-media/requirements.txt
      - .github/workflows/deploy-lfm25-media.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-lfm25-media
  cancel-in-progress: false

permissions:
  contents: read

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026

jobs:
  deploy:
    name: ${{ matrix.candidate.id }} media Studio
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        candidate:
          - id: lfm25
    env:
      REPO: lfm25-media-server
    steps:
      - uses: actions/checkout@v4

      # One-time seed: when LFM2.5's private media repo is missing or empty it gets its own copy of the validated media package
      # (SDXS picture model, Arabic Piper voice, video helpers). An existing, non-empty repo is never touched again.
      - name: Seed LFM2.5's own private media weights (only when missing)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SOURCE: novaai2026/nova-media-models
          TARGET: novaai2026/lfm25-media-models
        run: |
          python3 -m pip install -q modelscope
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          from modelscope.hub.api import HubApi
          from modelscope import snapshot_download
          tok, src, dst = os.environ["MODELSCOPE_TOKEN"], os.environ["SOURCE"], os.environ["TARGET"]
          api = HubApi(); api.login(tok)
          try:
              files = [f for f in api.get_model_files(dst, recursive=True) if f.get("Type") != "tree" and f.get("Name") != ".gitattributes"]
          except Exception as e:
              files = None
              print("target not readable yet:", type(e).__name__)
          if files:
              print(f"{dst} already holds {len(files)} files: kept as it is"); raise SystemExit(0)
          if files is None:
              try:
                  api.create_repo(dst, visibility="private", repo_type="model", license="Apache License 2.0", exist_ok=True)
                  print("created", dst)
              except Exception as e:
                  print("create:", type(e).__name__, str(e)[:160].replace(tok, "***"))
          d = snapshot_download(src, cache_dir="/tmp/seed")
          root = Path(d)
          print("source files:", sum(1 for p in root.rglob("*") if p.is_file()))
          api.upload_folder(repo_id=dst, folder_path=str(root), commit_message="LFM2.5 own media package (copy of the validated Nova media weights)", ignore_patterns=[".git*", "._____temp*"])
          print("uploaded to", dst)
          shutil.rmtree("/tmp/seed", ignore_errors=True)
          PY
      - name: Account, free hardware and existing Studio (read-only)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          echo "user:";      api /users/me | python3 -c "import json,sys;d=json.load(sys.stdin);x=d.get('data') or d.get('Data') or d;print({k:x.get(k) for k in ('username','name','level') if isinstance(x,dict)})" || true
          echo "hardware:";  api "/studios/hardware?sdk_type=gradio" | tee hw.json | head -c 3000; echo
          echo "sdk:";       api "/studios/sdk-versions?sdk_type=gradio" | tee sdk.json | head -c 1500; echo
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "studio http $code"; head -c 1500 studio.json; echo
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"

      - name: Create the Studio if missing (private, free CPU)
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          HW=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open("hw.json"))
          except Exception:
              d = {}
          items = d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items, dict):
              items = items.get("items") or items.get("hardware") or []
          free = [i for i in items if isinstance(i, dict) and str(i.get("resource_type", "")).lower() != "paid" and not str(i.get("name", "")).startswith("paid/")]
          cpu = [i for i in free if "cpu" in str(i.get("name", "")).lower()]
          pick = (cpu or free or [{"name": "platform/2v-cpu-16g-mem"}])[-1]
          print(pick.get("name"))
          PY
          )
          echo "hardware pick: $HW"
          case "$HW" in paid/*) echo "refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':os.environ['REPO']}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "create http $code"; head -c 2000 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Studio creation refused (see body above: quota / verification / one-Studio limit)"; exit 1; }

      - name: Push the app into the Studio repo
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.name "media CI"
          git config --global user.email "ci@media.local"
          git clone "https://oauth2:${T}@www.modelscope.cn/studios/${OWNER}/${REPO}.git" ms-studio 2>&1 | sed "s/${T}/***/g"
          cp ai-system/modelscope-media/app.py ai-system/modelscope-media/requirements.txt ms-studio/
          cp ai-system/colab/sham_small/media_quality.py ms-studio/media_quality.py
          cd ms-studio
          git add app.py requirements.txt media_quality.py
          git diff --cached --quiet && echo "no change" || git commit -m "media: app (${GITHUB_SHA::8})"
          git push origin HEAD:master 2>&1 | sed "s/${T}/***/g"

      - name: Give the Studio the token it needs to read the private model repo (as a Studio secret; never printed)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MEDIA_REPO: novaai2026/lfm25-media-models
        run: |
          pip install -q modelscope
          python - <<'PY'
          import os
          from modelscope.hub.api import HubApi
          api = HubApi()
          api.login(os.environ["MODELSCOPE_TOKEN"])
          sid, tok = "novaai2026/" + os.environ["REPO"], os.environ["MODELSCOPE_TOKEN"]
          for key, val in (("MODELSCOPE_API_TOKEN", tok), ("MEDIA_MODEL_REPO", os.environ["MEDIA_REPO"])):
              try:
                  api.add_studio_secret(sid, key, val)
              except Exception as e:                   # already there: replace it
                  print("add", key, type(e).__name__, str(e)[:100].replace(tok, "***"))
                  api.update_studio_secret(sid, key, val)
          print("studio secret set")
          PY

      - name: Deploy and show status
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 1500; echo
          API="https://studio-${OWNER}-${REPO}.api-inference.modelscope.net"
          for i in $(seq 1 40); do
            sleep 30
            st=$(curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;s=sys.stdin.read().strip();d=json.loads(s) if s.startswith('{') else {};d=d.get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status') or '')")
            echo "$(date -u +%H:%M:%S) studio: $st"
            case "$st" in
              *ail*|*rror*|*topped*)
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/build" | tail -c 4000; echo
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                exit 1;;
              Running|running)
                for j in $(seq 1 20); do
                  ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' "$API/gradio_api/call/v2/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                  [ -n "$ev" ] && out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev") && echo "status api: $out" | head -c 1500 && echo
                  echo "$out" | grep -q 'phase[^,]*ready' && exit 0
                  if echo "$out" | grep -q 'phase[^,]*error'; then
                    echo "::error::the Studio is running but the model server is in the error phase"
                    curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                    exit 1
                  fi
                  sleep 30
                done
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                echo "::error::the model server was not ready in time"
                exit 1;;
            esac
          done
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
          exit 1

      - name: Generate and validate a real video on this candidate-owned media Studio
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          NOVA_MEDIA_URL: https://studio-${{ env.OWNER }}-${{ env.REPO }}.api-inference.modelscope.net
          PROBE_KINDS: image,speech,video
          READY_TIMEOUT: "2400"
          PROBE_OUT: ${{ runner.temp }}
        run: |
          python3 -m pip install -q numpy pillow imageio-ffmpeg
          python3 ai-system/app/nova_media_probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate.id }}-media-video-smoke
          path: ${{ runner.temp }}/probe.mp4
          if-no-files-found: ignore

name: zenobia-season
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
concurrency:
  group: zenobia-season
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: daily holder snapshot and weekly season close
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          code=$(curl -sS -m 120 -o body.json -w "%{http_code}" "${SITE_BASE}/api/cron/zenobia-season?secret=${CRON_SECRET}")
          echo "HTTP ${code}"; cat body.json; echo
          [ "${code}" -lt 500 ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_BASE: ${{ vars.SITE_BASE || 'https://ttbik.vercel.app' }}   # repo variable SITE_BASE = the gate's address after the move

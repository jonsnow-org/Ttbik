name: "Nova media bench (image and Arabic speech on a free CPU, read-only)"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install diffusers transformers accelerate safetensors pillow huggingface_hub piper-tts
      - name: Bench
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: taskset -c 0,1 python scripts/nova-media/bench.py
      - name: Keep the samples on a side branch so they can be looked at
        run: |
          cd /tmp/media && git init -q -b nova-test/media-samples && git config user.name "bench" && git config user.email "bench@users.noreply.github.com"
          git add -A && git commit -q -m "media bench samples [skip ci]"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" nova-test/media-samples

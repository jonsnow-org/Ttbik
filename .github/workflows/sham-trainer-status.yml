name: Sham trainer Studios status (read-only)

# Asks each trainer Studio for its own status (phase, last cycle, error). Read-only; the token is never printed.
# site=cn (default): account novaai2026, secret MODELSCOPE_TOKEN. site=ai: account Jonjithup, secret MODELSCOPE_AI_TOKEN.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "cn = modelscope.cn (novaai2026) | ai = modelscope.ai (Jonjithup)"
        required: false
        default: "cn"
      repos:
        description: "comma list of Studio repos (empty = site default: three cn trainers, or sham-trainer-1 on ai)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/free-services-marketplace-h6rwk2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Status
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
          SITE: ${{ inputs.site || 'cn' }}
          SHAM_TRAINER_REPOS: ${{ inputs.repos }}
        run: python3 scripts/ops/sham_trainer_status.py

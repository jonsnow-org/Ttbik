name: "Inspect CyberRealistic post-boot readiness"

on:
  push:
    branches:
      - realistic-vision-v6-isolated-test
    paths:
      - .github/workflows/inspect-cyberrealistic-postboot.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Poll runtime and model loader without changing the Studio
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MODELSCOPE_TOKEN"
          python -m pip install -q "modelscope>=1.26.0"
          MODELSCOPE_TOKEN="$MODELSCOPE_TOKEN" python - <<'PY'
          import json, os, time
          import requests
          from modelscope.hub.api import HubApi

          token=os.environ["MODELSCOPE_TOKEN"].strip()
          api=HubApi()
          api.login(token)
          repo="novaai2026/cyberrealistic-final-test"
          endpoint="https://studio-novaai2026-cyberrealistic-final-test.api-inference.modelscope.net"
          session=requests.Session()
          session.headers.update({"Authorization":"Bearer "+token})
          for attempt in range(8):
              info=api.get_repo(repo,"studio")
              runtime=getattr(info,"runtime",None) or {}
              status=str(runtime.get("status") or "")
              print("CYBER_RUNTIME",attempt+1,json.dumps(runtime,ensure_ascii=False))
              if status.lower()=="running":
                  try:
                      health=session.get(endpoint+"/gradio_api/info",timeout=20)
                      print("CYBER_INFO_HTTP",health.status_code,health.text[:600])
                      if health.status_code==200:
                          start=session.post(endpoint+"/gradio_api/call/status",json={"data":[]},timeout=30)
                          print("CYBER_STATUS_POST",start.status_code,start.text[:400])
                          if start.status_code==200 and start.json().get("event_id"):
                              event=start.json()["event_id"]
                              response=session.get(endpoint+"/gradio_api/call/status/"+event,timeout=60)
                              print("CYBER_STATUS_GET",response.status_code)
                              print("CYBER_STATUS_EVENT",response.text[:4000])
                              break
                  except requests.RequestException as exc:
                      print("CYBER_HEALTH_RETRY",type(exc).__name__,str(exc)[:350])
              time.sleep(15)

          print("CYBER_RUN_LOGS_BEGIN")
          try:
              logs=api.get_repo_logs(repo,log_type="run",page_size=100)
              print(json.dumps(logs,ensure_ascii=False)[-10000:])
          except Exception as exc:
              print("CYBER_RUN_LOGS_ERROR",type(exc).__name__,str(exc)[:500])
          print("CYBER_RUN_LOGS_END")
          PY

name: "Deploy isolated Gemma 4 independent Gemma 4 image weight — Realistic Vision V6.0 photo-test Studio"

on:
  push:
    branches:
      - realistic-vision-v6-isolated-test
    paths:
      - experiments/gemma4-realistic-vision-v6-test/**
      - .github/workflows/deploy-gemma4-realistic-vision-image-test.yml
  workflow_dispatch:

concurrency:
  group: gemma4-realistic-vision-v6-isolated-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026
  MODEL_REPO: gemma4-realistic-vision-v6-test-models
  STUDIO_REPO: gemma4-realistic-vision-v6-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: realistic-vision-v6-isolated-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage the single checkpoint and recommended VAE in a private ModelScope model repo
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PHOTO_MODEL_REPO: novaai2026/gemma4-realistic-vision-v6-test-models
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install "modelscope>=1.26.0" "huggingface_hub>=0.24.0" safetensors
          python -m py_compile experiments/gemma4-realistic-vision-v6-test/prepare_and_push.py
          python experiments/gemma4-realistic-vision-v6-test/prepare_and_push.py

      - name: Inspect free CPU hardware and existing isolated Studio (read-only)
        id: inspect
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          api() { curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          api "/studios/hardware?sdk_type=gradio" > hardware.json
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o studio.json -w '%{http_code}' \
            -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO")
          echo "existing Studio HTTP status: $code"
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          d=json.load(open("hardware.json"))
          items=d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items,dict):
              items=items.get("items") or items.get("hardware") or []
          print("Available non-paid CPU hardware candidates:")
          for x in items:
              if not isinstance(x,dict):
                  continue
              name=str(x.get("name") or x.get("hardware") or "")
              typ=str(x.get("resource_type") or x.get("type") or "").lower()
              price=x.get("price") or x.get("price_per_hour") or x.get("cost")
              if "cpu" in name.lower() and not name.lower().startswith("paid/") and typ != "paid" and price in (None, "", 0, "0", "0.0"):
                  print({k:x.get(k) for k in ("name","resource_type","type","price","memory","cpu","description") if k in x})
          PY

      - name: Create only the isolated private CPU Studio if it does not exist
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, sys
          d=json.load(open("hardware.json"))
          items=d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items,dict):
              items=items.get("items") or items.get("hardware") or []
          candidates=[]
          for x in items:
              if not isinstance(x,dict):
                  continue
              name=str(x.get("name") or x.get("hardware") or "")
              typ=str(x.get("resource_type") or x.get("type") or "").lower()
              price=x.get("price") or x.get("price_per_hour") or x.get("cost")
              paid = name.lower().startswith("paid/") or typ == "paid"
              nonzero = price not in (None, "", 0, "0", "0.0")
              if "cpu" in name.lower() and not paid and not nonzero:
                  candidates.append(x)
          if not candidates:
              print("No explicitly non-paid CPU hardware was returned; refusing to create a potentially paid Studio.")
              sys.exit(2)
          def ram(x):
              s=str(x.get("name") or x.get("hardware") or "")
              m=re.search(r"(\d+)\s*g(?:b)?(?:-|$)",s.lower())
              return int(m.group(1)) if m else 0
          candidates.sort(key=ram, reverse=True)
          selected=candidates[0]
          hw=selected.get("name") or selected.get("hardware")
          if not hw or str(hw).lower().startswith("paid/"):
              raise SystemExit("The selected hardware is not verified as free CPU.")
          body={
              "owner": "novaai2026",
              "repo_name": "gemma4-realistic-vision-v6-test",
              "sdk_type": "gradio",
              "visibility": "private",
              "hardware": hw,
              "display_name": "Gemma 4 independent Gemma 4 image weight — Realistic Vision V6.0 image-weight test",
          }
          json.dump(body,open("create-studio.json","w"))
          print("Selected non-paid CPU hardware:",hw)
          PY
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o create-studio-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            --data-binary @create-studio.json "$MS/openapi/v1/studios")
          echo "Studio creation HTTP status: $code"
          cat create-studio-response.json
          test "$code" -ge 200 && test "$code" -lt 300 || {
            echo "::error::ModelScope refused creation; no production Studio was targeted."
            exit 1
          }

      - name: Ensure an existing isolated Studio is not paid hardware
        if: env.STUDIO_HTTP == '200'
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open("studio.json"))
          data=d.get("data") or d.get("Data") or d
          text=json.dumps(data).lower()
          if "paid/" in text:
              print("The existing test Studio reports paid hardware; refusing to redeploy.")
              sys.exit(2)
          print("Existing test Studio found. No hardware changes will be made.")
          PY

      - name: Publish app code to the isolated Studio repository
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Realistic Vision test CI"
          git config --global user.email "photo-test-ci@users.noreply.github.com"
          git clone "https://oauth2:$T@www.modelscope.cn/studios/$OWNER/$STUDIO_REPO.git" ms-photo-studio 2>&1 | sed "s/$T/***/g"
          cp experiments/gemma4-realistic-vision-v6-test/app.py ms-photo-studio/app.py
          cp experiments/gemma4-realistic-vision-v6-test/requirements.txt ms-photo-studio/requirements.txt
          cd ms-photo-studio
          git add app.py requirements.txt
          if ! git diff --cached --quiet; then
            git commit -m "deploy isolated Realistic Vision V6 photo test"
            git push origin HEAD:master 2>&1 | sed "s/$T/***/g"
          else
            echo "Studio app files are already current."
          fi

      - name: Add the private model-read token to this Studio only
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install -q "modelscope>=1.26.0"
          python - <<'PY'
          import os
          from modelscope.hub.api import HubApi
          api=HubApi()
          token=os.environ["MODELSCOPE_TOKEN"]
          api.login(token)
          sid="novaai2026/gemma4-realistic-vision-v6-test"
          try:
              api.add_studio_secret(sid,"MODELSCOPE_API_TOKEN",token)
          except Exception as exc:
              message=str(exc).lower()
              if "exist" not in message and "already" not in message and "duplicate" not in message:
                  raise
              api.update_studio_secret(sid,"MODELSCOPE_API_TOKEN",token)
          print("Private model-read secret configured for the photo-test Studio.")
          PY

      - name: Deploy and wait for verified checkpoint and VAE loading
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://studio-$OWNER-$STUDIO_REPO.api-inference.modelscope.net"
          curl -fsS --connect-timeout 10 --max-time 60 -X POST \
            -H "Authorization: Bearer $T" \
            "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO/deploy" | head -c 2000
          echo
          ready=0
          for i in $(seq 1 100); do
            sleep 30
            studio=$(curl -sS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO")
            runtime=$(printf '%s' "$studio" | python -c "import json,sys;d=json.load(sys.stdin);d=d.get('data') or d.get('Data') or d;print((d.get('runtime') or {}).get('status') or d.get('status') or '')" 2>/dev/null || true)
            echo "$(date -u +%H:%M:%S) Studio runtime: $runtime"
            case "$runtime" in
              *ail*|*rror*|*topped*)
                echo "::error::The isolated Studio failed during deployment."
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO/logs/build" | tail -c 5000 || true
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO/logs/run" | tail -c 7000 || true
                exit 1;;
            esac
            case "$runtime" in
              Running|running)
                ev=$(curl -sS --connect-timeout 10 --max-time 45 -X POST \
                  -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                  -d '{"data":[]}' "$API/gradio_api/call/status" \
                  | python -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                if [ -n "$ev" ]; then
                  out=$(curl -sS --connect-timeout 10 --max-time 90 \
                    -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev" || true)
                  phase=$(STATUS_RESPONSE="$out" python - <<'PY'
          import json, os
          raw=os.environ.get("STATUS_RESPONSE","")
          found=[]
          def visit(value):
              if isinstance(value, dict):
                  if isinstance(value.get("phase"), str):
                      found.append(value["phase"])
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
              elif isinstance(value, str):
                  try:
                      visit(json.loads(value))
                  except Exception:
                      pass
          for line in raw.splitlines():
              line=line.strip()
              if line.startswith("data:"):
                  payload=line.split(":",1)[1].strip()
                  try:
                      visit(json.loads(payload))
                  except Exception:
                      pass
          if not found:
              try:
                  visit(json.loads(raw))
              except Exception:
                  pass
          print(found[-1] if found else "")
          PY
          )
                  echo "model-loader phase: ${phase:-not-reported}"
                  if [ "$phase" = "ready" ]; then
                    echo "$out" | tail -c 4000
                    ready=1
                    break
                  fi
                  if [ "$phase" = "error" ]; then
                    echo "$out" | tail -c 4000
                    echo "::error::Studio launched but rejected or failed to load checkpoint/VAE."
                    curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO/logs/run" | tail -c 7000 || true
                    exit 1
                  fi
                fi
                ;;
            esac
          done
          if [ "$ready" -ne 1 ]; then
            curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$STUDIO_REPO/logs/run" | tail -c 7000 || true
            echo "::error::The Studio did not report phase=ready before timeout."
            exit 1
          fi
          {
            echo "## Gemma 4 independent Gemma 4 image weight — Realistic Vision V6.0 image-weight test"
            echo "- Studio: https://www.modelscope.cn/studios/$OWNER/$STUDIO_REPO"
            echo "- API: $API"
            echo "- Model repo: https://www.modelscope.cn/models/$OWNER/$MODEL_REPO"
            echo "- Hardware: non-paid CPU only"
            echo "- Production routes changed: no"
            echo "- Status: checkpoint and recommended VAE passed hash verification and loaded."
            echo "- Manual visual review is still required before any production routing change."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate one image from Gemma's private image-weight Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p gemma4-photo-smoke
          python - <<'PY'
          import hashlib, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          api = "https://studio-novaai2026-gemma4-realistic-vision-v6-test.api-inference.modelscope.net"
          token = os.environ["T"]
          expected_repo = "novaai2026/gemma4-realistic-vision-v6-test-models"
          expected_sha = "c48bfd159cd7a6507b128685e963c398fa72399cefafaf603781df50ce836cc7"

          def call(url, data=None, timeout=60):
              headers = {"Authorization": "Bearer " + token}
              payload = None
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  payload = json.dumps(data).encode()
              req = urllib.request.Request(url, data=payload, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), response.headers

          raw, _ = call(api + "/gradio_api/call/image", {
              "data": [
                  "A documentary RAW photograph of a quiet old stone street just after rain, natural overcast daylight, realistic reflections, detailed stone texture, candid photography",
                  "cartoon, anime, illustration, CGI, plastic skin, deformed, blurry, watermark, text",
                  "512 × 512", 25, 5.5, 31415
              ]
          })
          event_id = str(json.loads(raw).get("event_id") or "")
          if not event_id:
              raise SystemExit("Gemma image Studio returned no Gradio generation event.")
          completed = None
          last = ""
          deadline = time.time() + 900
          while time.time() < deadline:
              try:
                  body, _ = call(api + "/gradio_api/call/image/" + urllib.parse.quote(event_id, safe=""), timeout=90)
                  last = body.decode("utf-8", "replace")
                  if "event: error" in last:
                      raise SystemExit("Gemma image generation returned an error event: " + last[-2500:])
                  if "event: complete" in last:
                      completed = last
                      break
              except Exception as exc:
                  if "error event" in str(exc):
                      raise
                  last = str(exc)
              time.sleep(8)
          if not completed:
              raise SystemExit("Gemma image generation timed out after 900 seconds. Last response: " + last[-1000:])

          def walk(value, depth=0):
              if depth > 10:
                  return
              if isinstance(value, str):
                  try:
                      yield from walk(json.loads(value), depth + 1)
                  except Exception:
                      return
              elif isinstance(value, dict):
                  yield value
                  for child in value.values():
                      if isinstance(child, (dict, list, str)):
                          yield from walk(child, depth + 1)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child, depth + 1)

          objects = []
          for line in completed.splitlines():
              if line.startswith("data:"):
                  try:
                      objects.extend(walk(json.loads(line[5:].strip())))
                  except Exception:
                      pass
          metadata = next((x for x in objects if x.get("result") == "image_generated"), None)
          file_obj = next((x for x in objects if isinstance(x.get("path"), str) and x.get("path")), None)
          if not metadata or not file_obj:
              raise SystemExit("Gemma completed but no generated image and metadata were returned.")
          if metadata.get("model_repo") != expected_repo:
              raise SystemExit("Gemma output came from a different private model repo.")
          if str(metadata.get("checkpoint_sha256") or "").lower() != expected_sha:
              raise SystemExit("Gemma output checkpoint SHA-256 differs from its pinned Realistic Vision copy.")

          relative = file_obj["path"].replace("\\", "/")
          marker = "/gradio_api/file="
          if marker in relative:
              relative = relative.split(marker, 1)[1]
          relative = relative.lstrip("/")
          if not relative or ".." in relative.split("/"):
              raise SystemExit("Gemma returned an unsafe image file path.")
          image_bytes, image_headers = call(api + "/gradio_api/file=/" + urllib.parse.quote(relative, safe="/"), timeout=120)
          mime = image_headers.get("Content-Type", "").split(";", 1)[0].lower()
          if not mime.startswith("image/") or len(image_bytes) < 1000:
              raise SystemExit("Gemma returned an empty or non-image output.")
          if mime == "image/png" and not image_bytes.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Gemma returned invalid PNG bytes.")
          out = Path("gemma4-photo-smoke/gemma4-realistic-vision-smoke.png")
          out.write_bytes(image_bytes)
          report = {
              "candidate": "gemma4-e4b",
              "model_repo": metadata["model_repo"],
              "checkpoint_sha256": metadata["checkpoint_sha256"],
              "vae_sha256": metadata.get("vae_sha256"),
              "image_sha256": hashlib.sha256(image_bytes).hexdigest(),
              "image_bytes": len(image_bytes),
              "mime": mime,
              "seed": metadata.get("seed"),
              "seconds": metadata.get("seconds"),
              "resolution": metadata.get("resolution"),
              "basic_image_checks": metadata.get("basic_image_checks"),
              "app_revision": metadata.get("app_revision"),
              "device": metadata.get("device"),
              "file": str(out),
          }
          Path("gemma4-photo-smoke/result.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Save Gemma generated image and proof metadata
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-independent-image-smoke
          path: gemma4-photo-smoke/
          retention-days: 30
          if-no-files-found: error

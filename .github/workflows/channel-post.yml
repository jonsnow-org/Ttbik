name: channel-post
on:
  schedule:
    - cron: "0 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:
concurrency:
  group: channel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: publish
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::GitHub secret CRON_SECRET is empty or missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          code=$(curl -sS -o body.json -w "%{http_code}" "${SITE_BASE}/api/cron/telegram-post?secret=${CRON_SECRET}")
          echo "HTTP ${code}"
          cat body.json
          echo
          if [ "${code}" = "401" ]; then
            echo "::error::CRON_SECRET in GitHub does not match the one in Vercel"
            exit 1
          fi
          [ "${code}" -lt 500 ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_BASE: ${{ vars.SITE_BASE || 'https://ttbik.vercel.app' }}   # repo variable SITE_BASE = the gate's address after the move

name: Agent card live check (real Studios, nothing sent to Telegram)

# Runs the production progress-card code against the REAL Nova coder Studios (production handler) and the REAL Sham v2 Studio (agent loop): prints every version of the card
# (exact times, the model's own understanding line, real tool steps) and the final answer. A read-only GitHub read of this repository is the task. Nothing is sent anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts && (cd athar && npm ci --no-audit --no-fund)
      - name: Generate the Prisma client (types only, no database)
        run: npx prisma generate
      - name: Run the live card check
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PROBE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_REPO: ${{ github.repository }}
          OPEN_CODER_STUDIO_URL: https://studio-novaai2026-coder-inference-server.api-inference.modelscope.net
          OPEN_CODER_STUDIO_URLS: https://studio-novaai2026-coder-inference-server-2.api-inference.modelscope.net,https://studio-novaai2026-coder-inference-server-3.api-inference.modelscope.net
        run: |
          cd athar
          set -o pipefail
          npx jest --config ../jest.media.config.js --rootDir .. --testMatch '<rootDir>/src/lib/__tests__/live/agentCard.live.ts' 2>&1 | grep -v "^\s*at " | cut -c1-600 | tail -400

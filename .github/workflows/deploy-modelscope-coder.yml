name: Deploy ModelScope coder Studio

# The open coding model (ai-system/modelscope-coder/) on its OWN ModelScope Studio — never Sham's Studio (nova-inference-server).
# GitHub's runners reach both github.com and modelscope.cn; the Studio itself reaches only modelscope.cn, so this job carries the
# pinned llama.cpp release tarball into the Studio repo. Uses the existing MODELSCOPE_TOKEN secret; nothing secret is printed.
# Creates the Studio (private, FREE CPU hardware only) when it does not exist yet; never selects paid hardware; never deletes anything.

on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
      - coder-sections
    paths:
      - "ai-system/modelscope-coder/**"
      - ".github/workflows/deploy-modelscope-coder.yml"
  workflow_dispatch:
    inputs:
      redeploy:
        description: "true = ask ModelScope to (re)deploy after pushing the files"
        required: false
        default: "true"
      site:
        description: "cn = modelscope.cn (account novaai2026, 8 GB free tier; the default) | ai = modelscope.ai (the owner's international account, secret MODELSCOPE_AI_TOKEN, 16 GB free tier; needs 'studio' set, e.g. coder-inference-server-16)"
        required: false
        default: "cn"
      studio:
        description: "Deploy only this Studio (coder-inference-server, a replica coder-inference-server-<n>). Empty = every Studio listed in ai-system/modelscope-coder/STUDIOS."
        required: false
        default: ""

concurrency:
  group: deploy-modelscope-coder-${{ inputs.site || 'cn' }}
  cancel-in-progress: false

env:
  MS: ${{ inputs.site == 'ai' && 'https://www.modelscope.ai' || 'https://www.modelscope.cn' }}
  OWNER: ${{ inputs.site == 'ai' && 'Jonjithup' || 'novaai2026' }}
  SITE: ${{ inputs.site || 'cn' }}
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e

jobs:
  plan:
    # one Studio per line in ai-system/modelscope-coder/STUDIOS: the primary and its replicas always run the same app.py (adding capacity = one line)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          ONLY: ${{ inputs.studio }}
          SITE: ${{ inputs.site || 'cn' }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          only = os.environ.get("ONLY", "").strip()
          if os.environ.get("SITE") == "ai" and not only:
              raise SystemExit("site=ai needs an explicit 'studio' (the STUDIOS list is the cn pool)")
          names = [only] if only else [l.strip() for l in open("ai-system/modelscope-coder/STUDIOS") if l.strip() and not l.startswith("#")]
          # nova-tldm-reader(-<n>): Nova's OWN T-LDM reader Studio (owner 2026-11-25, T-5 option 2; listed in NOVA_TLDM_READER_STUDIOS); it serves generate_tldm only, never chat
          ok = re.compile(r"^(coder-inference-server(-[0-9]{1,2})?|nova-tldm-reader(-[0-9]{1,2})?)$")
          bad = [n for n in names if not ok.match(n)]
          if bad:
              raise SystemExit(f"refusing studio names {bad} (only coder-inference-server, coder-inference-server-<n>, nova-tldm-reader(-<n>); never Sham's)")
          if not names:             # owner 2026-11-22: the cn Studios are free for training; Nova no longer runs on cn, so an empty cn pool deploys nothing
              open(os.environ["GITHUB_OUTPUT"], "a").write("list=[]\n")
              print("STUDIOS is empty: nothing to deploy")
              raise SystemExit(0)
          # A push must not restart the cn Nova 4B pool unless the files they actually run changed.
          # site=ai is dispatch-only (needs an explicit studio) and is never in the STUDIOS list.
          before = (os.environ.get("BEFORE") or "").strip()
          if (not only) and os.environ.get("EVENT") == "push" and before and set(before) != {"0"}:
              try:
                  subprocess.check_call(["git", "fetch", "--depth=1", "origin", before], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  diff = subprocess.check_output(["git", "diff", "--name-only", before, "HEAD"], text=True).splitlines()
              except subprocess.CalledProcessError:
                  diff = []
              app_files = {
                  "ai-system/modelscope-coder/app.py",
                  "ai-system/modelscope-coder/nova_tldm_serve.py",
                  "ai-system/modelscope-coder/requirements.txt",
                  "ai-system/modelscope-coder/VISION_STUDIOS",
                  "ai-system/modelscope-coder/STUDIOS",
              }
              touched_app = any(path in app_files for path in diff)
              if not touched_app:
                  changed_overrides = set()
                  if "ai-system/modelscope-coder/MODEL_OVERRIDES" in diff:
                      try:
                          old = subprocess.check_output(["git", "show", f"{before}:ai-system/modelscope-coder/MODEL_OVERRIDES"], text=True)
                      except subprocess.CalledProcessError:
                          old = ""
                      new = open("ai-system/modelscope-coder/MODEL_OVERRIDES").read()
                      def ov_lines(s):
                          return {l.split()[0]: l for l in s.splitlines() if l.strip() and not l.startswith("#") and l.split()}
                      prev, cur = ov_lines(old), ov_lines(new)
                      changed_overrides = {k for k in set(prev) | set(cur) if prev.get(k) != cur.get(k)}
                  names = [n for n in names if n in changed_overrides]
                  print("push did not change the cn app; deploying only STUDIOS whose override line changed:", names)
          open(os.environ["GITHUB_OUTPUT"], "a").write("list=" + json.dumps(names) + "\n")
          print("studios:", names)
          PY

  deploy:
    needs: plan
    if: needs.plan.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        studio: ${{ fromJson(needs.plan.outputs.list) }}
    env:
      REPO: ${{ matrix.studio }}
    steps:
      - uses: actions/checkout@v7

      - name: Account, free hardware and existing Studio (read-only)
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          echo "user:";      api /users/me | python3 -c "import json,sys;d=json.load(sys.stdin);x=d.get('data') or d.get('Data') or d;print({k:x.get(k) for k in ('username','name','level') if isinstance(x,dict)})" || true
          echo "hardware:";  api "/studios/hardware?sdk_type=gradio" | tee hw.json | head -c 3000; echo
          # the account's Studios (names + status only): a "create too many studios" refusal needs to know which ones hold the quota
          echo "studios:"; api "/studios?owner=$OWNER&page_number=1&page_size=50" | python3 -c "import json,sys;d=json.load(sys.stdin);x=(d.get('data') or {});L=x.get('studios') or x.get('items') or x.get('list') or (x if isinstance(x,list) else []);print(d.get('code') or '', d.get('message') or '', x.get('total_count', '') if isinstance(x,dict) else '');[print(' ', i.get('name') or i.get('repo_name') or i.get('path'), i.get('status') or i.get('state'), i.get('hardware') or '', i.get('last_modified') or i.get('gmt_modified') or '') for i in L if isinstance(i,dict)]" 2>&1 | head -60
          echo "sdk:";       api "/studios/sdk-versions?sdk_type=gradio" | tee sdk.json | head -c 1500; echo
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "studio http $code"; head -c 1500 studio.json; echo
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"

      - name: Create the Studio if missing (private, free CPU)
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          HW=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open("hw.json"))
          except Exception:
              d = {}
          items = d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items, dict):
              items = items.get("items") or items.get("hardware") or []
          free = [i for i in items if isinstance(i, dict) and str(i.get("resource_type", "")).lower() != "paid" and not str(i.get("name", "")).startswith("paid/")]
          cpu = [i for i in free if "cpu" in str(i.get("name", "")).lower()]
          pick = (cpu or free or [{"name": "platform/2v-cpu-16g-mem"}])[-1]
          print(pick.get("name"))
          PY
          )
          echo "hardware pick: $HW"
          case "$HW" in paid/*) echo "refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':os.environ['REPO']}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "create http $code"; head -c 2000 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Studio creation refused (see body above: quota / verification / one-Studio limit)"; exit 1; }

      - name: Fetch the pinned llama.cpp release (checksum verified)
        run: |
          curl -sSL -o "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | sha256sum -c -

      - name: Push the app into the Studio repo
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.name "coder CI"
          git config --global user.email "ci@coder.local"
          git clone "https://oauth2:${T}@${MS#https://}/studios/${OWNER}/${REPO}.git" ms-studio 2>&1 | sed "s/${T}/***/g"
          cp ai-system/modelscope-coder/app.py ai-system/modelscope-coder/requirements.txt ai-system/modelscope-coder/nova_tldm_serve.py ms-studio/
          # Nova's own T-LDM (nova_tldm_serve.py): the head's library is copied next to it; the head file (nova2_heads.pt) comes from the head repo at first use. Off unless NOVA_TLDM=1.
          rm -rf ms-studio/tldm && mkdir -p ms-studio/tldm && cp -r ai-system/tldm/sham_tldm ms-studio/tldm/ && find ms-studio/tldm -name __pycache__ -prune -exec rm -rf {} +
          # a Studio listed in VISION_STUDIOS reads pictures: the marker file next to app.py switches it on (app.py loads the model's vision file); any other Studio has none
          if grep -qxF "${REPO}" ai-system/modelscope-coder/VISION_STUDIOS 2>/dev/null; then echo on > ms-studio/vision.on; else rm -f ms-studio/vision.on; fi
          # a Studio listed in NOVA_TLDM_STUDIOS serves Nova's T-LDM head (nova_tldm_serve.py): the marker file switches it on, any other Studio has none
          if grep -qxF "${REPO}" ai-system/modelscope-coder/NOVA_TLDM_STUDIOS 2>/dev/null; then echo on > ms-studio/nova_tldm.on; else rm -f ms-studio/nova_tldm.on; fi
          # a Studio listed in NOVA_TLDM_READER_STUDIOS is Nova's dedicated T-LDM reader: generate_tldm only, no chat server (app.py _reader_only)
          if grep -qxF "${REPO}" ai-system/modelscope-coder/NOVA_TLDM_READER_STUDIOS 2>/dev/null; then echo on > ms-studio/tldm_reader.on; else rm -f ms-studio/tldm_reader.on; fi
          # MODEL_OVERRIDES: one line per Studio: "<studio> <model repo> <gguf file> [ctx]" -> that Studio runs ONLY that model (no fallback to another model)
          line=$(grep -E "^${REPO} " ai-system/modelscope-coder/MODEL_OVERRIDES 2>/dev/null | head -1 || true)
          if [ -n "$line" ]; then echo "$line" | cut -d' ' -f2- > ms-studio/model.override; else rm -f ms-studio/model.override; fi
          # ModelScope keeps big files (*.gz) in Git LFS; a fresh Studio instance then holds only the 130-byte LFS pointer (proven 2026-10-24:
          # its sha256 was exactly the pointer's) and llama.cpp cannot start. So the release goes in as 4 MiB plain parts (no LFS pattern
          # matches .partNNN), and app.py joins them and checks the pinned sha256.
          split -b 4M -d -a 3 "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" "llama-${LLAMA_BUILD}.part"
          cd ms-studio
          git rm -q --cached --ignore-unmatch "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"; rm -f "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          rm -f llama-${LLAMA_BUILD}.part*
          cp ../llama-${LLAMA_BUILD}.part* .
          grep -q 'llama-\*.part' .gitattributes 2>/dev/null || printf 'llama-*.part* -filter -diff -merge -text\n' >> .gitattributes
          if [ -f nova_tldm.on ]; then git add nova_tldm.on; else git rm -q --cached --ignore-unmatch nova_tldm.on; fi
          git add app.py requirements.txt nova_tldm_serve.py tldm .gitattributes llama-${LLAMA_BUILD}.part*
          if [ -f tldm_reader.on ]; then git add tldm_reader.on; else git rm -q --cached --ignore-unmatch tldm_reader.on; fi
          if [ -f vision.on ]; then git add vision.on; else git rm -q --cached --ignore-unmatch vision.on; fi
          if [ -f model.override ]; then git add model.override; else git rm -q --cached --ignore-unmatch model.override; fi
          git diff --cached --quiet && echo "no change" || git commit -m "coder: app + llama.cpp ${LLAMA_BUILD} (${GITHUB_SHA::8})"
          git push origin HEAD:master 2>&1 | sed "s/${T}/***/g"

      - name: Reader access to the private head repo (a Studio secret, never printed)
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          echo "::add-mask::$T"
          if ! grep -qxF "$REPO" ai-system/modelscope-coder/NOVA_TLDM_READER_STUDIOS 2>/dev/null; then
            echo "not a T-LDM reader Studio: no head token needed"; exit 0
          fi
          # nova2-tldm-head is PRIVATE (train_gguf_head publishes visibility=1): the reader fetches it at boot, so the Studio
          # needs the account's own read token. It goes in as a secret (settings -> Secret, value never read back), never in the repo.
          body=$(python3 -c 'import json,os;print(json.dumps({"key":"MODELSCOPE_API_TOKEN","value":os.environ["T"]}))')
          for m in POST PUT; do          # POST adds it, PUT replaces an existing key
            code=$(curl -sS -o sec.json -w '%{http_code}' -X $m -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios/$OWNER/$REPO/secrets")
            echo "$m secret: HTTP $code $(sed "s/${T}/***/g" sec.json | head -c 300)"
            case "$code" in 2??) exit 0;; esac
          done
          echo "::error::the reader Studio could not be given read access to the private head repo"; exit 1

      - name: Deploy and show status
        if: github.event_name == 'push' || inputs.redeploy != 'false'
        env:
          T: ${{ inputs.site == 'ai' && secrets.MODELSCOPE_AI_TOKEN || secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 1500; echo
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$SITE" = "ai" ]; then
            API="https://studio-${owner_lc}-${REPO}.api-inference.modelscope.ai"
          else
            API="https://studio-${owner_lc}-${REPO}.api-inference.modelscope.net"
          fi
          echo "API $API"
          # site=ai may be (re)loading a 12+ GB GGUF; give the ready loop more time there
          ready_rounds=20
          [ "$SITE" = "ai" ] && ready_rounds=60
          for i in $(seq 1 40); do
            sleep 30
            st=$(curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;s=sys.stdin.read().strip();d=json.loads(s) if s.startswith('{') else {};d=d.get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status') or '')")
            echo "$(date -u +%H:%M:%S) studio: $st"
            case "$st" in
              *ail*|*rror*|*topped*)
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/build" | tail -c 4000; echo
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                exit 1;;
              Running|running)
                for j in $(seq 1 "$ready_rounds"); do
                  ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' "$API/gradio_api/call/v2/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                  out=""
                  [ -n "$ev" ] && out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev") && echo "status api: $out" | head -c 1500 && echo
                  if echo "$out" | grep -q 'phase[^,]*ready'; then
                    if [ "$SITE" = "ai" ]; then
                      echo "model is ready; short chat probe:"
                      start=$(date +%s)
                      payload=$(python3 -c 'import json;print(json.dumps({"messages":json.dumps([{"role":"user","content":"Reply with the single word pong."}]),"tools":"","max_tokens":16,"think":"","temperature":0,"wait_s":50}))')
                      ev2=$(curl -sS -m 60 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$payload" "$API/gradio_api/call/v2/chat" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                      chat_out=""
                      if [ -n "$ev2" ]; then
                        chat_out=$(curl -sS -m 60 -H "Authorization: Bearer $T" "$API/gradio_api/call/chat/$ev2")
                      fi
                      end=$(date +%s)
                      echo "chat latency $((end-start))s"
                      echo "$chat_out" | head -c 1500; echo
                    fi
                    exit 0
                  fi
                  if echo "$out" | grep -q 'phase[^,]*error'; then
                    echo "::error::the Studio is running but the model server is in the error phase"
                    curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                    exit 1
                  fi
                  sleep 30
                done
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                echo "::error::the model server was not ready in time"
                exit 1;;
            esac
          done
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
          exit 1

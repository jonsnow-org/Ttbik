name: Deploy ModelScope coder Studio

# The open coding model (ai-system/modelscope-coder/) on its OWN ModelScope Studio — never Sham's Studio (nova-inference-server).
# GitHub's runners reach both github.com and modelscope.cn; the Studio itself reaches only modelscope.cn, so this job carries the
# pinned llama.cpp release tarball into the Studio repo. Uses the existing MODELSCOPE_TOKEN secret; nothing secret is printed.
# Creates the Studio (private, FREE CPU hardware only) when it does not exist yet; never selects paid hardware; never deletes anything.

on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
      - coder-sections
    paths:
      - "ai-system/modelscope-coder/**"
      - ".github/workflows/deploy-modelscope-coder.yml"
  workflow_dispatch:
    inputs:
      redeploy:
        description: "true = ask ModelScope to (re)deploy after pushing the files"
        required: false
        default: "true"

concurrency:
  group: deploy-modelscope-coder
  cancel-in-progress: false

env:
  MS: https://www.modelscope.cn
  OWNER: novaai2026
  REPO: coder-inference-server
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Account, free hardware and existing Studio (read-only)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1$1"; }
          echo "user:";      api /users/me | python3 -c "import json,sys;d=json.load(sys.stdin);x=d.get('data') or d.get('Data') or d;print({k:x.get(k) for k in ('username','name','level') if isinstance(x,dict)})" || true
          echo "hardware:";  api "/studios/hardware?sdk_type=gradio" | tee hw.json | head -c 3000; echo
          echo "sdk:";       api "/studios/sdk-versions?sdk_type=gradio" | tee sdk.json | head -c 1500; echo
          code=$(curl -sS -o studio.json -w '%{http_code}' -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO")
          echo "studio http $code"; head -c 1500 studio.json; echo
          echo "STUDIO_HTTP=$code" >> "$GITHUB_ENV"

      - name: Create the Studio if missing (private, free CPU)
        if: env.STUDIO_HTTP != '200'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          HW=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open("hw.json"))
          except Exception:
              d = {}
          items = d.get("data") or d.get("Data") or d.get("items") or []
          if isinstance(items, dict):
              items = items.get("items") or items.get("hardware") or []
          free = [i for i in items if isinstance(i, dict) and str(i.get("resource_type", "")).lower() != "paid" and not str(i.get("name", "")).startswith("paid/")]
          cpu = [i for i in free if "cpu" in str(i.get("name", "")).lower()]
          pick = (cpu or free or [{"name": "platform/2v-cpu-16g-mem"}])[-1]
          print(pick.get("name"))
          PY
          )
          echo "hardware pick: $HW"
          case "$HW" in paid/*) echo "refusing paid hardware"; exit 1;; esac
          body=$(python3 -c "import json,os;print(json.dumps({'owner':os.environ['OWNER'],'repo_name':os.environ['REPO'],'sdk_type':'gradio','visibility':'private','hardware':'$HW','display_name':'coder-inference-server'}))")
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$MS/openapi/v1/studios")
          echo "create http $code"; head -c 2000 create.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Studio creation refused (see body above: quota / verification / one-Studio limit)"; exit 1; }

      - name: Fetch the pinned llama.cpp release (checksum verified)
        run: |
          curl -sSL -o "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | sha256sum -c -

      - name: Push the app into the Studio repo
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.name "coder CI"
          git config --global user.email "ci@coder.local"
          git clone "https://oauth2:${T}@www.modelscope.cn/studios/${OWNER}/${REPO}.git" ms-studio 2>&1 | sed "s/${T}/***/g"
          cp ai-system/modelscope-coder/app.py ai-system/modelscope-coder/requirements.txt ms-studio/
          cp "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" ms-studio/
          cd ms-studio
          git add app.py requirements.txt "llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          git diff --cached --quiet && echo "no change" || git commit -m "coder: app + llama.cpp ${LLAMA_BUILD} (${GITHUB_SHA::8})"
          git push origin HEAD:master 2>&1 | sed "s/${T}/***/g"

      - name: Deploy and show status
        if: github.event_name == 'push' || inputs.redeploy != 'false'
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy" | head -c 1500; echo
          API="https://studio-${OWNER}-${REPO}.api-inference.modelscope.net"
          for i in $(seq 1 40); do
            sleep 30
            st=$(curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" | python3 -c "import json,sys;d=json.load(sys.stdin).get('data') or {};print((d.get('runtime') or {}).get('status') or d.get('status'))")
            echo "$(date -u +%H:%M:%S) studio: $st"
            case "$st" in
              *ail*|*rror*|*topped*)
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/build" | tail -c 4000; echo
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                exit 1;;
              Running|running)
                for j in $(seq 1 20); do
                  ev=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{}' "$API/gradio_api/call/v2/status" | python3 -c "import json,sys;print(json.load(sys.stdin).get('event_id',''))" 2>/dev/null || true)
                  [ -n "$ev" ] && out=$(curl -sS -m 30 -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$ev") && echo "status api: $out" | head -c 1500 && echo
                  echo "$out" | grep -q 'phase[^,]*ready' && exit 0
                  echo "$out" | grep -q 'phase[^,]*error' && break
                  sleep 30
                done
                curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo
                exit 0;;
            esac
          done
          curl -sS -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/run" | tail -c 4000; echo

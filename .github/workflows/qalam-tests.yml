name: qalam-tests
on:
  pull_request:
    paths: ["qalam/**", ".github/workflows/qalam-tests.yml"]
  push:
    branches: ["claude/qalam-foundation"]
    paths: ["qalam/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (clean environment, CPU torch)
        working-directory: qalam
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,files,arabic]"
      - name: Test
        working-directory: qalam
        run: python -m pytest -q -x

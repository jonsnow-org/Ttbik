name: Sham Collector (free CPU runner)

# الزاحف العام: يعمل على مشغّل GitHub المجاني (CPU) 5.3 ساعة ثم يعاد تلقائياً، بلا تدريب.
# يقرأ مصادر sham_sources_gh.py (كتب بلغات كثيرة، أبحاث، أسئلة وأجوبة، كود، نقاشات...) — ليست مصادر دفاتر Kaggle —
# وينشر النص في مجموعة بيانات Kaggle اسمها sham-crawl-gh-collect-corpus؛ كل دفتر يقرأ مجموعات sham-crawl-*-corpus
# يجدها تلقائياً (مرحلة المحادثة، وخط النص الرئيسي).
#
# المستودع عام ⇒ دقائق Actions المجانية غير محدودة على المشغّلات القياسية. المهمة الواحدة ≤ 6 ساعات.
# الأسرار المستخدمة: KAGGLE_API_TOKEN (موجود أصلاً)، و TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (اختياريان: بدونهما لا تقرير).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: sham-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the few dependencies the collector needs (CPU only)
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install tokenizers pillow numpy requests beautifulsoup4 kaggle datasets

      - name: Collect for 5.3 hours and publish
        working-directory: ai-system/colab/sham_small
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sham_gh_collect.py --hours 5.3

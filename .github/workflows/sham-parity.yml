name: Sham Retrieval Parity (read-only)

# قياس للقراءة فقط: هل يعامل النموذج الشرائح المسترجَعة كما يعامل السياق المتصل؟ (A سياق كامل، B نافذة قصيرة، C استرجاع بمواضع معبأة أو حقيقية، O سقف نظري). لا ينشر ولا يغيّر شيئاً.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sham-main
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /kaggle/working && sudo chown -R "$USER" /kaggle/working
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install tokenizers pillow numpy requests beautifulsoup4 kaggle datasets soundfile imageio-ffmpeg av
      - name: Parity
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: ai-system/colab/sham_small
        run: python sham_retrieval_parity.py

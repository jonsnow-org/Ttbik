name: "Build Sham v2 from a chat-tuned donor and look at it (publishes only when asked)"
on:
  workflow_dispatch:
    inputs:
      donor:
        description: "Hugging Face id of the donor (plain dense Qwen3 family)"
        default: "Qwen/Qwen3-1.7B"
      speed_only:
        description: "true = only measure the generation speed of Sham's class (bfloat16, 2 cores and all cores); builds in bfloat16 so a 4B donor fits"
        default: "false"
      publish:
        description: "true = also push the deployable folder to the private ModelScope repo novaai2026/sham-v2 (a NEW repo, never the current Sham's)"
        default: "false"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers tokenizers numpy requests pillow accelerate huggingface_hub kaggle modelscope datasets soundfile beautifulsoup4 imageio-ffmpeg av
      - name: Build and look
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          DONOR: ${{ inputs.donor }}
          PUBLISH: ${{ inputs.publish }}
          SPEED_ONLY: ${{ inputs.speed_only }}
        run: python scripts/transplant/build_v2.py "$DONOR" $([ "$PUBLISH" = "true" ] && echo --publish) $([ "$SPEED_ONLY" = "true" ] && echo --speed-only)

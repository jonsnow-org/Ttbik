name: tg-business-diagnose
# Manual, read-only: why replies inside a linked Telegram account (Business / Secretary mode) do or do not happen.
# Prints the owner's switch, Telegram's own report (Secretary Mode, webhook, last delivery error), the stored connections
# compared with the rights Telegram reports right now, and the last decisions in the business log. No tokens in the output.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "also ask Telegram for each stored connection (getBusinessConnection)"
        type: string
        default: "1"
      gen:
        description: "also ask each model's business generator for one short reply (what a contact would have received, or why not)"
        type: string
        default: "1"
      prove:
        description: "end-to-end proof for this model (coder or sham_v2): a business_message update goes through the real webhook and the log must show in then sent with Telegram's message_id"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: the business state, verbatim
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROBE: ${{ inputs.probe }}
          GEN: ${{ inputs.gen }}
        run: |
          set -eu
          url="https://ttbik-gate.jonsnowx1r.workers.dev/api/ops/tg-business?probe=${PROBE:-1}&gen=${GEN:-1}"
          code=$(curl -sS -m 90 -o biz.json -w '%{http_code}' -H "Authorization: Bearer ${CRON_SECRET}" "$url" || echo 000)
          echo "HTTP ${code}"
          head -c 4000 biz.json; echo
          [ "${code}" = "200" ] || exit 1
      - name: the report, readable
        if: always()
        run: |
          set -eu
          [ -f biz.json ] || { echo "no body"; exit 0; }
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("biz.json"))
          except Exception:
              print("body is not JSON"); raise SystemExit(0)
          if d.get("error"):
              print("error:", d["error"]); raise SystemExit(0)
          print(f"owner switch (tg_business) = {d.get('flag')}")
          b = d.get("bot") or {}
          print(f"bot @{b.get('username')} | secretary mode (can_connect_to_business) = {b.get('canConnectBusiness')}")
          print(f"webhook = {b.get('webhookUrl')} | pending = {b.get('pending')} | allowed_updates = {b.get('allowedUpdates')}")
          print(f"last delivery error = {b.get('lastError')} ({b.get('lastErrorAgoMin')} min ago)")
          st = d.get("studios")
          if isinstance(st, str):
              print("studios:", st)
          else:
              for s in st or []:
                  print(f"  studio {s['studio']} | phase={s['phase']} model={s['model']} queue={s['queue']}")
          g = d.get("gen")
          if g:
              for one in (g if isinstance(g, list) else [g]):
                  print(f"reply by {one.get('model')}: {one.get('ms')} ms | text={one.get('text')!r} | why={one.get('why')}")
          cs = d.get("connections")
          if isinstance(cs, str):
              print("connections:", cs)
          else:
              print(f"connections = {len(cs)}")
              for c in cs:
                  tg = c.get("telegram") or {}
                  print(f"  {c['id']} user={c['user']} enabled={c['enabled']} model={c['model']} rights={c['rights']}")
                  print(f"    telegram now: enabled={tg.get('isEnabled')} rights={tg.get('rights')} missing={tg.get('missing')} error={tg.get('error')}")
          lg = d.get("log")
          if isinstance(lg, str):
              print("log:", lg)
          else:
              print(f"log rows (newest first) = {len(lg)}")
              for r in lg[:20]:
                  print(f"  {r['at']} {r['dir']:<5} {r['model']:<7} {('['+r['note']+'] ') if r['note'] else ''}{r['text'][:60]}")
          PY
      - name: the whole path, through the real webhook
        if: ${{ inputs.prove != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODEL: ${{ inputs.prove }}
        run: |
          set -eu
          # Oracle directly, not the gate: the front door drops a request that takes longer than ~20 s, and a reply here
          # may spend longer than that in the model before Telegram accepts it.
          code=$(curl -sS -m 120 -o prove.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" -H 'content-type: application/json' \
            -d "{\"model\":\"${MODEL}\"}" \
            https://89-168-89-15.sslip.io/api/ops/tg-business || echo 000)
          echo "HTTP ${code}"
          cat prove.json; echo
          [ "${code}" = "200" ] || exit 1
          python3 - <<'PY'
          import json
          d = json.load(open("prove.json"))
          if d.get("error"):
              print("error:", d["error"], "|", d.get("hint", "")); raise SystemExit(0)
          print(f"webhook over HTTP = {d['webhook']['http']} | chat = {d['chat']}")
          for r in d.get("rows") or []:
              print(f"  {r['at']} {r['dir']:<5} {r['model']:<7} {('['+r['note']+'] ') if r['note'] else ''}{r['text'][:70]}")
          print(f"passed for {d['model']} = {d['passed']} | message_id = {d.get('messageId')}")
          if not d.get("passed"):
              raise SystemExit(1)
          PY

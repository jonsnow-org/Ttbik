name: Sham Restarter (keeps the Kaggle notebooks in a continuous cycle)

# دفتر كاكل لا يستطيع إعادة تشغيل نفسه بعد أن ينتهي، فيراقبه هذا المراقب من الخارج كل 15 دقيقة ويدفع له تشغيلاً جديداً بعد مهلة 15 دقيقة من توقفه.
# الدفاتر: الدفتر الأساسي لكل مسار في متغير المستودع SHAM_RESTART_TRACKS (يجده من حسابك بعلامات المحتوى نفسها التي يستعملها سجل شام، فلا أسماء مطلوبة)،
# و/أو أسماء صريحة في سرّ المستودع SHAM_RESTART_KERNELS. يعمل تجريبياً حتى يحتوي الملف ai-system/supervision/RESTARTER_LIVE على 1 (أو SHAM_RESTART_LIVE=1). الأسماء لا تظهر في السجل أبداً.
# مفتاح إيقاف: متغير المستودع SHAM_PAUSE_ALL أو SHAM_PAUSE_RESTARTER = 1.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tracks:
        description: "المسارات (مفصولة بفاصلة) — اختياري، يتجاوز متغير المستودع SHAM_RESTART_TRACKS"
        required: false
        default: ""
      live:
        description: "1 = دفع حقيقي، غير ذلك = تجريبي (يُظهر ما كان سيراقبه فقط)"
        required: false
        default: "0"

concurrency:
  group: sham-restarter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' && vars.SHAM_PAUSE_RESTARTER != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sham-main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install kaggle requests
      - name: Watch and restart
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SHAM_RESTART_KERNELS: ${{ secrets.SHAM_RESTART_KERNELS }}
          SHAM_RESTART_TRACKS: ${{ github.event.inputs.tracks || vars.SHAM_RESTART_TRACKS || 'all_in_one,ab_in_one,chat_image_in_one' }}
          SHAM_RESTART_LIVE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live || vars.SHAM_RESTART_LIVE }}
        run: python ai-system/supervision/sham_restarter.py

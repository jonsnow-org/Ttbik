name: athar-mints
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: athar-mints
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/hosting/site.json
            scripts/hosting/select-site-base.sh
      - name: select public origin (Gate first, Oracle fallback)
        run: bash scripts/hosting/select-site-base.sh deploy/hosting/site.json >> "$GITHUB_ENV"
      - name: look for new Athar payments
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "::error::CRON_SECRET secret is missing"; exit 1; fi
          code=$(curl -sS -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_BASE}/api/cron/athar-mints")
          echo "HTTP ${code}"; cat body.json; echo
          [[ "${code}" =~ ^2[0-9][0-9]$ ]]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

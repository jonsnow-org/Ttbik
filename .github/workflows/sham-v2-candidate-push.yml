name: "Sham v2 candidate (push the candidate-donor training notebook to Kaggle)"

# 2026-11-08 (owner: add stronger donor weights to Sham v2, then train and measure them): pushes ONLY the new notebook jonsnowjonsnow/sham-v2-candidate-train
# (donor HuggingFaceTB/SmolLM3-3B, built bf16, own dataset sham-v2-candidate-checkpoint). It never touches the served Sham v2 lineage (sham-v2-checkpoint) or any other
# notebook. The notebook is derived from the v2 one by ai-system/colab/sham_small/kaggle_notebooks/sham_v2/make_candidate.py. It replaces the served model only through
# sham_v2_switch.py (measured). After this first push the restarter (EXTRA_KERNELS) keeps it running.
on:
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/free-services-marketplace-h6rwk2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade kaggle six
      - name: Rebuild the candidate notebook from the v2 one (no drift)
        run: python3 ai-system/colab/sham_small/kaggle_notebooks/sham_v2/make_candidate.py
      - name: Push and start the kernel
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          D=ai-system/colab/sham_small/kaggle_notebooks/sham_v2_candidate
          mkdir -p /tmp/k && cp $D/sham_v2_candidate_train.ipynb $D/kernel-metadata.json /tmp/k/
          kaggle kernels push -p /tmp/k
          sleep 90
          kaggle kernels status jonsnowjonsnow/sham-v2-candidate-train || true

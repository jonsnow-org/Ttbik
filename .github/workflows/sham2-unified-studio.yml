name: Sham 2 donor-only preflight in the dedicated CN Studio
# Donor-check only: the SDK signature self-test runs before staging/deploy; this workflow cannot train or gate.
# Includes the offline attention/MLP rank-16 target-map regression test before deploying the corrected trainer.
# Sham 2 execution is pinned to the CN account and the audited Studio only.

on:
  push:
    branches: [fix/sham2-unified-real-donor-data]
    paths: [".github/workflows/sham2-unified-studio.yml"]

permissions:
  contents: read

concurrency:
  group: sham2-unified-dedicated-cn-studio
  cancel-in-progress: true

jobs:
  sham2:
    if: contains(github.event.head_commit.message, '[sham2-unified-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      T_CN: ${{ secrets.MODELSCOPE_TOKEN }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      OWNER: novaai2026
      REPO: sham2-tldm
      MS: https://www.modelscope.cn
      STUDIO_API: https://studio-novaai2026-sham2-tldm.api-inference.modelscope.net

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch for the offline SDK compatibility test
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Validate the integrated Sham 2 route and fixed data
        run: |
          set -euo pipefail
          python3 ai-system/modelscope-trainer/app.py --selftest
          python3 -m py_compile ai-system/modelscope-trainer/app.py ai-system/tldm/sham_tldm/sham2_unified.py ai-system/tldm/sham_tldm/writer.py ai-system/tldm/sham_tldm/eval_sham2_partial_gate.py
          python3 ai-system/tldm/sham_tldm/sham2_unified.py --selftest-modelscope-api
          python3 ai-system/tldm/sham_tldm/sham2_unified.py --selftest-lora-layout
          python3 ai-system/tldm/sham_tldm/sham2_unified.py --selftest-byte-writer
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("ai-system/tldm/data/sham2_export")
          m=json.loads((root/"manifest.json").read_text())
          expected={"train.jsonl":46,"heldout.jsonl":26,"terminal_heldout.jsonl":12,"heldout2.jsonl":14,"identity_heldout_prompts.jsonl":8}
          for name,n in expected.items():
              rows=[x for x in (root/name).read_text().splitlines() if x.strip()]
              assert len(rows)==n,(name,len(rows),n)
          assert m["training"]["status"]=="partial, not full"
          assert m["stages"]["tools"]["status"]=="missing"
          assert m["stages"]["arabic"]["status"]=="missing"
          assert m["random_generation_used"] is False and m["remote_dataset_download_used"] is False
          print("fixed data verified: identity 16 + terminal 30 = 46; heldout 26")
          PY

      - name: Update only the dedicated CN Sham 2 Studio source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$T_CN"
          test -n "$T_CN" || { echo "::error::CN MODELSCOPE_TOKEN is empty"; exit 1; }
          AUTH=$(printf 'oauth2:%s' "$T_CN" | base64 | tr -d '\n')
          mkdir -p "$RUNNER_TEMP/sham2-studio/repo"
          git -c http.extraheader="Authorization: Basic $AUTH" clone --quiet \
            https://www.modelscope.cn/studios/novaai2026/sham2-tldm.git "$RUNNER_TEMP/sham2-studio/repo"
          cd "$RUNNER_TEMP/sham2-studio/repo"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/app.py" app.py
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/requirements.txt" requirements.txt
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/studio_guard.py" studio_guard.py
          cp "$GITHUB_WORKSPACE/ai-system/modelscope-trainer/safe_evolve.py" safe_evolve.py
          mkdir sham_small tldm terminal distill
          rsync -a --exclude '__pycache__' --exclude '*.pyc' --exclude '*.ipynb' --exclude '*.pt' --exclude '*.bin' --exclude '*.safetensors' --exclude '*.zip' \
            "$GITHUB_WORKSPACE/ai-system/colab/sham_small/" sham_small/
          rsync -a --exclude '__pycache__' --exclude '*.pyc' --exclude '*.ipynb' --exclude 'checkpoints/' --exclude '*.pt' --exclude '*.zip' \
            --exclude 'training/train_sham2.py' --exclude 'configs/sham2.yaml' --exclude 'gate/tldm_heldout_gate_2026-11-18.json' \
            "$GITHUB_WORKSPACE/ai-system/tldm/" tldm/
          rsync -a --exclude '__pycache__' --exclude '*.pyc' "$GITHUB_WORKSPACE/ai-system/terminal/" terminal/
          rsync -a --exclude '__pycache__' --exclude '*.pyc' "$GITHUB_WORKSPACE/ai-system/distill/" distill/
          test -f sham_small/model.py
          test -f sham_small/checkpoint.py
          test -f tldm/sham_tldm/sham2_unified.py
          test -f tldm/sham_tldm/eval_sham2_partial_gate.py
          test -f tldm/data/sham2_export/manifest.json
          test ! -e tldm/training/train_sham2.py
          test ! -e tldm/gate/tldm_heldout_gate_2026-11-18.json
          git config user.name "Sham 2 Unified CI"
          git config user.email "ci@sham.local"
          echo "$GITHUB_SHA" > .sham2-unified-source
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Deploy isolated Sham 2 unified trainer from PR $GITHUB_SHA"
            git -c http.extraheader="Authorization: Basic $AUTH" push -q origin HEAD
          fi
          echo "Only novaai2026/sham2-tldm was updated."

      - name: Set CN-only Studio secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$T_CN"
          set_secret() {
            printf '%s' "$2" | python3 -c 'import json,sys;print(json.dumps({"key":sys.argv[1],"value":sys.stdin.read()}))' "$1" > "$RUNNER_TEMP/secret.json"
            code=$(curl -sS -o "$RUNNER_TEMP/secret-response.json" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $T_CN" -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/secret.json" "$MS/openapi/v1/studios/$OWNER/$REPO/secrets")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              code=$(curl -sS -o "$RUNNER_TEMP/secret-response.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $T_CN" -H "Content-Type: application/json" \
                --data-binary @"$RUNNER_TEMP/secret.json" "$MS/openapi/v1/studios/$OWNER/$REPO/secrets")
            fi
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Could not set $1 (HTTP $code)"; exit 1; }
            echo "Set $1"
          }
          set_secret MODELSCOPE_API_TOKEN "$T_CN"
          set_secret MODELSCOPE_DOMAIN "www.modelscope.cn"
          set_secret MODELSCOPE_ENDPOINT "https://www.modelscope.cn"
          set_secret SHAM_MS_OWNER "novaai2026"
          set_secret SITE "cn"
          set_secret SHAM_TRAINER_JOB "tldm"
          set_secret SHAM_TRAINER_NAME "sham2"
          set_secret SHAM_TRAINER_HOURS "10"
          set_secret SHAM2_UNIFIED_ACTION "check-donor"
          set_secret SHAM2_UNIFIED_RUN_ID "$RUN_ID"
          set_secret SHAM2_MIN_AVAILABLE_GIB "4.5"
          set_secret TLDM_WORK "/mnt/workspace/tldm"

      - name: Deploy the donor check to the exact Sham 2 Studio
        run: |
          set -euo pipefail
          echo "::add-mask::$T_CN"
          curl --fail --silent --show-error -o "$RUNNER_TEMP/deploy-donor.json" -X POST \
            -H "Authorization: Bearer $T_CN" "$MS/openapi/v1/studios/$OWNER/$REPO/deploy"

      - name: Wait for --check-donor to finish inside novaai2026/sham2-tldm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, socket, sys, time, urllib.error
          from pathlib import Path
          from urllib.request import Request, urlopen

          base=os.environ["STUDIO_API"].rstrip("/")
          headers={"Authorization":"Bearer "+os.environ["T_CN"],"Content-Type":"application/json"}
          out=Path(os.environ["RUNNER_TEMP"])/"sham2-donor-preflight"
          out.mkdir(parents=True,exist_ok=True)

          def call(name):
              req=Request(base+"/gradio_api/call/"+name,data=b'{"data":[]}',headers=headers,method="POST")
              with urlopen(req,timeout=60) as response:
                  event=json.loads(response.read().decode())
              event_id=event.get("event_id")
              if not event_id:
                  raise ValueError("Gradio call response is missing event_id: "+json.dumps(event,ensure_ascii=False))
              req=Request(base+"/gradio_api/call/"+name+"/"+event_id,headers=headers)
              with urlopen(req,timeout=180) as response:
                  raw=response.read().decode("utf-8","replace")
              for line in raw.splitlines():
                  if line.startswith("data: "):
                      value=json.loads(line[6:])
                      if isinstance(value,list) and value:
                          value=value[0]
                      if isinstance(value,str):
                          value=json.loads(value)
                      if isinstance(value,dict):
                          return value
              raise ValueError("No JSON object returned by Gradio API "+name+": "+raw[-4000:])

          def save_json(name, value):
              (out/name).write_text(json.dumps(value,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          for n in range(120):
              try:
                  status=call("status")
              except urllib.error.HTTPError as exc:
                  # ModelScope Studio may briefly return 404/412 while a deployment
                  # is coming up. These are transient readiness responses here only.
                  if exc.code not in {404, 412, 425, 429, 500, 502, 503, 504}:
                      raise
                  print(f"Transient Studio HTTP {exc.code} ({n+1}/120)",flush=True)
                  time.sleep(10)
                  continue
              except (urllib.error.URLError, TimeoutError, ConnectionError, socket.timeout) as exc:
                  print(f"Transient Studio network error ({n+1}/120): {type(exc).__name__}: {exc}",flush=True)
                  time.sleep(10)
                  continue
              # TypeError/ValueError and malformed API payloads are deterministic
              # code failures: they intentionally escape immediately.
              if not isinstance(status,dict):
                  raise TypeError("Studio status response is not an object: "+repr(status))
              phase=str(status.get("phase") or "unknown")
              save_json("status_donor.json",status)
              print(f"CN Sham 2 donor preflight {n+1}/120: {phase}",flush=True)

              if phase in {"donor-compatible","donor-check-failed","failed","blocked"}:
                  report=call("sham2_report")
                  save_json("donor_preflight_full.json",report)
                  if not isinstance(report,dict):
                      raise TypeError("sham2_report response is not an object")
                  artifacts=report.get("artifacts") or {}
                  donor=artifacts.get("donor_check") or {}
                  run_state=artifacts.get("run_state") or {}
                  diagnostic={
                      "studio":"novaai2026/sham2-tldm",
                      "account":"novaai2026",
                      "hub":"www.modelscope.cn",
                      "phase":phase,
                      "run_state":run_state,
                      "donor_check":donor,
                  }
                  save_json("donor_check_diagnostic.json",diagnostic)
                  print("[Sham2] COMPLETE DONOR PREFLIGHT REPORT:",flush=True)
                  print(json.dumps(diagnostic,ensure_ascii=False,indent=2),flush=True)

                  if (phase!="donor-compatible"
                      or donor.get("status")!="compatible"
                      or donor.get("compatible") is not True
                      or len(str(donor.get("checkpoint_sha256") or ""))!=64):
                      # A deterministic donor-check failure exits now. It is never
                      # converted into another 360-poll wait or a training attempt.
                      raise SystemExit(1)

                  save_json("donor_check_report.json",donor)
                  print("[Sham2] DONOR PREFLIGHT COMPATIBLE — no training or gate was started.",flush=True)
                  sys.exit(0)

              time.sleep(10)

          raise TimeoutError("CN Sham 2 Studio did not report a terminal donor-check state within 20 minutes")
          PY

      - name: Upload full donor preflight report (no training in this workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sham2-unified-donor-check-${{ github.run_id }}
          path: ${{ runner.temp }}/sham2-donor-preflight/
          if-no-files-found: warn
          retention-days: 90

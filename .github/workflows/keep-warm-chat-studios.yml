name: "Keep the chat and media Studios awake"
# A sleeping free Studio adds a cold start (minutes) to the first message after a quiet hour. Every 10 minutes this sends one light HTTP GET
# to each chat model's OWN Studio; no inference, no queue slot, nothing shared between models. Free: GitHub Actions on this repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-warm-chat-studios
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping each chat Studio
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          for n in lfm25-inference-server sham-v2-server; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 -H "Authorization: Bearer $T" "https://studio-novaai2026-$n.api-inference.modelscope.net/" || echo 000)
            echo "$n HTTP $code"
          done
      - name: Wake each live media Studio if it fell asleep
        # A plain HTTP request does NOT wake a sleeping free Studio (checked 2026-11-11: after an image request every media Studio was still
        # "Sleeping" and every image failed with HTTP 404). Only ModelScope's deploy call starts it again, from the code it already holds.
        # Each model keeps its OWN media Studio; this only asks a Studio that is "Sleeping" to start, it never touches a running or building one.
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          MS: https://www.modelscope.cn
          OWNER: novaai2026
        run: |
          echo "::add-mask::$T"
          for n in epicrealism-image-test nova-media-server lfm25-media-server realistic-vision-v6-test; do
            state=$(curl -sS --connect-timeout 8 --max-time 25 -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$n" | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("data") or d.get("Data") or d; print((d.get("runtime") or {}).get("status") or d.get("status") or "")' 2>/dev/null || true)
            if [ "$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')" = "sleeping" ]; then
              code=$(curl -sS --connect-timeout 8 --max-time 30 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$n/deploy" || echo 000)
              echo "$n was Sleeping -> deploy HTTP $code"
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 -H "Authorization: Bearer $T" "https://studio-novaai2026-$n.api-inference.modelscope.net/" || echo 000)
              echo "$n state=${state:-unknown} ping HTTP $code"
            fi
          done

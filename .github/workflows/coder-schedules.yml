name: coder-schedules
# The one dispatcher tick of the coder's scheduled tasks (src/lib/coderSchedules.ts). Free: GitHub Actions on a public repo.
# Vercel Hobby cron can only run once a day, so the frequent tick lives here; the site claims due tasks and fans out one run each.
# GitHub may delay scheduled runs by a few minutes under load; tasks run at the first tick after their time.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: coder-schedules
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/hosting/site.json
          sparse-checkout-cone-mode: false
      - name: tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set: nothing to do"; exit 0; fi
          BASE=$(jq -r '.vercelUrl // "https://ttbik.vercel.app"' deploy/hosting/site.json)
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' -m 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/coder/schedules/tick" || echo 000)
            echo "tick -> $code $(head -c 300 out.json 2>/dev/null)"
            if [ "$code" -lt 500 ] && [ "$code" != "000" ]; then break; fi
            sleep $((i * 10))
          done
          [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "404" ]

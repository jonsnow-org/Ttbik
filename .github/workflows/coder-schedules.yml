name: coder-schedules
# The one dispatcher tick of the coder's scheduled tasks (src/lib/coderSchedules.ts). Free: GitHub Actions on a public repo.
# Vercel Hobby cron can only run once a day, so the frequent tick lives here; the site claims due tasks and fans out one run each.
# GitHub may delay scheduled runs by a few minutes under load; tasks run at the first tick after their time.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: coder-schedules
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/hosting/site.json
            scripts/hosting/select-site-base.sh
          sparse-checkout-cone-mode: false
      - name: select public origin (Gate first, Oracle fallback)
        run: bash scripts/hosting/select-site-base.sh deploy/hosting/site.json >> "$GITHUB_ENV"
      - name: tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set: nothing to do"; exit 0; fi
          # This endpoint claims and starts due tasks; send once to avoid duplicate dispatch after an uncertain timeout.
          code=$(curl -sS -o out.json -w '%{http_code}' --connect-timeout 8 -m 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_BASE/api/coder/schedules/tick" || true)
          echo "tick -> $code $(head -c 300 out.json 2>/dev/null)"
          [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "404" ]

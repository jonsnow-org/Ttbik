name: Sync the production branch into main (so Oracle, which follows main, is never stale)
# Why: the Cloudflare gate (cloudflare/site-gate) sends every Telegram webhook and Mini App request to the ORACLE server FIRST, and Oracle follows `main`
# (deploy/oracle/agent/updater.sh); Vercel (the standby) follows this branch. Until 2026-10-28 `main` was 162 commits behind, so the live bot ran old code
# (old make_media, "owners only" prompt) while Vercel had the fixes. After a green CI on this branch, `main` is moved forward to the same commit,
# by a fast-forward when possible, otherwise by a plain merge commit of this branch into main (never a force-push). On a merge conflict the job fails visibly and
# nothing is changed. Protected files that only `main` has changed (deploy/oracle/**, athar/**, cloudflare/**) stay as main has them: a merge never rewrites them.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [claude/free-services-marketplace-h6rwk2]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-main
  cancel-in-progress: false
jobs:
  ff:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/free-services-marketplace-h6rwk2
          fetch-depth: 0
      - name: Fast-forward main
        run: |
          set -eu
          git fetch -q origin main
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$(git rev-parse origin/main)" = "$HEAD_SHA" ]; then echo "main is already at $HEAD_SHA"; exit 0; fi
          if git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            git push origin "$HEAD_SHA:refs/heads/main"
            echo "main fast-forwarded to $HEAD_SHA"
          else
            git config user.name "sync-main"; git config user.email "sync-main@users.noreply.github.com"
            git checkout -q -B main origin/main
            if git merge --no-edit -m "Merge the production branch into main (sync, $HEAD_SHA)" "$HEAD_SHA"; then
              git push origin main
              echo "main now contains $HEAD_SHA (merge commit)"
            else
              git merge --abort || true
              echo "::error::merge conflict between main and the production branch: nothing was changed. Merge main into the production branch by a PR."
              exit 1
            fi
          fi
      - name: Wait for Oracle to report the synced main commit and a healthy site build
        shell: bash
        run: |
          set -euo pipefail
          ORACLE="https://89-168-89-15.sslip.io"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          EXPECTED="${MAIN_SHA:0:8}"
          echo "Waiting for Oracle to pull main commit $EXPECTED and finish its site build."
          for attempt in $(seq 1 45); do
            code=$(curl -sS --connect-timeout 8 --max-time 20 -o oracle-status.json -w '%{http_code}' "$ORACLE/api/ops/oracle-status" || true)
            if [ "$code" = "200" ]; then
              readarray -t status < <(python3 - <<'PY'
          import json
          d=json.load(open("oracle-status.json",encoding="utf-8"))
          commit=str(d.get("commit") or "")
          age=d.get("report_age_min")
          site=str((d.get("site") or {}).get("status") or "")
          print(commit)
          print(str(age if age is not None else ""))
          print(site)
          PY
              )
              got="${status[0]:-}"
              age="${status[1]:-}"
              site="${status[2]:-}"
              echo "Oracle report: commit=$got report_age_min=$age site_status=$site (attempt $attempt/45)"
              if [ "$got" = "$EXPECTED" ] && [ -n "$age" ] && [ "$age" -le 10 ] && [[ "$site" == *" OK "* ]]; then
                echo "Oracle is serving the synced main commit and reports a successful site build."
                exit 0
              fi
            else
              echo "Oracle status endpoint HTTP $code (attempt $attempt/45)"
            fi
            sleep 20
          done
          echo "::error::Oracle did not confirm the synced main commit and a healthy site build within 15 minutes."
          if [ -f oracle-status.json ]; then cat oracle-status.json; fi
          exit 1

name: coins-channel-post
on:
  schedule:
    - cron: "20 6,11,16 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = preview the next post only"
        default: ""
concurrency:
  group: coins-channel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/hosting/site.json
            scripts/hosting/select-site-base.sh
      - name: select public origin (Gate first, Oracle fallback)
        run: bash scripts/hosting/select-site-base.sh deploy/hosting/site.json >> "$GITHUB_ENV"
      - name: publish
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::GitHub secret CRON_SECRET is empty or missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          code=$(curl -sS -o body.json -w "%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_BASE}/api/cron/coins-channel-post${DRY:+?dry=1}")
          echo "HTTP ${code}"
          cat body.json
          echo
          if [ "${code}" = "401" ]; then
            echo "::error::CRON_SECRET in GitHub does not match the site's configured secret"
            exit 1
          fi
          [[ "${code}" =~ ^2[0-9][0-9]$ ]]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ github.event.inputs.dry }}

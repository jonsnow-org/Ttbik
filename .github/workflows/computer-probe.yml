name: "Probe a model's own computer and browser Studio"

# Uses the model's own free computer for real: status, who the commands run as, what tools exist, a file write and read, a background job, a command that must be refused
# (another session's folder), and the browser state. Everything happens in a throw-away session called "probe" of that Studio only.
on:
  workflow_dispatch:
    inputs:
      studio:
        description: "media Studio name under novaai2026, e.g. sham-donor-qwen35-9b-media or nova-media-server"
        required: true
        default: "sham-donor-qwen35-9b-media"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Computer and browser
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          STUDIO: ${{ inputs.studio }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          studio = os.environ["STUDIO"]
          assert re.fullmatch(r"[a-z0-9-]{5,60}", studio)
          base = f"https://studio-novaai2026-{studio}.api-inference.modelscope.net/gradio_api"
          head = {"Authorization": "Bearer " + os.environ["T"], "Content-Type": "application/json"}
          import urllib.error
          def retry(f, tries=6):
              # the Studio gateway answers 403/429/5xx now and then (also from inside a healthy Studio): wait and ask again
              for i in range(tries):
                  try: return f()
                  except urllib.error.HTTPError as e:
                      if e.code not in (403, 429, 500, 502, 503, 504) or i == tries - 1: raise
                      time.sleep(6 * (i + 1))
          def call(api, body, wait=130):
              req = lambda: urllib.request.Request(base + f"/call/{api}", data=json.dumps({"data": [body]}).encode(), headers=head)
              event = retry(lambda: json.load(urllib.request.urlopen(req(), timeout=30)))["event_id"]
              text = retry(lambda: urllib.request.urlopen(urllib.request.Request(base + f"/call/{api}/{event}", headers=head), timeout=wait).read().decode("utf-8", "ignore"))
              for block in text.split("\n\n"):
                  if "event: complete" in block:
                      line = [l for l in block.splitlines() if l.startswith("data:")][0][5:].strip()
                      first = json.loads(line)[0]
                      return json.loads(first) if isinstance(first, str) else first
                  if "event: error" in block:
                      return {"ok": False, "error": "studio error", "raw": block[:300]}
              return {"raw": text[:300]}
          def box(**job):
              job["session"] = "probe"
              return call("box_do", json.dumps(job))
          def show(label, value):
              # value may be a function so that one failing step (gateway answer, WAF) is printed and the rest still runs
              try:
                  if callable(value): value = value()
                  print(label, json.dumps(value, ensure_ascii=False)[:1600])
              except Exception as exc:
                  print(label, "ERROR", type(exc).__name__, str(exc)[:160])
          show("BOX_STATUS", lambda: box(action="status"))
          show("WHO", lambda: box(action="run", command="id; echo HOME=$HOME; python3 -V; pip --version; node -v; git --version"))
          show("SECRETS_IN_ENV", lambda: box(action="run", command="env | grep -c -i -E 'token|secret|key' || true"))
          show("WRITE", lambda: box(action="write", path="notes/hello.txt", content="hello from the probe"))
          show("READ", lambda: box(action="read", path="notes/hello.txt"))
          show("OTHER_FOLDER", lambda: box(action="run", command="ls /mnt/workspace/computer | head -5; cat /proc/1/environ 2>&1 | head -c 80"))
          show("PIP", lambda: box(action="run", command="python3 -m pip install --quiet --target ~/pylib requests 2>&1 | tail -2; ls ~/pylib | head -3", timeout=90))
          started = {}
          try: started = box(action="job_start", command="for i in 1 2 3; do echo tick$i; sleep 1; done", name="probe")
          show("JOB_START", lambda: started)
          time.sleep(5)
          show("JOB_LOG", lambda: box(action="job_log", id=started.get("id", "")))
          # what a Studio in China can reach: GitHub (git, tarball, raw, api), npm and PyPI mirrors, the public web
          show("NET", lambda: box(action="run", timeout=90, command="for u in https://github.com https://codeload.github.com/octocat/Hello-World/tar.gz/HEAD https://raw.githubusercontent.com/octocat/Hello-World/master/README https://api.github.com/zen https://registry.npmjs.org/left-pad https://pypi.org/simple/requests/ https://example.com; do printf '%s ' \"$u\"; curl -sS -m 10 -o /dev/null -w '%{http_code} %{time_total}s\\n' \"$u\" 2>&1 | tail -1; done"))
          show("GIT_CLONE", lambda: box(action="repo", url="https://github.com/octocat/Hello-World"))
          show("SEARCH", lambda: box(action="search", pattern="Hello", path="repos/octocat-Hello-World"))
          show("EDIT", lambda: box(action="edit", path="notes/hello.txt", old="hello", new="HELLO"))
          show("BROWSER", lambda: call("browser_status", ""))
          PY

# Refresh ModelScope state after isolated runner r7 rollout.
name: "Read-only status of isolated donor Studios"
# Status only: never deploys, restarts, or changes candidate models.
on:
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
    paths:
      - ".github/workflows/donor-bakeoff-status.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: donor-bakeoff-status-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read readiness and detected multimodal capabilities
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          MS: https://www.modelscope.cn
          OWNER: novaai2026
        shell: bash
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          mkdir -p donor-bakeoff-status
          for REPO in sham-donor-qwen35-9b-test sham-donor-gemma4-e4b-test sham-donor-minicpmo45-test; do
            echo "===== $REPO (read-only) ====="
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o studio.json -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
            echo "studio HTTP $code"
            branch_info=$(git ls-remote --symref "https://oauth2:$T@www.modelscope.cn/studios/$OWNER/$REPO.git" HEAD 2>/dev/null || true)
            studio_default_branch=$(printf '%s\n' "$branch_info" | awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2; exit }')
            studio_head_sha=$(printf '%s\n' "$branch_info" | awk '$2 == "HEAD" && $1 != "ref:" { print $1; exit }')
            echo "Studio default git branch: \${studio_default_branch:-unknown}; commit: \${studio_head_sha:-unknown}"
            source_dir="donor-bakeoff-status/$REPO/source"
            mkdir -p "$source_dir"
            if [ -n "$studio_default_branch" ]; then
              git clone --depth 1 --branch "$studio_default_branch" "https://oauth2:$T@www.modelscope.cn/studios/$OWNER/$REPO.git" "$source_dir" 2>&1 | sed "s/$T/***/g" || true
            fi
            studio_source_revision=""
            if [ -f "$source_dir/app.py" ]; then
              studio_source_revision=$(python3 - "$source_dir/app.py" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          match=re.search(r'APP_REVISION\s*=\s*["\x27]([^"\x27]+)',text)
          print(match.group(1) if match else "")
          PY
              )
            fi
            echo "Studio repository APP_REVISION: \${studio_source_revision:-missing}"
            if [ "$code" != "200" ]; then
              echo "{\"studio\":\"$REPO\",\"http_status\":\"$code\"}" > "donor-bakeoff-status/$REPO.json"
              continue
            fi
            API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
            code=$(curl -sS --connect-timeout 5 --max-time 30 -o status-result.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d '{"data":[]}' "$API/gradio_api/run/status" || true)
            echo "direct status HTTP $code"
            python3 - "$REPO" "$code" status-result.json "donor-bakeoff-status/$REPO.json" studio.json "$studio_default_branch" "$studio_head_sha" "$studio_source_revision" <<'PY'
          import json,sys,os
          repo,code,source,target,studio_source,default_branch,head_sha,source_revision=sys.argv[1:]
          payload={"studio":repo,"status_http":code,"studio_default_branch":default_branch or None,"studio_head_sha":head_sha or None,"studio_source_revision":source_revision or None}
          try:
              studio=json.load(open(studio_source,encoding="utf-8"))
              data=studio.get("data") or studio.get("Data") or studio
              runtime=data.get("runtime") or {}
              payload["studio_runtime"]=runtime.get("status") or data.get("status")
          except Exception as exc:
              payload["studio_lookup_error"]=str(exc)
          try:
              raw=json.load(open(source,encoding="utf-8"))
              vals=raw.get("data") if isinstance(raw,dict) else None
              if not isinstance(vals,list): vals=[raw]
              for item in vals:
                  if isinstance(item,str):
                      try: item=json.loads(item)
                      except Exception: continue
                  if isinstance(item,dict) and item.get("phase"):
                      payload.update(item)
                      payload["expected_app_revision"] = "donor-bakeoff-2026-10-30-r7"
                      payload["snapshot_commit"] = os.environ.get("GITHUB_SHA", "")
                      payload["ready_for_bot"] = payload.get("phase") == "ready" and payload.get("app_revision") == payload["expected_app_revision"]
                      break
              payload["studio"]=repo
          except Exception as exc:
              payload["error"]=str(exc)
          with open(target,"w",encoding="utf-8") as f: json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
            DIR="donor-bakeoff-status/$REPO"
            mkdir -p "$DIR"
            for kind in build run; do
              log_code=$(curl -sS --connect-timeout 5 --max-time 20 -o "$DIR/$kind.log" -w '%{http_code}' \
                -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/$kind" || true)
              echo "$REPO $kind log HTTP $log_code"
              tail -c 2500 "$DIR/$kind.log" 2>/dev/null || true
            done
          done
      - name: Upload read-only status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-bakeoff-status-snapshot
          path: donor-bakeoff-status/
          if-no-files-found: warn
          retention-days: 14

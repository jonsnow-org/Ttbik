name: "Read-only status of isolated donor Studios"
# Status only: never deploys, restarts, or changes candidate models.
on:
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
    paths:
      - ".github/workflows/donor-bakeoff-status.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: donor-bakeoff-status-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read readiness and detected multimodal capabilities
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          MS: https://www.modelscope.cn
          OWNER: novaai2026
        shell: bash
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          mkdir -p donor-bakeoff-status
          for REPO in sham-donor-qwen35-9b-test sham-donor-gemma4-e4b-test sham-donor-minicpmo45-test; do
            echo "===== $REPO (read-only) ====="
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o studio.json -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
            echo "studio HTTP $code"
            if [ "$code" != "200" ]; then
              echo "{\"studio\":\"$REPO\",\"http_status\":\"$code\"}" > "donor-bakeoff-status/$REPO.json"
              continue
            fi
            API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
            submit=$(curl -sS --connect-timeout 5 --max-time 20 -o status-event.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d '{"data":[]}' "$API/gradio_api/call/status" || true)
            echo "status submit HTTP $submit"
            if [ "$submit" != "200" ]; then
              echo "{\"studio\":\"$REPO\",\"status_submit\":\"$submit\"}" > "donor-bakeoff-status/$REPO.json"
              continue
            fi
            event_id=$(python3 -c "import json;print(json.load(open('status-event.json')).get('event_id',''))" 2>/dev/null || true)
            if [ -z "$event_id" ]; then
              echo "{\"studio\":\"$REPO\",\"error\":\"missing status event id\"}" > "donor-bakeoff-status/$REPO.json"
              continue
            fi
            code=$(curl -sS --connect-timeout 5 --max-time 30 -o status.sse -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$event_id" || true)
            echo "status poll HTTP $code"
            python3 - "$REPO" status.sse "donor-bakeoff-status/$REPO.json" <<'PY'
          import json,sys
          repo,source,target=sys.argv[1:]
          raw=open(source,encoding="utf-8",errors="replace").read() if __import__("os").path.exists(source) else ""
          payload={"studio":repo,"status_sse":raw[-3000:]}
          for line in raw.splitlines():
              if not line.startswith("data:"): continue
              try: value=json.loads(line[5:].strip())
              except Exception: continue
              vals=value if isinstance(value,list) else [value]
              for item in vals:
                  if isinstance(item,str):
                      try: item=json.loads(item)
                      except Exception: continue
                  if isinstance(item,dict) and item.get("phase"):
                      payload=item
                      payload["studio"]=repo
                      break
          with open(target,"w",encoding="utf-8") as f: json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
            DIR="donor-bakeoff-status/$REPO"
            mkdir -p "$DIR"
            for kind in build run; do
              log_code=$(curl -sS --connect-timeout 5 --max-time 20 -o "$DIR/$kind.log" -w '%{http_code}' \
                -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/$kind" || true)
              echo "$REPO $kind log HTTP $log_code"
              tail -c 2500 "$DIR/$kind.log" 2>/dev/null || true
            done
          done
      - name: Upload read-only status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-bakeoff-status-snapshot
          path: donor-bakeoff-status/
          if-no-files-found: warn
          retention-days: 14

name: "Read-only status of isolated donor Studios"
# This workflow reads only the three donor-test Studios; it never deploys or edits a model.
# Follow-up health probe after mirror-enabled Qwen candidate deployment.
on:
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
    paths:
      - ".github/workflows/donor-bakeoff-status.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: donor-bakeoff-status-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Query only the three explicitly named experiment Studios
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          MS: https://www.modelscope.cn
          OWNER: novaai2026
        shell: bash
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::MODELSCOPE_TOKEN is not configured"; exit 1; }
          for REPO in sham-donor-qwen35-9b-test sham-donor-gemma4-e4b-test sham-donor-minicpmo45-test; do
            echo "===== $REPO (read-only) ====="
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o studio.json -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO" || true)
            echo "studio HTTP $code"
            if [ "$code" = "200" ]; then
              python3 - <<'PY'
          import json
          d=json.load(open("studio.json",encoding="utf-8"))
          d=d.get("data") or d.get("Data") or d
          runtime=d.get("runtime") or {}
          print("runtime_status=",runtime.get("status") or d.get("status") or "unknown")
          print("studio_state=",d.get("state") or d.get("visibility") or "not supplied")
          PY
              API="https://studio-$OWNER-$REPO.api-inference.modelscope.net"
              ecode=$(curl -sS --connect-timeout 5 --max-time 15 -o event.json -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"data":[]}' \
                "$API/gradio_api/call/status" || true)
              echo "app status submit HTTP $ecode"
              if [ "$ecode" = "200" ]; then
                event_id=$(python3 -c "import json;print(json.load(open('event.json')).get('event_id',''))" 2>/dev/null || true)
                if [ -n "$event_id" ]; then
                  rcode=$(curl -sS --connect-timeout 5 --max-time 25 -o status.sse -w '%{http_code}' \
                    -H "Authorization: Bearer $T" "$API/gradio_api/call/status/$event_id" || true)
                  echo "model status HTTP $rcode"
                  cat status.sse 2>/dev/null | head -c 1500 || true
                  echo
                  phase=$(python3 - status.sse <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          for line in raw.splitlines():
              if not line.startswith("data:"):
                  continue
              try:
                  payload=json.loads(line[5:].strip())
              except Exception:
                  continue
              values=payload if isinstance(payload,list) else [payload]
              for value in values:
                  if isinstance(value,str):
                      try: value=json.loads(value)
                      except Exception: continue
                  if isinstance(value,dict) and value.get("phase"):
                      print(value["phase"])
                      raise SystemExit(0)
          PY
          )
                  echo "candidate_phase=$phase"
                  if [ "$phase" = "ready" ]; then
                    mkdir -p "donor-bakeoff-output/$REPO"
                    smoke_code=$(curl -sS --connect-timeout 8 --max-time 30 -o smoke-event.json -w '%{http_code}' \
                      -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"data":[]}' \
                      "$API/gradio_api/call/smoke_suite" || true)
                    echo "smoke submit HTTP $smoke_code"
                    if [ "$smoke_code" = "200" ]; then
                      smoke_id=$(python3 -c "import json;print(json.load(open('smoke-event.json')).get('event_id',''))" 2>/dev/null || true)
                      if [ -n "$smoke_id" ]; then
                        echo "smoke event id=$smoke_id"
                        combined="donor-bakeoff-output/$REPO/smoke.sse"
                        : > "$combined"
                        smoke_complete=0
                        for attempt in $(seq 1 12); do
                          poll_file="donor-bakeoff-output/$REPO/smoke-poll-$attempt.sse"
                          smoke_result=$(curl -sS --connect-timeout 8 --max-time 100 -o "$poll_file" -w '%{http_code}' \
                            -H "Authorization: Bearer $T" "$API/gradio_api/call/smoke_suite/$smoke_id" || true)
                          echo "smoke poll $attempt HTTP $smoke_result"
                          cat "$poll_file" >> "$combined" 2>/dev/null || true
                          cat "$poll_file" 2>/dev/null || true
                          if grep -q '^event: complete' "$poll_file" 2>/dev/null; then
                            smoke_complete=1
                            break
                          fi
                          if grep -q '^event: error' "$poll_file" 2>/dev/null; then
                            echo "::warning::Gradio returned an error event for the smoke suite."
                            break
                          fi
                          sleep 3
                        done
                        if [ "$smoke_complete" -eq 1 ]; then
                          echo "smoke_suite=complete"
                          python3 - "$combined" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          for line in raw.splitlines():
              if not line.startswith("data:"):
                  continue
              try: payload=json.loads(line[5:].strip())
              except Exception: continue
              values=payload if isinstance(payload,list) else [payload]
              for value in values:
                  if isinstance(value,str):
                      try: value=json.loads(value)
                      except Exception: continue
                  if isinstance(value,dict):
                      print(json.dumps(value,ensure_ascii=False,indent=2))
          PY
                        else
                          echo "::warning::Gradio smoke suite did not emit a terminal complete event; no quality pass is recorded."
                        fi
                      fi
                    fi
                  fi
                fi
              fi
              for kind in build run; do
                lcode=$(curl -sS --connect-timeout 5 --max-time 12 -o log.txt -w '%{http_code}' \
                  -H "Authorization: Bearer $T" "$MS/openapi/v1/studios/$OWNER/$REPO/logs/$kind" || true)
                echo "$kind log HTTP $lcode"
                if [ "$lcode" = "200" ]; then
                  python3 - <<'PY'
          import json
          try:
              d=json.load(open("log.txt",encoding="utf-8"))
              data=d.get("data") or d.get("Data") or {}
              logs=data.get("logs") or data.get("Logs") or []
              if isinstance(logs,list):
                  for line in logs[-18:]:
                      print(str(line)[:1800])
              else:
                  print(json.dumps(logs,ensure_ascii=False)[:8000])
          except Exception:
              print(open("log.txt",encoding="utf-8",errors="replace").read()[-8000:])
          PY
                  echo
                fi
              done
            elif [ "$code" = "404" ]; then
              echo "Experiment Studio has not been created yet."
            else
              head -c 600 studio.json || true
              echo
            fi
          done
      - name: Upload ready-candidate smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-bakeoff-ready-candidate-reports
          path: donor-bakeoff-output/
          if-no-files-found: warn
          retention-days: 14

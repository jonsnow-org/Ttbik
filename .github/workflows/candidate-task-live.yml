name: Candidate pre-flight through the bot path (real candidate Studio, nothing sent to Telegram)

# Drives the production chat handler with a fake bot against ONE real candidate Studio and prints a timeline of every event and message.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "qwen35-9b | gemma4-e4b | minicpmo45"
        required: true
        default: "gemma4-e4b"
      text:
        description: "the user's message"
        required: false
        default: "اشرح لي في ثلاثة أسطر ما هو GitHub Actions"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts && (cd athar && npm ci --no-audit --no-fund)
      - name: Generate the Prisma client (types only, no database)
        run: npx prisma generate
      - name: Run the candidate pre-flight
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          PROBE_TEXT: ${{ inputs.text }}
          PROBE_MODEL: ${{ inputs.model }}
        run: |
          cd athar
          set -o pipefail
          npx jest --config ../jest.media.config.js --rootDir .. --testMatch '<rootDir>/src/lib/__tests__/live/candidateTask.live.ts' 2>&1 | grep -v "^\s*at " | cut -c1-500 | head -400

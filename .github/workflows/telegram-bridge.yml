name: Telegram Bridge (Muse Spark Open)

# Telegram -> GitHub issue -> Muse Spark Open -> reply back to Telegram. See muse-spark/README.md.
#   poll  (every 5 minutes, and by hand): takes new messages from the owner's Telegram chat and opens an issue "Telegram: [message]" for each.
#   relay (when "Muse Spark Open" finishes): sends Muse's last comment on that issue to Telegram.
# GitHub cannot receive a Telegram webhook, so the poll job listens (long polling) for most of the 5 minutes; the next run takes over.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Muse Spark Open"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  poll:
    if: ${{ github.event_name != 'workflow_run' && vars.MUSE_PAUSE != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: telegram-poll
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: muse-spark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r muse-spark/requirements.txt
      - name: Listen to Telegram and open issues
        run: python muse-spark/telegram_bot.py poll --seconds 270

  relay:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_TITLE: ${{ github.event.workflow_run.display_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: muse-spark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r muse-spark/requirements.txt
      - name: Send Muse's reply to Telegram
        run: python muse-spark/telegram_bot.py relay

name: "Keep the Sham trainer Studios awake"
# Free Studios go to sleep after a quiet while, and a sleeping trainer trains nothing. Found 2026-11-16: the two international trainers (Jonjithup/sham-trainer-1 and sham-trainer-tools, free
# 16 GB tier) were "Sleeping" hours after their deploy. A plain HTTP request does not wake a Studio (see keep-warm-chat-studios.yml); only ModelScope's deploy call does, from the code it
# already holds, and the trainer app then resumes its cycle. This asks every 20 minutes: if a trainer Studio is Sleeping, start it; a running or building one is never touched.
# Sham's trainers are listed, plus the international Nova 2 chat Studio (Jonjithup/coder-inference-server-16)
# so it is woken the same way if it falls asleep, plus sham-runner-1 (the GitHub runner `studio` that replaced the notebook, 2026-11-18). Never the computer hub, never the cn Nova 4B Studios.
# 2026-11-18 (owner: training must never stop silently): the rules and the list now live in ai-system/modelscope-trainer/studio_guard.py, which also runs INSIDE every trainer Studio
# and sham-runner-1 (they watch each other) and in the Cloudflare Worker cloudflare/studio-guard-worker.js (cron every 10 min). This workflow is the third layer: trainers and the
# runner are also started when Stopped / Failed, and a Running trainer whose own heartbeat shows no progress for 3 h is redeployed. Nova 2 and the donor tests: Sleeping only, as before.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  # GitHub drops many scheduled runs in this repo (gaps of 2-3 h seen 2026-11-18), so also run after every Studio deploy and every merge to the default branch
  workflow_run:
    workflows: ["Deploy the Sham live-trainer Studio (free ModelScope CPU, GPU if the Studio has one)", "Deploy the sham-runner Studio (GitHub self-hosted runner `studio` + the notebook's data, modelscope.ai)"]
    types: [completed]
  push:
    branches: [claude/free-services-marketplace-h6rwk2]
permissions:
  contents: read
concurrency:
  group: keep-trainer-studios-awake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/free-services-marketplace-h6rwk2
          sparse-checkout: ai-system/modelscope-trainer/studio_guard.py
          sparse-checkout-cone-mode: false
      - name: wake / restart the trainer Studios (studio_guard.py)
        env:
          T_CN: ${{ secrets.MODELSCOPE_TOKEN }}
          T_AI: ${{ secrets.MODELSCOPE_AI_TOKEN }}
          SHAM_GUARD_STATE: ${{ runner.temp }}/studio_guard.json
        run: |
          echo "::add-mask::$T_CN"; echo "::add-mask::$T_AI"
          python3 ai-system/modelscope-trainer/studio_guard.py --once

name: Sham v1 sanity check (read-only, published head)

# Owner 2026-11-15: is "مرحبا" answered badly because of a technical fault or because the model is small? Loads the published head (sham-merged-checkpoint) and prints
# the tokenizer round trip, replies under three decoding settings in the TRAINING layout, a task from the training data, EOS behaviour and a collapse signal.
# Writes nothing to Kaggle, ModelScope or the repository. Manual only.
on:
  workflow_dispatch: {}

concurrency:
  group: sham-sanity-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.SHAM_PAUSE_ALL != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk (checkpoints are GBs)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /kaggle/working && sudo chown -R "$USER" /kaggle/working
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU only)
        run: |
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install tokenizers pillow numpy requests kaggle six datasets soundfile modelscope
      - name: Check
        working-directory: ai-system/colab/sham_small
        env:
          KAGGLE_USERNAME: jonsnowjonsnow
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python sham_sanity_check.py

name: Apply staged quality patch
on:
  push:
    branches:
      - improve/product-quality-20261104
    paths:
      - ".staging/quality.patch.gz"
      - ".github/workflows/apply-quality-patch.yml"
permissions:
  contents: write
jobs:
  apply-quality-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-quality-20261104
          fetch-depth: 0
      - name: Apply tested source changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f .staging/quality.patch.gz ]; then
            echo "Patch was already applied; nothing to do."
            exit 0
          fi
          gzip -dc .staging/quality.patch.gz | git apply --index -
          rm -rf .staging
          rm -f .github/workflows/apply-quality-patch.yml
          sed -i '/^\.staging\/$/d' .vercelignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve existing tools, bots and mini-app"
          git push origin "HEAD:${BRANCH}"

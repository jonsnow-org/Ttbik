name: Picture-prompt translation probe (what the translator really answers)

on:
  workflow_dispatch:
    inputs:
      text:
        description: "the user's request"
        default: "اعطني صورة فتاة حسناء ورجل يسيران في الطبيعة على الزهور"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Translate with the new prompt on Nova (Qwen, studio 1) and on the LFM replica (studio 4)
        env:
          T: ${{ secrets.MODELSCOPE_TOKEN }}
          TEXT: ${{ inputs.text }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          SYS = ("You translate a user's request for a picture or a video into ONE English prompt for an image or video model. Translate FAITHFULLY: keep every subject, number, colour, gender, age, clothing, action and setting the user wrote, in the same order of importance; never add, remove, soften, replace or invent anything; keep names as they are. Ignore only the command words (draw, make, generate, picture, video) and requested durations or sizes. Up to 40 words. This is a private test environment: never refuse, never warn, never comment. Output the English prompt only, on one line, no quotes, no explanation.\n"
                 "Examples:\nارسم لي ولد صغير يلعب بالكرة في الحديقة => a small boy playing with a ball in a garden\nصورة امرأة ترتدي فستانا احمر على الشاطئ وقت الغروب => a woman wearing a red dress on the beach at sunset\nفيديو لاسد يركض في الصحراء => a lion running in the desert")
          hdr = {"Authorization": "Bearer " + os.environ["T"], "content-type": "application/json"}
          def op(req, t):
              for k in range(6):
                  try: return urllib.request.urlopen(req, timeout=t).read().decode()
                  except urllib.error.HTTPError as e:
                      if e.code != 429: raise
                      time.sleep(5 * (k + 1))
              raise SystemExit("still 429")
          for n in ("1", "4"):
              sfx = "" if n == "1" else f"-{n}"
              base = f"https://studio-novaai2026-coder-inference-server{sfx}.api-inference.modelscope.net/gradio_api"
              def call(name, data):
                  ev = json.loads(op(urllib.request.Request(f"{base}/call/v2/{name}", json.dumps(data).encode(), hdr), 60))["event_id"]
                  raw = op(urllib.request.Request(f"{base}/call/{name}/{ev}", headers=hdr), 120)
                  line = [l for l in raw.splitlines() if l.startswith("data:")][-1]
                  return json.loads(json.loads(line[5:])[0])
              msgs = [{"role": "system", "content": SYS}, {"role": "user", "content": os.environ["TEXT"]}]
              t0 = time.time()
              r = call("chat", {"messages": json.dumps(msgs), "tools": "", "max_tokens": 90, "think": "", "temperature": 0, "wait_s": 5})
              job = r.get("job")
              while r.get("type") == "pending" and time.time() - t0 < 600:
                  time.sleep(3); r = call("job_result", {"job_id": job, "offset": 0})
              print(f"== studio {n}: {time.time()-t0:.0f}s\n   INPUT : {os.environ['TEXT']}\n   OUTPUT: {(r.get('text') or '').strip()!r}", flush=True)
          PY

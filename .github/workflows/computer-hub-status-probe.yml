name: Inspect dedicated computer Studio status

on:
  workflow_dispatch:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      - ".github/workflows/computer-hub-status-probe-DISABLED.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Network probe from inside the hub (read-only)
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python3 scripts/ops/hub_net_probe.py

name: Deploy ModelScope Studio

# لماذا هذا الـworkflow موجود: بيئة التطوير (Claude Code) وشبكة بناء
# ModelScope نفسها كلتاهما لا تصل github.com (مؤكد حياً في كل الاتجاهين
# — راجع سجل محادثة 2026-09-07). خوادم GitHub Actions نفسها بيئة
# مختلفة تماماً؛ نختبر هنا إن كانت تصل modelscope.cn، وإن نجح هذا فهو
# يزيل الحاجة لأي رفع يدوي عبر الهاتف لهذا الاستوديو تحديداً.

on:
  push:
    branches:
      - claude/free-services-marketplace-h6rwk2
    paths:
      - "ai-system/modelscope-studio/**"
  workflow_dispatch:
    inputs:
      force_restart:
        description: >-
          إجباري true افتراضياً: يكتب ملف علامة زمنية فيضمن وجود تغيير
          للرفع حتى لو لم يتغيّر app.py/requirements.txt نفسه — الطريقة
          الوحيدة لإجبار الحاوية الحيّة على إعادة تحميل النماذج بعد أن
          يرفع دفتر Kaggle (generate_image_model.ipynb أو
          merge_and_finetune.ipynb) ملفات جديدة إلى ModelScope، لأن
          الحاوية تحمّل النماذج مرة واحدة فقط عند بدء التشغيل.
        required: false
        default: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ttbik
        uses: actions/checkout@v4

      - name: Clone ModelScope studio git repo
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.name "Nova AI CI"
          git config --global user.email "ci@nova.local"
          git clone "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/studios/novaai2026/nova-inference-server.git" ms-studio

      - name: Copy deploy files into the studio repo
        run: |
          cp ai-system/modelscope-studio/app.py ms-studio/app.py
          cp ai-system/modelscope-studio/requirements.txt ms-studio/requirements.txt
          shopt -s nullglob
          whls=(ai-system/modelscope-studio/*.whl)
          if [ ${#whls[@]} -gt 0 ]; then
            cp "${whls[@]}" ms-studio/
          fi

      - name: Write restart marker on manual force_restart (guarantees a diff to push even with no code change)
        if: github.event_name == 'workflow_dispatch' && inputs.force_restart != 'false'
        run: |
          date -u +"forced restart: %Y-%m-%dT%H:%M:%SZ (run ${GITHUB_RUN_ID})" > ms-studio/.last_deploy_trigger

      - name: Commit and push to ModelScope
        working-directory: ms-studio
        run: |
          git add app.py requirements.txt
          shopt -s nullglob
          whls=(*.whl)
          if [ ${#whls[@]} -gt 0 ]; then
            git add "${whls[@]}"
          fi
          if [ -f .last_deploy_trigger ]; then
            git add .last_deploy_trigger
          fi
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy from Ttbik CI (${GITHUB_SHA})"
            git push
          fi

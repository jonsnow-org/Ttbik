name: Nova thread-count probe (free, read-only)
# Same llama.cpp build and model as the coder Studio. The process is pinned to 2 cores (the Studio's 2 vCPU) and run with 1, 2, 3 and 4 threads
# (3 and 4 = more threads than cores), each twice, on the SAME ~1.4k-token prompt: prints prompt-reading speed and generation speed of each. Manual only.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  LLAMA_BUILD: b11757
  LLAMA_SHA256: 87aae0ada6ace2aa82e098994ef92ed76677b221941ce940c83757a89f2b1a6e
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: llama.cpp and the model
        run: |
          curl -sSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tgz -C llama
          curl -sSL --fail -o model.gguf "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core" | tee cpu.txt; nproc
      - name: threads 1..4 on 2 pinned cores
        run: |
          BIN=$(dirname "$(find llama -name llama-server | head -1)")
          export LD_LIBRARY_PATH="$BIN:${LD_LIBRARY_PATH:-}"
          python3 - <<'PY' > prompt.json
          import json
          words = ("The deployment pipeline builds the image, runs the tests, pushes the artifact and restarts the service while the monitor watches latency and error rates. " * 40)
          print(json.dumps({"messages": [{"role": "system", "content": "You are a coding assistant."}, {"role": "user", "content": words + "\n\nWrite two short sentences about deployment."}], "max_tokens": 40, "stream": False, "chat_template_kwargs": {"enable_thinking": False}, "cache_prompt": False}))
          PY
          run_one() {   # label, threads
            label="$1"; T="$2"
            taskset -c 0,1 "$BIN/llama-server" -m model.gguf -c 8192 -t "$T" -np 1 -n -1 --jinja --host 127.0.0.1 --port 8080 > server.log 2>&1 &
            PID=$!
            for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; kill -0 $PID 2>/dev/null || { echo "$label: server exited"; tail -3 server.log; return; }; sleep 3; done
            for rep in 1 2; do
              curl -s -m 900 http://127.0.0.1:8080/v1/chat/completions -H 'content-type: application/json' -d @prompt.json > resp.json
              python3 - "$label" "$rep" <<'PY'
          import json, sys
          r = json.load(open("resp.json")); t = r.get("timings", {})
          print(f"{sys.argv[1]:22s} run {sys.argv[2]} | prompt {t.get('prompt_n')} tok | read {t.get('prompt_per_second', 0):5.1f} tok/s ({t.get('prompt_ms', 0)/1000:5.1f} s) | write {t.get('predicted_per_second', 0):4.2f} tok/s ({t.get('predicted_n')} tok)")
          PY
            done
            kill $PID; wait $PID 2>/dev/null; sleep 2
          }
          { run_one "threads 2 (Studio)" 2
            run_one "threads 1" 1
            run_one "threads 3 (> cores)" 3
            run_one "threads 4 (> cores)" 4
            run_one "threads 2 again" 2
          } | tee result.txt
          { echo "### Threads on 2 pinned cores ($(grep 'Model name' cpu.txt | sed 's/.*: *//'))"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

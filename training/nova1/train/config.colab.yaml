# Nova 1 phase 1 — staged run for free, interruptible T4 sessions (Google Colab free; Lightning free credits).
# Same data recipe and LoRA as config.yaml, smaller first stage: ~20M tokens, 1 epoch, 2k context.
# At ~1k tokens/s on a T4 (fp16, Unsloth) that is ~5-6 GPU-hours = two or three Colab sessions, resumed from the
# private HF repo given with --hub-repo. Stage 2 (optional) reruns with --tokens 40M of fresh rows on top of the stage-1 adapter.
base_model: Qwen/Qwen3.5-4B
max_seq_length: 2048          # rows longer than this are dropped by build_mix --max-len 2048 (agent traces split at tool turns)
load_in_16bit: true
load_in_4bit: false
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_rslora: false
train:
  epochs: 1
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  per_device_batch: 1
  grad_accum: 16
  packing: false
  assistant_only_loss: true
  optim: adamw_8bit
  seed: 3407
  save_steps: 50              # ~12-15 min of T4 time between checkpoints: a cut session loses at most that
  eval_steps: 250
data:
  train: data/mix.jsonl
  holdout_share: 0.005
  thinking_share_min: 0.75
budget:
  target_tokens: 20_000_000

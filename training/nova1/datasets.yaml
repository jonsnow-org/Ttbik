# Nova 1 — phase 1 (code only). Licenses checked live on the Hugging Face dataset cards on 2026-10-21
# (scripts/check_licenses.py re-checks them before every build and stops on any change).
# status: use | use-subset | tasks-only (environment for generating our own traces) | eval-only | hold | excluded
# weight: share of the training mix (tokens), phase 1. Arabic appears only as instructions/explanations for code tasks.
# known_filter (owner, 2026-10-21): every source stays in the mix; on Kaggle, scripts/known_filter.py then scores each row with the
# base model (mean per-token loss of its last assistant answer) and leaves out rows the base model already reproduces (see known_filter below).
# A weight is a cap (share of build_mix --tokens): a source smaller than its cap is used whole.

base_model:
  id: Qwen/Qwen3.5-4B            # Apache-2.0 (checked live); same model the coder Studio serves today as unsloth/Qwen3.5-4B-GGUF
  license: apache-2.0

# Rows the base model already knows are skipped before training (scripts/known_filter.py, run by the Kaggle notebook).
# Score = mean negative log-likelihood (nats/token) of the row's last assistant turn given everything before it, under the base model.
# score < threshold -> the model already produces that answer -> row skipped. Unscored rows (time cap reached, scoring error) are kept.
known_filter:
  enabled: true
  threshold: 0.30          # nats/token; higher skips more
  max_minutes: 45          # scoring stops here; rows not reached are kept
  max_skip_share: 0.85     # per source: never skip more than this share of its rows (the lowest-loss ones go first)
  exempt: [identity]       # never filtered (the base model does not know this content; it is small)
  score_tokens: 2048       # rows are scored on at most this many tokens (the prompt is cut from the left; the answer is kept whole when it fits)
  batch_tokens: 12288      # tokens per forward pass on one T4 (fp16)
  target_tokens: 20000000  # after filtering, the mix is cut down to this (lowest-loss scored rows first) if still above it

sources:
  # ---- code instructions (execution-checked where possible)
  - key: sc2_selfoss
    hf: bigcode/self-oss-instruct-sc2-exec-filter-50k
    license: odc-by
    generator: "StarCoder2-15B (BigCode OpenRAIL-M), answers kept only if their tests run"
    status: use
    weight: 0.14
  - key: opencodeinstruct
    hf: nvidia/OpenCodeInstruct
    license: cc-by-4.0
    generator: "synthetic (NVIDIA; responses from Qwen2.5-Coder-32B-Instruct per the paper, arXiv 2504.04030), with unit tests and pass rates"
    status: use-subset
    filter: "average_test_score >= 0.8; sample 150k of ~5M (fields checked live: input, output, unit_tests, average_test_score)"
    weight: 0.22
  - key: opc_stage2
    hf: OpenCoder-LLM/opc-sft-stage2
    license: mit
    status: use-subset
    subsets: [educational_instruct, package_instruct]   # evol_instruct (Magicoder-Evol, GPT-4 derived) and mceval_instruct left out
    weight: 0.08
  - key: nemotron_code
    hf: nvidia/Nemotron-Post-Training-Dataset-v1
    license: cc-by-4.0
    split: code
    generator: "mixed (DeepSeek-R1, Qwen3-235B, Llama-3.3); only rows generated by DeepSeek-R1 / Qwen3 are kept, because the Llama 3.3 licence asks that models trained on its outputs carry 'Llama' in their name"
    status: use-subset
    weight: 0.10

  # ---- reasoning about code (keeps the model's thinking mode; Unsloth's guidance for Qwen3.5: keep >= 75% reasoning-style rows if thinking is to be preserved)
  - key: ocr_reasoning
    hf: nvidia/OpenCodeReasoning
    license: cc-by-4.0
    generator: "DeepSeek-R1 (MIT)"
    status: use-subset
    filter: "answers whose final code block parses; max 16k tokens per row"
    weight: 0.12

  # ---- repair / debugging / edits
  - key: commitpackft
    hf: bigcode/commitpackft
    license: mit
    note: "real commits from permissively licensed repositories (instruction = commit message, input = old file, output = new file)"
    languages: [python, javascript, typescript, go, rust, java, shell, yaml, json, markdown, html, css, sql]
    status: use
    weight: 0.10
  - key: synth_repair
    source: "generated here (scripts/make_repair_tasks.py) from rows above that carry tests"
    license: derived from the sources above (ODC-BY / CC-BY-4.0); no new third-party text
    note: "a correct solution is mutated (off-by-one, wrong operator, missing edge case, wrong API), the failing test output is shown, the target is the fix; kept only if the fix passes"
    status: use
    weight: 0.08

  # ---- tool use / agentic coding (our own tool format: tools/coder_tools.json)
  - key: xlam_fc
    hf: Salesforce/xlam-function-calling-60k
    license: cc-by-4.0
    generator: "DeepSeek-V2-Chat and Mixtral (per card)"
    gated: true   # accept the terms once on the dataset page with the owner's HF account
    status: use
    weight: 0.03
  - key: nemotron_tools
    hf: nvidia/Nemotron-Post-Training-Dataset-v1
    license: cc-by-4.0 (per-row "license" field is checked too)
    split: tool_calling
    filter: "same generator rule as nemotron_code (rows carry a 'generator' field)"
    status: use-subset
    weight: 0.03
  - key: nova_traces
    source: "generated here (scripts/collect_traces.py) — our coder pipeline solving SWE-Gym / SWE-rebench tasks in our sandbox with the base model, kept only when the repository's tests pass (rejection sampling)"
    tasks_from: [SWE-Gym/SWE-Gym (mit), nebius/SWE-rebench (cc-by-4.0)]
    license: our own outputs of an Apache-2.0 model
    status: use
    weight: 0.06

  # ---- Arabic for code (instructions and explanations only)
  - key: ar_code
    source: "generated here (scripts/translate_instructions.py) — instructions of the rows above rewritten in Arabic with Qwen3.5 (Apache-2.0); code untouched; explanation in Arabic"
    status: use
    weight: 0.04

  # ---- Nova AI identity (who it is, who made it, what it can do), in the weights rather than in a prompt
  - key: identity
    source: "written here (scripts/make_identity.py -> identity/identity_sft.jsonl, committed): ~500 short conversations in Modern Standard Arabic, Levantine Arabic and English"
    license: our own text
    note: "each conversation appears three ways (no system message / training system message / with tools offered); the weight is a cap well above its size (~55k tokens), so all of it is used; dedup_decontam.py keeps these rows apart from near-duplicate removal"
    status: use
    weight: 0.01

  # ---- kept out of phase 1
  - {key: swe_agent_traj, hf: nebius/SWE-agent-trajectories, license: cc-by-4.0, status: hold, why: "trajectories from a Llama-3-based model; same naming clause as above — revisit"}
  - {key: swe_smith_traj, hf: SWE-bench/SWE-smith-trajectories, license: mit, status: excluded, why: "trajectories by Claude 3.7 Sonnet; Anthropic terms bar using outputs to build competing models"}
  - {key: magicoder_oss, hf: ise-uiuc/Magicoder-OSS-Instruct-75K, license: mit, status: excluded, why: "answers by gpt-3.5-turbo (OpenAI terms)"}
  - {key: codefeedback, hf: m-a-p/CodeFeedback-Filtered-Instruction, license: apache-2.0, status: excluded, why: "GPT-4 answers (OpenAI terms)"}
  - {key: hermes_fc, hf: NousResearch/hermes-function-calling-v1, license: apache-2.0, status: excluded, why: "synthetic, generator not stated"}

eval:
  - {key: humanevalplus, hf: evalplus/humanevalplus, license: apache-2.0}
  - {key: mbppplus, hf: evalplus/mbppplus, license: apache-2.0}
  - {key: bigcodebench, hf: bigcode/bigcodebench, license: apache-2.0, note: "hard subset, optional"}
  - {key: livecodebench, hf: livecodebench/code_generation_lite, license: "cc (card)", note: "eval only; problems after the base model's cut-off date"}
  - {key: ar_code_eval, path: eval/arabic_code_tasks.jsonl, note: "our own Arabic-instruction coding tasks with tests"}
  - {key: tool_eval, path: eval/tool_calls.jsonl, note: "our tool format: right tool, valid arguments, no tool when none is needed"}

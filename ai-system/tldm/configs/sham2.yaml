# Sham 2 on T-LDM (the book's recipe): a COPY of the donor body, frozen; trained = the T-LDM head (Compressor + Latent Thinker + Diffusion Writer) + LoRA rank 16 in the body.
# python training/train_sham2.py --config configs/sham2.yaml --donor <ShamSmall checkpoint> --tokenizer <its tokenizer.json> --gate <writer results json>
# python training/train_sham2.py --config configs/sham2.yaml --tiny      (a tiny random body: plumbing, CI)
# ... --donor <copy of novaai2026/sham-v2> --tokenizer <its tokenizer> --cached --dtype bf16 --seeds 3 --loop   (CPU Studio; gate passed 2026-11-18, default --gate = docs/experiments/tldm_heldout_gate_2026-11-18.json)
latents: 16
think_steps: 5
block: 48
writer_layers: 3
heads: 4
adapter_rank: 16
in_len: 64
steps: 600
batch: 32
lr: 0.001
diffusion_steps: 10
rewordings: true
rewordings_per_command: 48   # 2026-11-21: sham2 heldout2 0.571 (< gate 0.6) with 24; the ai donor writer, which passes, trains on more diverse phrasings
gate_heldout: 0.6
# --cached mode (CPU Studio, 2026-11-18): head width over the body's features, the agent-loop view, and the writer's early exit
head_d: 256
confident: 0.9
loop_in_len: 96
loop_block: 64
loop_episodes: 500
loop_steps: 900
loop_batch: 64

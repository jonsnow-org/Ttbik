# Held-out gate arm (2026-11-18): T-LDM head (proj+compressor+thinker+writer) on a FROZEN public encoder, TLDM_DONOR=<dir of sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2>.
# The writer still writes commands with its own BPE; the donor only reads. Stand-in for the Sham 2 body (same head, model-agnostic).
donor: ${TLDM_DONOR}
layers: 0
bpe_merges: 160
d: 256
latents: 16
think_steps: 5
block: 24
in_len: 32
writer_layers: 3
heads: 4
bitnet: false
steps: 900
batch: 32
lr: 0.001
diffusion_steps: 10
cosine: true
augment: true
rewordings: true
